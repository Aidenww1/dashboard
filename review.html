<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Weekly Review</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --accent: #E07658;
  --accent-green: #1D9E75;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text-secondary); font-family:var(--font); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
body { min-height:100vh; overflow-x:hidden; }

body::before {
  content:''; position:fixed; inset:0;
  background: radial-gradient(60% 50% at 82% 14%, rgba(224,118,88,0.10) 0%, transparent 60%),
              radial-gradient(50% 40% at 18% 90%, rgba(29,158,117,0.06) 0%, transparent 60%);
  filter:blur(40px); pointer-events:none; z-index:0;
}

main { position:relative; z-index:2; max-width:680px; margin:0 auto; padding:56px 16px 120px; padding-top:max(56px,env(safe-area-inset-top,56px)); }

h1 { font-size:22px; font-weight:700; color:var(--text-primary); margin:0 0 4px; }
.week-range { font-size:13px; color:var(--text-tertiary); margin-bottom:24px; }

.section { margin-bottom:20px; }
.section-title { font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:10px; }

.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
.stat-value { font-size:20px; font-weight:700; color:var(--text-primary); line-height:1.1; }
.stat-label { font-size:11px; color:var(--text-tertiary); margin-top:2px; }
.stat-sub { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
.stat-delta { font-size:10px; font-weight:700; margin-top:3px; }
.stat-delta.good { color:#4BC9A0; }
.stat-delta.bad { color:#FF6B6B; }

.habits-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
.habit-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
.habit-name { font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.habit-dots { display:flex; gap:4px; flex-wrap:wrap; }
.habit-dot { width:10px; height:10px; border-radius:3px; }
.habit-dot.done { background:var(--accent-green); }
.habit-dot.miss { background:rgba(255,255,255,0.08); }
.habit-dot.skip { background:rgba(255,255,255,0.04); border:1px dashed rgba(255,255,255,0.12); }
.habit-rate { font-size:11px; color:var(--text-tertiary); margin-top:5px; }

.mood-row { display:flex; gap:6px; align-items:flex-end; height:48px; }
.mood-bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.mood-bar { width:100%; border-radius:4px 4px 0 0; transition:height 0.3s; }
.mood-bar-label { font-size:9px; color:var(--text-tertiary); }

.ai-section { margin-top:24px; }
.ai-btn {
  width:100%; padding:14px 18px; border-radius:14px;
  background:linear-gradient(135deg, rgba(224,118,88,0.18), rgba(29,158,117,0.12));
  border:1px solid rgba(224,118,88,0.3);
  color:var(--text-primary); font-size:14px; font-weight:600;
  cursor:pointer; font-family:inherit; transition:opacity 0.15s;
}
.ai-btn:hover { opacity:0.85; }
.ai-btn:disabled { opacity:0.5; cursor:not-allowed; }

.ai-output {
  display:none; margin-top:14px;
  background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  padding:16px; font-size:13px; color:var(--text-secondary);
  line-height:1.65; white-space:pre-wrap;
}
</style>
</head>
<body>
<main>
  <h1>Weekly Review</h1>
  <div class="week-range" id="weekRange"></div>

  <div class="section">
    <div class="section-title">At a glance</div>
    <div class="stat-grid" id="statGrid"></div>
  </div>

  <div class="section" id="habitsSection">
    <div class="section-title">Habits</div>
    <div class="habits-grid" id="habitsGrid"></div>
  </div>

  <div class="section" id="moodSection">
    <div class="section-title">Mood this week</div>
    <div class="mood-row" id="moodRow"></div>
  </div>

  <div class="section" id="correlSection">
    <div class="section-title">What actually moves the needle</div>
    <div class="stat-grid" style="grid-template-columns:1fr" id="correlGrid"></div>
    <div class="ai-output" id="correlSummary" style="display:none;margin-top:10px"></div>
  </div>

  <div class="section" id="ritualSection">
    <div class="section-title">Weekly ritual</div>
    <div class="stat-card" id="ritualIntro">
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:10px" id="ritualIntroText">Ten questions, pre-filled with your real week. Best done Sunday evening.</div>
      <button class="ai-btn" id="ritualStartBtn" style="width:auto;padding:9px 18px">Start weekly ritual</button>
    </div>
    <div id="ritualBody" style="display:none"></div>
  </div>

  <div class="ai-section">
    <button class="ai-btn" id="aiBtn">Get AI Weekly Review</button>
    <div class="ai-output" id="aiOutput"></div>
  </div>
</main>
<script src="claude.js"></script>
<script src="tabbar.js"></script>
<script src="topbar.js"></script>
<script>
(function () {
'use strict';

function pad(n) { return String(n).padStart(2,'0'); }
function dateStr(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

// Get Mon-Sun for the most recently completed week (Mon=start)
function getWeekDays() {
  const today = new Date();
  const dow = today.getDay(); // 0=Sun
  // Days since last Monday
  const sinceMon = (dow + 6) % 7;
  // Start of this week (Monday)
  const monday = new Date(today);
  monday.setDate(today.getDate() - sinceMon);
  monday.setHours(0,0,0,0);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(dateStr(d));
  }
  return days;
}

function getPrevWeekDays() {
  const today = new Date();
  const dow = today.getDay();
  const sinceMon = (dow + 6) % 7;
  const monday = new Date(today);
  monday.setDate(today.getDate() - sinceMon - 7);
  monday.setHours(0,0,0,0);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(dateStr(d));
  }
  return days;
}

const DAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS = getWeekDays();
const PREV_DAYS = getPrevWeekDays();
const today = dateStr(new Date());

// Week range display
document.getElementById('weekRange').textContent = DAYS[0] + ' — ' + DAYS[6];

function tryParse(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}

// ---- HABITS ----
(function renderHabits() {
  const habits = tryParse('habits:v1', []);
  const logs = tryParse('habits:logs:v1', {});
  if (!habits.length) { document.getElementById('habitsSection').style.display = 'none'; return; }

  const grid = document.getElementById('habitsGrid');
  grid.innerHTML = '';
  habits.forEach(h => {
    let done = 0;
    const dots = DAYS.map(d => {
      const isDue = (function() {
        if (h.freq === 'daily') return true;
        if (h.freq === 'weekdays') { const dow = new Date(d).getDay(); return dow >= 1 && dow <= 5; }
        if (h.freq === 'weekly') return new Date(d).getDay() === 1;
        return true;
      })();
      if (!isDue) return 'skip';
      const logged = Array.isArray(logs[d]) && logs[d].includes(h.id);
      if (logged) { done++; return 'done'; }
      return d <= today ? 'miss' : 'skip';
    });
    const due = dots.filter(d => d !== 'skip').length;
    const rate = due > 0 ? Math.round(done / due * 100) : 0;

    const card = document.createElement('div');
    card.className = 'habit-card';
    card.innerHTML = `
      <div class="habit-name">${h.name || 'Habit'}</div>
      <div class="habit-dots">${dots.map(s => `<div class="habit-dot ${s}"></div>`).join('')}</div>
      <div class="habit-rate">${done}/${due} days (${rate}%)</div>
    `;
    grid.appendChild(card);
  });
})();

// ---- MOOD ----
(function renderMood() {
  const logs = tryParse('mind:mood:v1', []);
  const byDay = {};
  logs.forEach(e => { if (e.date && DAYS.includes(e.date)) byDay[e.date] = e.mood || e.score || 0; });
  const hasData = Object.keys(byDay).length > 0;
  if (!hasData) { document.getElementById('moodSection').style.display = 'none'; return; }

  const MOOD_COLORS = {1:'#FF6B6B',2:'#FF8A4D',3:'#F2C063',4:'#4BC9A0',5:'#1D9E75'};
  const maxMood = 5;
  const row = document.getElementById('moodRow');
  row.innerHTML = '';
  DAYS.forEach((d, i) => {
    const val = byDay[d] || 0;
    const wrap = document.createElement('div');
    wrap.className = 'mood-bar-wrap';
    const pct = val ? (val / maxMood * 100) : 4;
    wrap.innerHTML = `
      <div class="mood-bar" style="height:${pct}%;background:${val ? MOOD_COLORS[Math.round(val)] || '#76746E' : 'rgba(255,255,255,0.06)'}"></div>
      <div class="mood-bar-label">${DAY_LABELS[i]}</div>
    `;
    row.appendChild(wrap);
  });
})();

// ---- STATS ----
(function renderStats() {
  function computeWeekStats(days) {
    const ntLogs = tryParse('nt:logs', []);
    const calsByDay = {};
    ntLogs.forEach(l => {
      const d = l.dateKey || (l.loggedAt ? new Date(l.loggedAt).toISOString().slice(0,10) : null);
      if (d && days.includes(d)) calsByDay[d] = (calsByDay[d] || 0) + (l.calories || l.kcal || 0);
    });
    const calVals = Object.values(calsByDay);
    const avgCals = calVals.length ? Math.round(calVals.reduce((a,b)=>a+b,0)/calVals.length) : null;

    const workoutDone = tryParse('po_coach_workout_done', {});
    const workouts = days.filter(d => workoutDone[d]).length;

    const waterState = tryParse('po_water_v1', {});
    const waterLogs = waterState.logs || {};
    const unitMl = waterState.unit === 'glass' ? (waterState.glassMl || 250) : (waterState.bottleMl || 500);
    const totalWater = days.reduce((sum, d) => {
      const count = waterLogs[d]; if (!count) return sum;
      return sum + count * unitMl;
    }, 0);
    const avgWater = totalWater > 0 ? Math.round(totalWater / days.length) : null;

    const sleepLogs = tryParse('sleep:logs', []);
    const weekSleep = sleepLogs.filter(e => days.includes(e.date));
    const avgSleep = weekSleep.length
      ? parseFloat((weekSleep.reduce((s,e)=>s+(e.duration||0),0)/weekSleep.length/60).toFixed(1))
      : null;

    const tasks = tryParse('tasks:v1', []);
    const doneTasks = tasks.filter(t => t.done && days.includes((t.doneAt||'').slice(0,10))).length;

    const medLogs = tryParse('mind:meditation:v1', []);
    const medMins = medLogs.filter(e => days.includes(e.date)).reduce((s,e)=>s+Math.round((e.duration||0)/60),0);

    const gratLogs = tryParse('mind:gratitude:v1', []);
    const gratDays = gratLogs.filter(g => days.includes(g.date)).length;

    const pomoSessions = tryParse('pomo:sessions:v1', []);
    const pomos = pomoSessions.filter(s => days.includes(s.date) && s.type === 'focus').length;

    return { avgCals, workouts, avgWater, avgSleep, doneTasks, medMins, gratDays, pomos };
  }

  const curr = computeWeekStats(DAYS);
  const prev = computeWeekStats(PREV_DAYS);

  function mkDelta(currVal, prevVal, higherBetter, fmt) {
    if (currVal == null || prevVal == null) return '';
    const d = currVal - prevVal;
    if (Math.abs(d) < 0.05) return '';
    const good = higherBetter ? d > 0 : d < 0;
    return `<div class="stat-delta ${good?'good':'bad'}">${d>0?'+':''}${fmt(d)} vs last wk</div>`;
  }

  const stats = [
    curr.avgCals != null ? {
      value: curr.avgCals, label: 'Avg calories', sub: 'kcal/day',
      delta: mkDelta(curr.avgCals, prev.avgCals, false, v => Math.abs(Math.round(v)))
    } : null,
    {
      value: curr.workouts, label: 'Workouts', sub: 'this week',
      delta: mkDelta(curr.workouts, prev.workouts, true, v => (v>0?'+':'')+v)
    },
    curr.avgSleep != null ? {
      value: curr.avgSleep + 'h', label: 'Avg sleep', sub: 'per night',
      delta: mkDelta(curr.avgSleep, prev.avgSleep, true, v => Math.abs(v).toFixed(1)+'h')
    } : null,
    curr.avgWater != null ? {
      value: (curr.avgWater/1000).toFixed(1)+'L', label: 'Avg water', sub: 'per day',
      delta: mkDelta(curr.avgWater, prev.avgWater, true, v => Math.abs(v/1000).toFixed(1)+'L')
    } : null,
    curr.doneTasks > 0 ? { value: curr.doneTasks, label: 'Tasks done', sub: 'this week', delta: mkDelta(curr.doneTasks, prev.doneTasks, true, v => Math.abs(Math.round(v))) } : null,
    curr.medMins > 0 ? { value: curr.medMins, label: 'Meditation', sub: 'min this week', delta: mkDelta(curr.medMins, prev.medMins, true, v => Math.abs(Math.round(v))+'m') } : null,
    curr.gratDays > 0 ? { value: curr.gratDays + '/7', label: 'Gratitude', sub: 'days logged', delta: '' } : null,
    curr.pomos > 0 ? { value: curr.pomos, label: 'Focus sessions', sub: 'pomodoros', delta: mkDelta(curr.pomos, prev.pomos, true, v => Math.abs(Math.round(v))) } : null,
  ].filter(Boolean).slice(0, 6);

  const grid = document.getElementById('statGrid');
  grid.innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-sub">${s.sub}</div>
      ${s.delta || ''}
    </div>
  `).join('');
})();

// ---- AI REVIEW ----
document.getElementById('aiBtn').addEventListener('click', function() {
  const btn = this;
  const out = document.getElementById('aiOutput');
  btn.disabled = true;
  btn.textContent = 'Thinking...';

  // Build context from localStorage
  const habits = tryParse('habits:v1', []);
  const logs = tryParse('habits:logs:v1', {});
  const moodLogs = tryParse('mind:mood:v1', []).filter(e => DAYS.includes(e.date));
  const ntLogs = tryParse('nt:logs', []).filter(l => {
    const d = l.dateKey || (l.loggedAt ? new Date(l.loggedAt).toISOString().slice(0,10) : null);
    return DAYS.includes(d);
  });
  const workoutDone = tryParse('po_coach_workout_done', {});
  const workouts = DAYS.filter(d => workoutDone[d]).length;
  const sleepLogs = tryParse('sleep:logs', []).filter(e => DAYS.includes(e.date));

  const habitSummary = habits.map(h => {
    const done = DAYS.filter(d => Array.isArray(logs[d]) && logs[d].includes(h.id)).length;
    return `${h.name}: ${done}/7`;
  }).join(', ');

  const moodAvg = moodLogs.length
    ? (moodLogs.reduce((s,e)=>s+(e.mood||e.score||0),0)/moodLogs.length).toFixed(1)
    : 'no data';

  const calsByDay = {};
  ntLogs.forEach(l => {
    const d = l.dateKey || (l.loggedAt ? new Date(l.loggedAt).toISOString().slice(0,10) : null);
    if (d) calsByDay[d] = (calsByDay[d]||0)+(l.calories||l.kcal||0);
  });
  const calVals = Object.values(calsByDay);
  const avgCals = calVals.length ? Math.round(calVals.reduce((a,b)=>a+b,0)/calVals.length) : 0;

  const sleepAvg = sleepLogs.length
    ? (sleepLogs.reduce((s,e)=>s+(e.duration||0),0)/sleepLogs.length/60).toFixed(1)
    : 'no data';

  const prevWorkoutDone = tryParse('po_coach_workout_done', {});
  const prevWorkouts = PREV_DAYS.filter(d => prevWorkoutDone[d]).length;
  const prevSleepLogs = tryParse('sleep:logs', []).filter(e => PREV_DAYS.includes(e.date));
  const prevSleepAvg = prevSleepLogs.length
    ? (prevSleepLogs.reduce((s,e)=>s+(e.duration||0),0)/prevSleepLogs.length/60).toFixed(1)
    : 'no data';
  const medLogs = tryParse('mind:meditation:v1', []);
  const medMins = medLogs.filter(e => DAYS.includes(e.date)).reduce((s,e)=>s+Math.round((e.duration||0)/60),0);
  const gratLogs = tryParse('mind:gratitude:v1', []);
  const gratDays = gratLogs.filter(g => DAYS.includes(g.date)).length;

  const pomoSessions = tryParse('pomo:sessions:v1', []);
  const pomos = pomoSessions.filter(s => DAYS.includes(s.date) && s.type === 'focus').length;

  const context = `Week: ${DAYS[0]} to ${DAYS[6]}
Previous week: ${PREV_DAYS[0]} to ${PREV_DAYS[6]}
Habits: ${habitSummary || 'no data'}
Mood avg: ${moodAvg}/5
Avg calories: ${avgCals || 'no data'} kcal/day
Workouts: ${workouts}/7 days (prev week: ${prevWorkouts})
Avg sleep: ${sleepAvg}h (prev week: ${prevSleepAvg}h)
Meditation: ${medMins} min this week
Gratitude logged: ${gratDays}/7 days
Focus sessions (Pomodoro): ${pomos} this week`;

  // Deep work + ritual answers (Phase 9)
  let extra = '';
  const focusLogs = tryParse('focus:logs:v1', []);
  const focusMin = focusLogs.filter(l => DAYS.includes(l.date)).reduce((s,l)=>s+Math.round((l.sec||0)/60),0);
  if (focusMin) extra += `\nDeep work: ${(focusMin/60).toFixed(1)}h this week`;
  const ritual = tryParse('review:ritual:v1', {})[DAYS[0]];
  if (ritual && ritual.answers) {
    extra += '\nUser weekly ritual answers: ' + ritual.answers.map((a,i)=>a?`Q${i+1}: ${a}`:'').filter(Boolean).join(' | ');
  }
  const fullContext = context + extra;

  LifeOS.ai.chat({
    prompt: 'Give me a weekly review based on my data. Be specific, highlight wins, flag concerns, and give 2-3 actionable suggestions for next week.',
    context: fullContext,
    cacheKey: 'weekly_review_' + DAYS[0] + (ritual ? '_r' : ''),
    ttlMs: LifeOS.ai.TTL.weekly,
  })
  .then(d => {
    out.textContent = d.reply || 'No response';
    out.style.display = '';
    btn.textContent = 'Refresh Review';
    btn.disabled = false;
  })
  .catch(() => {
    out.textContent = 'Could not reach AI — check ANTHROPIC_API_KEY.';
    out.style.display = '';
    btn.textContent = 'Get AI Weekly Review';
    btn.disabled = false;
  });
});

})();
</script>

<script>
// ── Correlation report: deterministic Pearson over 60 days, Claude only phrases ──
(function () {
'use strict';
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function dstr(off) {
  const d = new Date(); d.setDate(d.getDate() - off);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// daily series over last 60 days, null = not logged
function buildSeries() {
  const sleep = lsGet('sleep:logs') || [];
  const mood = lsGet('mind:mood:v1') || [];
  const nt = lsGet('nt:logs') || [];
  const done = lsGet('po_coach_workout_done') || {};
  const items = lsGet('stack:items') || [];
  const days = [];
  for (let i = 0; i < 60; i++) {
    const ds = dstr(i);
    const se = sleep.find(e => e && e.date === ds);
    const me = mood.find(e => e && e.date === ds);
    const dayNt = nt.filter(l => l && String(l.dateKey).replace(/\//g, '-') === ds);
    let supp = null;
    if (items.length) {
      const taken = lsGet('stack:taken:' + ds);
      if (taken) supp = items.filter(it => taken[it.id]).length / items.length;
    }
    days.push({
      sleepMin: se && se.duration ? se.duration : null,
      sleepScore: se && se.score != null ? se.score : null,
      mood: me && me.mood ? me.mood : null,
      protein: dayNt.length ? dayNt.reduce((s, l) => s + (parseFloat(l.protein) || 0), 0) : null,
      trained: done[ds] ? 1 : 0,
      supp: supp,
    });
  }
  return days;
}

function pearson(pairs) {
  const n = pairs.length;
  if (n < 10) return null;
  const mx = pairs.reduce((s, p) => s + p[0], 0) / n;
  const my = pairs.reduce((s, p) => s + p[1], 0) / n;
  let num = 0, dx = 0, dy = 0;
  pairs.forEach(p => { num += (p[0] - mx) * (p[1] - my); dx += (p[0] - mx) ** 2; dy += (p[1] - my) ** 2; });
  if (!dx || !dy) return null;
  return { r: num / Math.sqrt(dx * dy), n: n };
}

function collect(days, kx, ky, shift) {
  // shift=1 pairs x on day d+1 (earlier) with y on day d (later): "x last night -> y today"
  const pairs = [];
  for (let i = 0; i < days.length - (shift || 0); i++) {
    const x = days[i + (shift || 0)][kx], y = days[i][ky];
    if (x != null && y != null) pairs.push([x, y]);
  }
  return pearson(pairs);
}

function run() {
  const grid = document.getElementById('correlGrid');
  if (!grid) return;
  const days = buildSeries();
  const tests = [
    { label: 'Sleep duration → next-day mood', res: collect(days, 'sleepMin', 'mood', 1) },
    { label: 'Sleep score → next-day mood', res: collect(days, 'sleepScore', 'mood', 1) },
    { label: 'Training day ↔ same-day mood', res: collect(days, 'trained', 'mood', 0) },
    { label: 'Protein intake ↔ same-day mood', res: collect(days, 'protein', 'mood', 0) },
    { label: 'Supplement adherence ↔ mood', res: collect(days, 'supp', 'mood', 0) },
    { label: 'Sleep duration → next-day training', res: collect(days, 'sleepMin', 'trained', 1) },
  ];
  const sig = tests.filter(t => t.res && Math.abs(t.res.r) >= 0.4);
  if (!sig.length) {
    const tested = tests.filter(t => t.res).length;
    grid.innerHTML = '<div class="stat-card" style="font-size:13px;color:var(--text-tertiary);line-height:1.5">'
      + (tested
        ? 'No strong correlations yet (' + tested + ' pairs tested, threshold |r| ≥ 0.4, n ≥ 10). That is honest — better than inventing patterns. Keep logging.'
        : 'Not enough overlapping data yet. Log sleep, mood and meals for ~2 weeks and correlations appear here.')
      + '</div>';
    return;
  }
  grid.innerHTML = sig.map(t => {
    const r = t.res.r;
    const dir = r > 0 ? 'higher together' : 'inverse';
    const strength = Math.abs(r) >= 0.6 ? 'strong' : 'moderate';
    const col = Math.abs(r) >= 0.6 ? '#34D399' : '#FBBF24';
    return '<div class="stat-card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
      + '<div style="font-size:13px;color:var(--text-primary)">' + t.label
      + '<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">' + strength + ' · ' + dir + ' · n=' + t.res.n + '</div></div>'
      + '<div style="font-size:18px;font-weight:600;color:' + col + ';font-variant-numeric:tabular-nums">r=' + r.toFixed(2) + '</div>'
      + '</div>';
  }).join('');

  // Claude phrases the computed numbers (weekly cache); no math delegated to AI
  if (window.LifeOS && window.LifeOS.ai) {
    const weekKey = dstr(new Date().getDay());
    const facts = sig.map(t => t.label + ': r=' + t.res.r.toFixed(2) + ' (n=' + t.res.n + ')').join('; ');
    window.LifeOS.ai.chat({
      prompt: 'Computed correlations from my logs: ' + facts,
      context: 'You are a direct personal coach. Turn these precomputed correlation numbers into 2-3 plain sentences about what behavior is actually affecting the user, plus one concrete action. Correlation is not causation - say so briefly only if relevant. No motivation fluff. Do not invent numbers.',
      cacheKey: 'correl_summary_' + weekKey,
      ttlMs: window.LifeOS.ai.TTL.weekly,
    }).then(d => {
      const el = document.getElementById('correlSummary');
      el.textContent = d.reply;
      el.style.display = '';
    }).catch(() => {});
  }
}
if (window.LifeOS && window.LifeOS.ai) run();
else window.addEventListener('lifeos:ready', run);
if (document.readyState !== 'loading') setTimeout(run, 400); else document.addEventListener('DOMContentLoaded', () => setTimeout(run, 400));
})();
</script>

<script>
// ===== WEEKLY RITUAL (Phase 9) =====
// Stored per ISO-week Monday in review:ritual:v1.
// Ten guided questions, each pre-filled with the actual week's data.
// Answers stored per week and fed into the AI weekly review.
(function weeklyRitual() {
  'use strict';
  var KEY = 'review:ritual:v1';
  function jget(k, fb) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
  function jset(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function weekDays(offset) {
    var t = new Date();
    var monday = new Date(t);
    monday.setDate(t.getDate() - ((t.getDay() + 6) % 7) - (offset || 0) * 7);
    monday.setHours(0, 0, 0, 0);
    var out = [];
    for (var i = 0; i < 7; i++) { var d = new Date(monday); d.setDate(monday.getDate() + i); out.push(ds(d)); }
    return out;
  }

  function prefills() {
    var DAYS = weekDays(0), PREV = weekDays(1);
    var inWeek = function (d) { return DAYS.indexOf(d) >= 0; };

    // Training: distinct days with logged sets or workout-done marks
    var trainDays = {};
    try {
      var po = jget('po_coach_v1', {}) || {};
      Object.values(po.logs || {}).forEach(function (arr) {
        (arr || []).forEach(function (s) { var d = String(s.date || '').slice(0, 10); if (inWeek(d)) trainDays[d] = 1; });
      });
    } catch (e) {}
    Object.keys(jget('po_coach_workout_done', {}) || {}).forEach(function (d) { if (inWeek(d)) trainDays[d] = 1; });

    // Protein: days hitting >=90% of target
    var targets = jget('nt:targets', {}) || {};
    var protByDay = {};
    (jget('nt:logs', []) || []).forEach(function (l) {
      var d = l.dateKey || (l.loggedAt ? String(l.loggedAt).slice(0, 10) : null);
      if (d && inWeek(d)) protByDay[d] = (protByDay[d] || 0) + (l.protein || 0);
    });
    var protHits = targets.protein ? Object.values(protByDay).filter(function (p) { return p >= targets.protein * 0.9; }).length : null;

    var sleep = (jget('sleep:logs', []) || []).filter(function (e) { return inWeek(e.date); });
    var sleepAvg = sleep.length ? (sleep.reduce(function (s, e) { return s + (e.duration || 0); }, 0) / sleep.length / 60).toFixed(1) : null;

    var fin = (window.LifeOS && LifeOS.context) ? LifeOS.context('finance') : {};

    var weekOut = 0, hasTx = false;
    (jget('ing:tx', []) || []).forEach(function (t) {
      if (inWeek(String(t.date || '').slice(0, 10))) { hasTx = true; if (t.amount < 0) weekOut += Math.abs(t.amount); }
    });

    var focusMin = (jget('focus:logs:v1', []) || []).filter(function (l) { return inWeek(l.date); })
      .reduce(function (s, l) { return s + Math.round((l.sec || 0) / 60); }, 0);

    var habits = jget('habits:v1', []) || [];
    var hlogs = jget('habits:logs:v1', {}) || {};
    var today = ds(new Date());
    var missed = 0;
    habits.forEach(function (h) {
      DAYS.forEach(function (d) {
        if (d > today) return;
        var due = h.freq === 'weekdays' ? (new Date(d).getDay() >= 1 && new Date(d).getDay() <= 5) : h.freq === 'weekly' ? new Date(d).getDay() === 1 : true;
        if (due && !(Array.isArray(hlogs[d]) && hlogs[d].indexOf(h.id) >= 0)) missed++;
      });
    });

    function moodAvg(days) {
      var m = (jget('mind:mood:v1', []) || []).filter(function (e) { return days.indexOf(e.date) >= 0; });
      return m.length ? (m.reduce(function (s, e) { return s + (e.mood || e.score || 0); }, 0) / m.length).toFixed(1) : null;
    }
    var moodNow = moodAvg(DAYS), moodPrev = moodAvg(PREV);

    return [
      ['How did training go?', Object.keys(trainDays).length + ' sessions this week'],
      ['Did you eat like someone with a goal?', protHits != null ? 'Protein target hit ' + protHits + '/7 days' : 'No protein target set'],
      ['How was sleep?', sleepAvg ? 'Averaged ' + sleepAvg + 'h per night' : 'No sleep logged this week'],
      ['Are you saving like planned?', fin && fin.savings_rate_last_month_actual_pct != null ? 'Last full month savings rate: ' + fin.savings_rate_last_month_actual_pct + '%' : 'No bank import yet'],
      ['Any spending you regret?', hasTx ? 'Spent €' + Math.round(weekOut) + ' this week (bank data)' : 'No bank data for this week'],
      ['Did you do real deep work?', focusMin ? (focusMin / 60).toFixed(1) + 'h of tracked focus' : 'No focus sessions tracked'],
      ['Which habits slipped?', missed + ' habit check-ins missed so far'],
      ['How was your headspace?', moodNow ? 'Mood avg ' + moodNow + '/5' + (moodPrev ? ' (prev week ' + moodPrev + ')' : '') : 'No mood logs this week'],
      ['Biggest win of the week?', null],
      ['Biggest problem to fix next week?', null],
    ];
  }

  function render() {
    var body = document.getElementById('ritualBody');
    var intro = document.getElementById('ritualIntro');
    if (!body) return;
    var weekKey = weekDays(0)[0];
    var saved = (jget(KEY, {}) || {})[weekKey];
    var introText = document.getElementById('ritualIntroText');
    if (saved && introText) introText.textContent = 'Done for this week (' + String(saved.savedAt || '').slice(0, 10) + '). Reopen to edit.';
    var startBtn = document.getElementById('ritualStartBtn');
    if (startBtn) startBtn.textContent = saved ? 'Reopen ritual' : 'Start weekly ritual';

    var qs = prefills();
    body.innerHTML = qs.map(function (q, i) {
      return '<div class="stat-card" style="margin-bottom:8px">'
        + '<div style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:3px">' + (i + 1) + '. ' + q[0] + '</div>'
        + (q[1] ? '<div style="font-size:11px;color:#6BE3A4;margin-bottom:6px">' + esc(q[1]) + '</div>' : '')
        + '<textarea data-rq="' + i + '" rows="2" placeholder="Your honest answer…" style="width:100%;background:rgba(0,0,0,0.28);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box">' + esc(saved && saved.answers ? saved.answers[i] || '' : '') + '</textarea>'
        + '</div>';
    }).join('')
      + '<button class="ai-btn" id="ritualSaveBtn" style="margin-top:4px">Save ritual</button>'
      + '<div id="ritualSavedMsg" style="font-size:12px;color:var(--text-tertiary);margin-top:8px"></div>';

    document.getElementById('ritualSaveBtn').addEventListener('click', function () {
      var answers = Array.prototype.map.call(body.querySelectorAll('[data-rq]'), function (t) { return t.value.trim(); });
      var store = jget(KEY, {}) || {};
      store[weekKey] = { answers: answers, savedAt: new Date().toISOString() };
      var keys = Object.keys(store).sort();
      while (keys.length > 26) { delete store[keys.shift()]; }
      jset(KEY, store);
      document.getElementById('ritualSavedMsg').textContent = 'Saved. Your answers now feed the AI weekly review above.';
      if (introText) introText.textContent = 'Done for this week. Reopen to edit.';
      if (startBtn) startBtn.textContent = 'Reopen ritual';
    });
  }

  var startBtn = document.getElementById('ritualStartBtn');
  if (startBtn) startBtn.addEventListener('click', function () {
    var body = document.getElementById('ritualBody');
    var open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    if (!open) render();
  });
})();
</script>
</body>
</html>
