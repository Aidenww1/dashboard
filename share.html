<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Share into Life OS</title>
<style>
:root{
  --bg:#0A0A0B; --bg-deep:#050506; --bg-card:rgba(255,255,255,0.04);
  --text-primary:#FAFAFA; --text-secondary:#B8B6B0; --text-tertiary:#76746E;
  --accent:#E07658; --success:#6BE3A4; --warning:#F2C063; --danger:#FF6B6B;
  --radius-md:12px; --radius-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg-deep);color:var(--text-primary);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100%;}
body::before{content:'';position:fixed;inset:-10%;z-index:-2;background:radial-gradient(60% 45% at 82% 14%,rgba(224,118,88,.14) 0%,transparent 55%),linear-gradient(180deg,#0A0A0B 0%,#050506 100%);filter:blur(40px);pointer-events:none;}
.shell{max-width:560px;margin:0 auto;padding:20px 16px 100px;}
.page-title{font-size:22px;font-weight:800;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text-tertiary);margin-bottom:20px;line-height:1.5;}
.card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;box-shadow:0 1px 0 0 rgba(255,255,255,.06) inset,0 12px 40px rgba(0,0,0,.45);}
.section-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:12px;}
.preview-img{width:100%;max-height:280px;object-fit:contain;border-radius:var(--radius-md);background:rgba(0,0,0,.3);margin-bottom:6px;}
.shared-text{font-size:14px;line-height:1.55;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word;}
.dest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dest-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--text-primary);font-family:var(--font);cursor:pointer;text-align:left;transition:.15s;}
.dest-btn:hover{border-color:var(--accent);background:rgba(224,118,88,.08);}
.dest-ico{font-size:22px;}
.dest-name{font-size:14px;font-weight:700;}
.dest-sub{font-size:11px;color:var(--text-tertiary);line-height:1.35;}
.empty{font-size:14px;color:var(--text-tertiary);line-height:1.6;padding:20px 0;text-align:center;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#141416;border:1px solid rgba(107,227,164,.4);color:var(--success);padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;z-index:50;opacity:0;transition:.2s;}
.toast.show{opacity:1;}
@media(min-width:900px){.shell{max-width:720px;}}
</style>
</head>
<body>
<div class="shell">
  <div class="page-title">Share into Life OS</div>
  <div class="page-sub">Something was shared to Life OS. Pick where it belongs.</div>

  <div class="card" id="previewCard" style="display:none">
    <div class="section-title">Shared content</div>
    <img class="preview-img" id="previewImg" alt="shared image" style="display:none">
    <div class="shared-text" id="previewText" style="display:none"></div>
  </div>

  <div class="card" id="destCard" style="display:none">
    <div class="section-title">Send to</div>
    <div class="dest-grid" id="destGrid"></div>
  </div>

  <div class="card" id="emptyCard" style="display:none">
    <div class="empty">Nothing was shared, or the share expired.<br>Open an app and use its share menu to send a photo or text here.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="tabbar.js" defer></script>
<script>
(function () {
  'use strict';
  var SHARE_CACHE = 'share-target-v1';
  var HANDOFF_KEY = 'share:handoff:v1';

  // photo destinations -> page that consumes the image (left in the share cache)
  var PHOTO_DESTS = [
    { id: 'meal',     ico: '🍽', name: 'Meal',          sub: 'Estimate macros from the photo', url: '/nutrition.html?shared=1' },
    { id: 'progress', ico: '📸', name: 'Progress photo', sub: 'Body progress gallery + analyze', url: '/body.html?shared=1' },
    { id: 'skin',     ico: '🧴', name: 'Skin',           sub: 'Skin check + analysis',          url: '/skin.html?shared=1' },
    { id: 'receipt',  ico: '🧾', name: 'Receipt',        sub: 'Scan into finance',              url: '/finance.html?shared=1' },
    { id: 'supplement', ico: '💊', name: 'Supplement',   sub: 'Read a product label',           url: '/reminders.html?shared=1' },
    { id: 'bloodwork', ico: '🩸', name: 'Bloodwork',     sub: 'Log lab results',                url: '/health.html?shared=1' },
  ];

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function showEmpty() {
    document.getElementById('emptyCard').style.display = 'block';
  }

  function handoff(dest, meta) {
    // Leave the image in the share cache; record where it should go so the
    // destination page can pick it up. Text shares carry their text inline.
    try {
      localStorage.setItem(HANDOFF_KEY, JSON.stringify({
        dest: dest.id, url: dest.url, text: meta.text || meta.title || '',
        hasFile: !!meta.hasFile, at: Date.now(),
      }));
    } catch (_) {}
  }

  function renderPhotoDests(meta) {
    var card = document.getElementById('destCard');
    var grid = document.getElementById('destGrid');
    card.style.display = 'block';
    grid.innerHTML = PHOTO_DESTS.map(function (d, i) {
      return '<button class="dest-btn" data-i="' + i + '">'
        + '<span class="dest-ico">' + d.ico + '</span>'
        + '<span class="dest-name">' + d.name + '</span>'
        + '<span class="dest-sub">' + d.sub + '</span></button>';
    }).join('');
    grid.querySelectorAll('.dest-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var d = PHOTO_DESTS[+btn.dataset.i];
        handoff(d, meta);
        toast('Sent to ' + d.name);
        setTimeout(function () { location.href = d.url; }, 500);
      });
    });
  }

  function renderTextDests(meta) {
    var card = document.getElementById('destCard');
    var grid = document.getElementById('destGrid');
    card.style.display = 'block';
    var text = meta.text || meta.title || meta.url || '';
    var opts = [
      { ico: '🤖', name: 'Ask Claude', sub: 'Answer or act on this', fn: function () {
          try { sessionStorage.setItem('cmd:prefill', '? ' + text); } catch (_) {}
          location.href = '/index.html?qa=ask';
        } },
      { ico: '📝', name: 'Save as note', sub: 'Keep it in quick notes', fn: function () {
          if (window.LifeOS && LifeOS.log) { LifeOS.log({ type: 'note', text: text }); toast('Saved as note'); }
          else toast('Core not loaded'); setTimeout(function () { location.href = '/index.html'; }, 700);
        } },
      { ico: '✅', name: 'New task', sub: 'Add it to your task list', fn: function () {
          if (window.LifeOS && LifeOS.log) { LifeOS.log({ type: 'task', title: text.slice(0, 120) }); toast('Task added'); }
          else toast('Core not loaded'); setTimeout(function () { location.href = '/tasks.html'; }, 700);
        } },
    ];
    grid.innerHTML = opts.map(function (o, i) {
      return '<button class="dest-btn" data-i="' + i + '"><span class="dest-ico">' + o.ico + '</span>'
        + '<span class="dest-name">' + o.name + '</span><span class="dest-sub">' + o.sub + '</span></button>';
    }).join('');
    grid.querySelectorAll('.dest-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { opts[+btn.dataset.i].fn(); });
    });
  }

  function render(meta, fileBlob) {
    var pc = document.getElementById('previewCard');
    pc.style.display = 'block';
    if (fileBlob) {
      var img = document.getElementById('previewImg');
      img.src = URL.createObjectURL(fileBlob);
      img.style.display = 'block';
      renderPhotoDests(meta);
    }
    var txt = meta.text || meta.title || meta.url || '';
    if (txt) {
      var te = document.getElementById('previewText');
      te.textContent = txt; te.style.display = 'block';
    }
    if (!fileBlob) {
      if (txt) renderTextDests(meta);
      else showEmpty();
    }
  }

  async function load() {
    if (!('caches' in window)) { showEmpty(); return; }
    try {
      var cache = await caches.open(SHARE_CACHE);
      var metaRes = await cache.match('/__share/meta');
      if (!metaRes) { showEmpty(); return; }
      var meta = await metaRes.json();
      var fileBlob = null;
      if (meta.hasFile) {
        var fileRes = await cache.match('/__share/file');
        if (fileRes) fileBlob = await fileRes.blob();
      }
      render(meta, fileBlob);
    } catch (e) { showEmpty(); }
  }

  load();
})();
</script>
</body>
</html>
