name: Build Health Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'samsung-health-bridge/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        working-directory: samsung-health-bridge
        run: gradle assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-bridge-apk
          path: samsung-health-bridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: health-bridge-latest
          name: Health Bridge APK
          files: samsung-health-bridge/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Install on your Android phone.
            Open it, tap Connect, grant all Health Connect permissions.
            Then open your dashboard on the phone and tap Watch > Sync.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
