<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>AI Panel</title>
<script src="topbar.js" defer></script>
<script src="events.js" defer></script>
<style>
:root{--bg:#0A0A0B;--bg-card:rgba(255,255,255,0.04);--text-primary:#FAFAFA;--text-secondary:#B8B6B0;--text-tertiary:#76746E;--accent:#E07658;--success:#6BE3A4;--warning:#F2C063;--danger:#FF6B6B;--radius-md:12px;--radius-lg:16px;--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text-primary);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:'';position:fixed;inset:-10%;z-index:-2;background:radial-gradient(60% 45% at 82% 14%,rgba(224,118,88,.14) 0%,transparent 55%),linear-gradient(180deg,#0A0A0B 0%,#050506 100%);filter:blur(40px);pointer-events:none}
.shell{max-width:760px;margin:0 auto;padding:20px 16px 100px}
.page-title{font-size:22px;font-weight:800;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-tertiary);margin-bottom:20px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:10px}
.card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;box-shadow:0 1px 0 0 rgba(255,255,255,.06) inset,0 12px 40px rgba(0,0,0,.45)}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin:2px 3px 2px 0}
.chip-flag{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.25);color:#FF9999}
.chip-warn{background:rgba(242,192,99,.1);border:1px solid rgba(242,192,99,.25);color:#F2C063}
.chip-insight{background:rgba(107,227,164,.1);border:1px solid rgba(107,227,164,.2);color:#6BE3A4}
.insight-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;line-height:1.4;color:var(--text-secondary)}
.insight-row:last-child{border-bottom:none}
.insight-icon{flex-shrink:0;font-size:14px;margin-top:1px}
/* Chat */
.chat-wrap{display:flex;flex-direction:column;gap:0}
.chat-msgs{min-height:120px;max-height:340px;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.chat-msg.user{background:rgba(224,118,88,.15);border:1px solid rgba(224,118,88,.2);align-self:flex-end;color:#FAFAFA}
.chat-msg.ai{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);align-self:flex-start;color:var(--text-secondary)}
.chat-msg.thinking{color:var(--text-tertiary);font-style:italic;font-size:12px;align-self:flex-start}
.chat-input-row{display:flex;gap:8px;margin-top:10px}
.chat-input{flex:1;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:9px 12px;color:#FAFAFA;font-size:14px;font-family:inherit;outline:none}
.chat-send{padding:9px 18px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.chat-send:disabled{opacity:.5}
/* Experiments */
.exp-card{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:8px}
.exp-name{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:2px}
.exp-hyp{font-size:12px;color:var(--text-tertiary);margin-bottom:6px;line-height:1.4}
.exp-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.exp-status{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:8px}
.exp-status.active{background:rgba(107,227,164,.12);color:#6BE3A4}
.exp-status.completed{background:rgba(255,255,255,.06);color:var(--text-tertiary)}
.exp-btn{padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-secondary);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.exp-btn:hover{background:rgba(255,255,255,.06)}
/* Form */
.ai-input{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;color:#FAFAFA;font-size:14px;font-family:inherit;outline:none;margin-bottom:8px}
.ai-btn{padding:9px 18px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="shell">
  <div class="page-title">AI Panel</div>
  <div class="page-sub">Briefing, cross-domain insights, flags, active experiments, data chat.</div>

  <!-- Briefing -->
  <div class="section-title">Daily Briefing</div>
  <div class="card">
    <div id="aiBriefingText" style="font-size:14px;line-height:1.6;color:var(--text-secondary)">Loading…</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="ai-btn" style="font-size:12px;padding:6px 14px" onclick="triggerBriefing()">Regenerate</button>
      <span id="briefingTs" style="font-size:11px;color:var(--text-tertiary);align-self:center"></span>
    </div>
  </div>

  <!-- Flags + Insights -->
  <div class="section-title">Flags &amp; Insights</div>
  <div class="card">
    <div id="flagsList"><div style="font-size:13px;color:var(--text-tertiary)">Loading…</div></div>
  </div>

  <!-- Experiments -->
  <div class="section-title">Experiments</div>
  <div class="card">
    <div id="expList"></div>
    <!-- New experiment form -->
    <div id="expForm" style="margin-top:12px;border-top:1px solid rgba(255,255,255,.06);padding-top:12px">
      <div style="font-size:12px;font-weight:700;color:var(--text-tertiary);margin-bottom:8px">New experiment</div>
      <input class="ai-input" id="expName" placeholder="Name (e.g. Magnesium before bed)">
      <input class="ai-input" id="expHyp" placeholder="Hypothesis (e.g. Improves deep sleep %)">
      <input type="date" class="ai-input" id="expEnd" title="Target end date">
      <button class="ai-btn" style="font-size:12px;padding:6px 14px" onclick="startExperiment()">Start experiment</button>
    </div>
  </div>

  <!-- Chat -->
  <div class="section-title">Chat over your data</div>
  <div class="card">
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" placeholder="Ask anything about your data…">
      <button class="chat-send" id="chatSend" onclick="chatSend()">Send</button>
    </div>
  </div>
</div>

<script src="tabbar.js" defer></script>
<script>
(function() {
  'use strict';
  var SUPA_URL = 'https://nwdyuiimfqhlqscnbqmq.supabase.co';
  var SUPA_KEY = 'sb_publishable_KFOU1sDCxRp8c1M3kSytHg_nuQWzfPT';
  var EXP_KEY  = 'experiments:v1';

  // ── Load briefing ──────────────────────────────────────────────────────────
  async function loadBriefing() {
    var el = document.getElementById('aiBriefingText');
    var tsEl = document.getElementById('briefingTs');
    try {
      var r = await fetch(SUPA_URL + '/rest/v1/events?select=data,ts&type=eq.ai.briefing&order=ts.desc&limit=1', {
        headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }
      });
      var rows = await r.json();
      if (rows.length && rows[0].data?.text) {
        el.textContent = rows[0].data.text;
        if (tsEl) tsEl.textContent = new Date(rows[0].ts).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
      } else {
        el.textContent = 'No briefing yet — click Regenerate to generate one.';
      }
    } catch (_) { el.textContent = 'Could not load briefing.'; }
  }

  window.triggerBriefing = async function() {
    var el = document.getElementById('aiBriefingText');
    el.textContent = 'Generating…';
    try {
      var r = await fetch('/api/health-ai/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event: 'daily_summary', data: { trigger: 'manual', note: 'User requested briefing from AI panel.' } }),
      });
      if (!r.ok) throw new Error(await r.text());
      var d = await r.json();
      el.textContent = d.summary || 'Briefing generated.';
      await loadBriefing();
    } catch (e) { el.textContent = 'Error: ' + e.message; }
  };

  // ── Load flags + insights ──────────────────────────────────────────────────
  async function loadFlags() {
    var el = document.getElementById('flagsList');
    try {
      var since = new Date(Date.now() - 14 * 86400000).toISOString();
      var r = await fetch(SUPA_URL + '/rest/v1/events?select=type,data,ts&type=in.(ai.flag,ai.insight)&order=ts.desc&limit=20&ts=gte=' + encodeURIComponent(since), {
        headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }
      });
      var rows = await r.json();
      if (!rows.length) { el.innerHTML = '<div style="font-size:13px;color:var(--text-tertiary)">No flags or insights yet. Run a briefing to generate them.</div>'; return; }
      el.innerHTML = rows.map(function(x) {
        var isFlag = x.type === 'ai.flag';
        var sev = x.data?.severity || (isFlag ? 'warning' : 'info');
        var icon = isFlag ? (sev === 'alert' ? '⚠' : '○') : '↗';
        var chipCls = isFlag ? (sev === 'alert' ? 'chip-flag' : 'chip-warn') : 'chip-insight';
        var date = new Date(x.ts).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
        return '<div class="insight-row"><div class="insight-icon">' + icon + '</div><div style="flex:1"><span class="chip ' + chipCls + '">' + (isFlag ? 'flag' : 'insight') + '</span> <span style="font-size:11px;color:var(--text-tertiary)">' + date + '</span><br>' + (x.data?.text || x.note || '') + '</div></div>';
      }).join('');
    } catch (_) { el.innerHTML = '<div style="font-size:13px;color:var(--text-tertiary)">Could not load.</div>'; }
  }

  // ── Experiments ────────────────────────────────────────────────────────────
  function loadExps() { try { return JSON.parse(localStorage.getItem(EXP_KEY) || '[]'); } catch { return []; } }
  function saveExps(a) { localStorage.setItem(EXP_KEY, JSON.stringify(a)); }

  function renderExps() {
    var exps = loadExps();
    var el = document.getElementById('expList');
    var active = exps.filter(function(e) { return e.status === 'active'; });
    var done   = exps.filter(function(e) { return e.status !== 'active'; }).slice(0, 5);
    var all = active.concat(done);
    if (!all.length) { el.innerHTML = '<div style="font-size:13px;color:var(--text-tertiary);margin-bottom:8px">No experiments yet.</div>'; return; }
    el.innerHTML = all.map(function(e, i) {
      var daysLeft = e.endDate ? Math.ceil((new Date(e.endDate) - Date.now()) / 86400000) : null;
      var meta = [e.startDate, e.endDate ? '→ ' + e.endDate : null, daysLeft != null && daysLeft >= 0 ? daysLeft + 'd left' : null].filter(Boolean).join(' ');
      var btns = e.status === 'active'
        ? '<button class="exp-btn" onclick="completeExp(\'' + e.id + '\')">Complete</button> <button class="exp-btn" style="color:rgba(255,107,107,.6)" onclick="abandonExp(\'' + e.id + '\')">Abandon</button>'
        : '<span style="font-size:12px;color:var(--text-tertiary)">' + (e.outcome || '') + '</span>';
      return '<div class="exp-card"><div class="exp-name">' + e.name + '</div><div class="exp-hyp">' + e.hypothesis + '</div>'
        + '<div class="exp-meta"><span class="exp-status ' + e.status + '">' + e.status + '</span><span style="font-size:11px;color:var(--text-tertiary)">' + meta + '</span>' + btns + '</div></div>';
    }).join('');
  }

  window.startExperiment = function() {
    var name = (document.getElementById('expName').value || '').trim();
    var hyp  = (document.getElementById('expHyp').value || '').trim();
    var end  = document.getElementById('expEnd').value || null;
    if (!name) return;
    var exp = { id: Date.now().toString(36), name, hypothesis: hyp, startDate: new Date().toISOString().slice(0,10), endDate: end, status: 'active', outcome: null };
    var exps = loadExps();
    exps.unshift(exp);
    saveExps(exps);
    if (window.addEvent) window.addEvent('ai.experiment', ['ai'], { name, hypothesis: hyp, startDate: exp.startDate, endDate: end, action: 'start' }).catch(function(){});
    document.getElementById('expName').value = '';
    document.getElementById('expHyp').value = '';
    document.getElementById('expEnd').value = '';
    renderExps();
  };

  window.completeExp = function(id) {
    var outcome = prompt('Outcome / what did you find?');
    if (outcome === null) return;
    var exps = loadExps();
    var e = exps.find(function(x) { return x.id === id; });
    if (!e) return;
    e.status = 'completed'; e.outcome = outcome; e.endDate = new Date().toISOString().slice(0,10);
    saveExps(exps);
    if (window.addEvent) window.addEvent('ai.experiment', ['ai'], { name: e.name, outcome, endDate: e.endDate, action: 'complete' }).catch(function(){});
    renderExps();
  };

  window.abandonExp = function(id) {
    var exps = loadExps();
    var e = exps.find(function(x) { return x.id === id; });
    if (!e) return;
    e.status = 'abandoned';
    saveExps(exps);
    renderExps();
  };

  // ── Chat ───────────────────────────────────────────────────────────────────
  var _chatHistory = [];

  function addMsg(role, text) {
    _chatHistory.push({ role, text });
    var el = document.getElementById('chatMsgs');
    var div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    return div;
  }

  window.chatSend = async function() {
    var inp = document.getElementById('chatInput');
    var text = (inp.value || '').trim();
    if (!text) return;
    inp.value = '';
    var sendBtn = document.getElementById('chatSend');
    addMsg('user', text);
    sendBtn.disabled = true;
    var thinkEl = addMsg('thinking', 'Thinking…');
    var msgs = _chatHistory.slice(-10).map(function(m) { return { role: m.role === 'ai' ? 'assistant' : 'user', content: m.text }; });
    try {
      var r = await fetch('/api/health-ai/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'chat', messages: msgs }),
      });
      var d = await r.json();
      thinkEl.remove();
      var reply = d.reply || d.error || 'No response.';
      addMsg('ai', reply);
    } catch (e) {
      thinkEl.remove();
      addMsg('ai', 'Error: ' + e.message);
    }
    sendBtn.disabled = false;
    inp.focus();
  };

  document.getElementById('chatInput').addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.chatSend(); } });

  // Init
  loadBriefing();
  loadFlags();
  renderExps();
})();
</script>
</body>
</html>
