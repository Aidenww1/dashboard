<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>API Usage — Dashboard</title>
  <style>
    :root {
      --bg: #0A0A0B; --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08); --text: #E8E6E0;
      --muted: #76746E; --accent: var(--accent);
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100dvh; }
    .page { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 16px 0 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
    .card-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    .stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .stat { display: flex; flex-direction: column; gap: 3px; }
    .stat-val { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: var(--accent); }
    .stat-lbl { font-size: 11px; color: var(--muted); }
    .chart-wrap { height: 80px; display: flex; align-items: flex-end; gap: 3px; margin-top: 14px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
    .bar-fill { width: 100%; background: rgb(from var(--accent) r g b / 0.35); border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.3s; }
    .bar-lbl { font-size: 9px; color: var(--muted); }
    .model-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .model-row:last-child { border-bottom: none; }
    .model-name { font-weight: 600; }
    .model-stats { text-align: right; color: var(--muted); font-size: 13px; }
    .recent-row { display: grid; grid-template-columns: 80px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .recent-row:last-child { border-bottom: none; }
    .recent-date { color: var(--muted); font-size: 11px; }
    .recent-model { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .badge-agent { background: rgb(from var(--accent) r g b / 0.12); color: var(--accent); }
    .badge-chat { background: rgba(129,140,248,0.12); color: #818CF8; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 14px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: var(--font); transition: opacity 0.15s; }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--accent); color: #0A0A0B; }
    .refresh-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .last-updated { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
<script src="topbar.js"></script>
<div class="page">
  <div class="refresh-row">
    <h1>API Usage</h1>
    <button class="btn btn-primary" onclick="load()">Refresh</button>
  </div>
  <div class="last-updated" id="lastUpdated"></div>

  <!-- Summary -->
  <div class="card" style="margin-top:14px">
    <div class="card-title">This Month</div>
    <div class="stat-row">
      <div class="stat"><div class="stat-val" id="statTokens">--</div><div class="stat-lbl">total tokens</div></div>
      <div class="stat"><div class="stat-val" id="statCost">--</div><div class="stat-lbl">est. cost USD</div></div>
      <div class="stat"><div class="stat-val" id="statCalls">--</div><div class="stat-lbl">API calls</div></div>
    </div>
  </div>

  <!-- Daily chart -->
  <div class="card">
    <div class="card-title">Daily Tokens — Last 14 Days</div>
    <div class="chart-wrap" id="chart"></div>
  </div>

  <!-- Model breakdown -->
  <div class="card">
    <div class="card-title">By Model</div>
    <div id="byModel"><div class="empty">No data yet</div></div>
  </div>

  <!-- Recent calls -->
  <div class="card">
    <div class="card-title">Recent Calls</div>
    <div id="recent"><div class="empty">No data yet</div></div>
  </div>
</div>

<script src="bus.js"></script>
<script src="tabbar.js"></script>
<script>
async function load() {
  document.getElementById('lastUpdated').textContent = 'Loading...';
  try {
    const r = await fetch('/api/health/read/apiusage?limit=500&days=30');
    if (!r.ok) { document.getElementById('lastUpdated').textContent = 'Error: ' + r.status; return; }
    const { rows } = await r.json();
    render(rows || []);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('lastUpdated').textContent = 'Failed: ' + e.message;
  }
}

function fmtTokens(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toString();
}

function render(rows) {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  // Month totals
  const monthRows = rows.filter(r => new Date(r.created_at) >= monthStart);
  const totalTokens = monthRows.reduce((s, r) => s + (r.data?.total_tokens || 0), 0);
  const totalCost = monthRows.reduce((s, r) => s + (r.data?.cost_usd || 0), 0);
  document.getElementById('statTokens').textContent = fmtTokens(totalTokens);
  document.getElementById('statCost').textContent = '$' + totalCost.toFixed(4);
  document.getElementById('statCalls').textContent = monthRows.length;

  // Daily chart (last 14 days)
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const byDay = {};
  rows.forEach(r => {
    const d = r.created_at?.slice(0, 10);
    if (d) byDay[d] = (byDay[d] || 0) + (r.data?.total_tokens || 0);
  });
  const maxDay = Math.max(...days.map(d => byDay[d] || 0), 1);
  const chartEl = document.getElementById('chart');
  chartEl.innerHTML = days.map(d => {
    const val = byDay[d] || 0;
    const h = Math.max(2, Math.round((val / maxDay) * 76));
    const lbl = new Date(d + 'T12:00').toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2);
    return `<div class="bar-col">
      <div class="bar-fill" style="height:${h}px" title="${fmtTokens(val)} tokens"></div>
      <div class="bar-lbl">${lbl}</div>
    </div>`;
  }).join('');

  // By model
  const models = {};
  rows.forEach(r => {
    const m = r.data?.model || 'unknown';
    if (!models[m]) models[m] = { calls: 0, tokens: 0, cost: 0 };
    models[m].calls++;
    models[m].tokens += r.data?.total_tokens || 0;
    models[m].cost += r.data?.cost_usd || 0;
  });
  const modelEl = document.getElementById('byModel');
  const modelEntries = Object.entries(models);
  if (!modelEntries.length) { modelEl.innerHTML = '<div class="empty">No data yet</div>'; }
  else {
    modelEl.innerHTML = modelEntries.sort((a, b) => b[1].tokens - a[1].tokens).map(([name, s]) => `
      <div class="model-row">
        <span class="model-name">${name.replace('claude-', '').replace('-20251001', '')}</span>
        <div class="model-stats">
          ${fmtTokens(s.tokens)} tokens &bull; ${s.calls} calls &bull; $${s.cost.toFixed(4)}
        </div>
      </div>`).join('');
  }

  // Recent calls
  const recentEl = document.getElementById('recent');
  const recent = rows.slice(0, 30);
  if (!recent.length) { recentEl.innerHTML = '<div class="empty">No calls yet</div>'; }
  else {
    recentEl.innerHTML = recent.map(r => {
      const d = r.data || {};
      const date = new Date(r.created_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const mode = d.mode || 'agent';
      const event = d.event_type ? ` · ${d.event_type}` : '';
      return `<div class="recent-row">
        <div>
          <div class="recent-date">${date}</div>
          <div class="recent-model">${(d.model || '').replace('claude-', '').replace('-20251001', '')}</div>
        </div>
        <div>
          <span class="badge badge-${mode}">${mode}</span>${event ? '<span style="font-size:11px;color:var(--muted);margin-left:6px">' + event + '</span>' : ''}
        </div>
        <div style="text-align:right;font-size:13px">
          ${fmtTokens(d.total_tokens || 0)}<br>
          <span style="font-size:11px;color:var(--muted)">$${(d.cost_usd || 0).toFixed(5)}</span>
        </div>
      </div>`;
    }).join('');
  }
}

load();
</script>

</body>
</html>
