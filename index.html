<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloudsync.js"></script>
<script src="realtime.js" defer></script>
<script src="events-bridge.js" defer></script>
<script src="topbar.js" defer></script>
<script src="tabbar.js" defer></script>
<script src="events.js" defer></script>
<link rel="manifest" href="manifest.json">
<style>
/* Today — APPLE_PLAN Phase 2. Layout only; all surface/type/state styling
   comes from design.css (the component system). No bespoke card CSS. */
body { background: var(--bg, #000); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.today-wrap { max-width: 640px; margin: 0 auto; padding: 0 var(--sp-2, 16px); }
.today-title {
  font-size: 34px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.1;
  padding: max(env(safe-area-inset-top, 0px), 20px) 0 2px;
  color: var(--text-primary, #FAFAFA);
}
.today-date { font-size: 17px; color: var(--text-tertiary); margin-bottom: var(--sp-2, 16px); }
.today-stack { display: flex; flex-direction: column; gap: 12px; }

/* one card chassis (.card from design.css) laid out as a glance + tap row */
.tcard {
  display: flex; align-items: center; gap: var(--sp-2, 16px);
  padding: 16px 18px; text-decoration: none; color: var(--text-primary);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.tcard-main { flex: 1; min-width: 0; }
.tcard-eyebrow { margin-bottom: 6px; }
.tcard-value { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
.tcard-sub { font-size: 14px; color: var(--text-secondary); margin-top: 3px; line-height: 1.35; }
.tcard-aside {
  font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;
  font-variant-numeric: tabular-nums; flex: none;
}
.tcard-grade { font-size: 13px; font-weight: 600; color: var(--text-tertiary); text-align: center; margin-top: 2px; }
.tcard .ds-row-chevron { flex: none; }
/* skeleton placeholder while LifeOS loads */
.tcard.is-loading .tcard-main > * { visibility: hidden; }
.tcard.is-loading { position: relative; }
.tcard.is-loading::after {
  content: ''; position: absolute; left: 18px; right: 48px; top: 18px; bottom: 18px;
  border-radius: 8px; background: rgba(255,255,255,0.05); overflow: hidden;
}
.tcard-empty { color: var(--text-tertiary); }
.tcard-empty .tcard-value { font-size: 17px; font-weight: 400; color: var(--text-secondary); }

/* goals sheet rows */
.sheet-goal { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.sheet-goal input[type=checkbox] { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.sheet-goal-text { flex: 1; font-size: 16px; }
.sheet-goal.done .sheet-goal-text { text-decoration: line-through; color: var(--text-tertiary); }
.sheet-goal-del { background: none; border: none; color: var(--text-tertiary); font-size: 20px; cursor: pointer; flex: none; padding: 0 4px; }
.sheet-add { display: flex; gap: 8px; margin-top: 12px; }
.sheet-add input { flex: 1; min-height: 44px; padding: 0 14px; }
</style>
</head>
<body>
<main class="today-wrap">
  <h1 class="today-title">Today</h1>
  <div class="today-date" id="todayDate"></div>
  <div class="today-stack" id="todayStack"></div>
</main>

<script>
// ── Today: an ordered stack of glanceable summary cards (APPLE_PLAN 6.1).
//    Every value is read from the deterministic LifeOS core + localStorage.
//    No logging controls live here; each card is a glance + a tap that pushes
//    to its home tab or opens a sheet. Zero AI / zero token spend on load.
(function today() {
  'use strict';

  function jget(k, fb) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
  function pad(n) { return String(n).padStart(2, '0'); }
  function activeDate() {
    var n = new Date();
    if (n.getHours() < 6) n.setDate(n.getDate() - 1);
    return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // date subtitle
  (function () {
    var d = new Date();
    var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('todayDate').textContent = DAYS[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate();
  })();

  // ── card builders. Each returns null (hide) or an object:
  //    { eyebrow, value, sub, aside, grade, accent, href, onTap, empty }
  //    optional:true cards hide themselves when their source has no data;
  //    non-optional cards always render (with an empty state) so Today is
  //    never blank for the core of the day.

  function cLifeScore() {
    if (!window.LifeOS || !LifeOS.score) return { eyebrow: 'Life Score', loading: true };
    var s = LifeOS.score();
    var col = s.total >= 75 ? 'var(--accent)' : s.total >= 50 ? 'var(--warn)' : 'var(--danger)';
    return {
      eyebrow: 'Life Score', aside: String(s.total), asideColor: col,
      grade: gradeFor(s.total),
      value: s.action || (s.total >= 75 ? 'On track' : 'Room to push'),
      sub: s.drag ? 'Biggest drag: ' + s.drag.label + ' (' + s.drag.pts + '/' + s.drag.max + ')' : '',
      onTap: openScoreSheet,
    };
  }
  function gradeFor(n) { return n >= 90 ? 'S' : n >= 80 ? 'A' : n >= 65 ? 'B' : n >= 50 ? 'C' : n >= 35 ? 'D' : 'F'; }

  function cCoach() {
    if (!window.__coachScan) return null;
    var ins; try { ins = window.__coachScan(); } catch (e) { return null; }
    if (!ins) return null;
    return {
      eyebrow: 'Coach', optional: true, accent: 'var(--warn)',
      value: ins.title, sub: ins.action ? ins.action + ' →' : '',
      href: ins.link || 'coach.html',
    };
  }

  function cReadiness() {
    if (!window.LifeOS || !LifeOS.readiness) return { eyebrow: 'Readiness', loading: true };
    var rd = LifeOS.readiness();
    var col = rd.score >= 75 ? 'var(--accent)' : rd.score >= 55 ? 'var(--warn)' : 'var(--danger)';
    return {
      eyebrow: 'Readiness', aside: String(rd.score), asideColor: col,
      value: rd.label, sub: rd.advice || '', href: 'watch.html',
    };
  }

  function cDayPlan() {
    if (!window.LifeOS || !LifeOS.context) return { eyebrow: 'Day plan', loading: true };
    var p = LifeOS.context('productivity') || {};
    var goals = p.goals_today || [];
    var gDone = goals.filter(function (g) { return g.done; }).length;
    var open = (p.tasks_open || []).length;
    if (!goals.length && !open) {
      return { eyebrow: 'Day plan', empty: true, value: 'Plan your day',
        sub: 'Add a goal or task for today', onTap: openTodaySheet };
    }
    var top = goals.filter(function (g) { return !g.done; })[0];
    return {
      eyebrow: 'Day plan',
      value: gDone + '/' + goals.length + ' goals' + (open ? ' · ' + open + ' task' + (open === 1 ? '' : 's') : ''),
      sub: top ? top.text : (goals.length ? 'All goals done — solid day' : ''),
      onTap: openTodaySheet,
    };
  }

  function cSupplements() {
    if (!window.LifeOS || !LifeOS.context) return null;
    var h = LifeOS.context('health') || {};
    var t = (h.supplements && h.supplements.today) || null;
    if (!t || !t.total) return null; // no stack configured
    if (!t.due || !t.due.length) {
      return { eyebrow: 'Supplements', value: 'All taken', sub: t.taken + '/' + t.total + ' for today', href: 'reminders.html', accent: 'var(--accent)' };
    }
    return {
      eyebrow: 'Supplements', accent: 'var(--warn)',
      value: t.due.length + ' due', sub: t.due.join(', '), href: 'reminders.html',
    };
  }

  function cFood() {
    var tgt = jget('nt:targets', {}) || {};
    var calT = tgt.calories || 2000, proT = tgt.protein || 150;
    var logs = (jget('nt:logs', []) || []).filter(function (l) { return l.dateKey === activeDate(); });
    if (!logs.length && !jget('nt:targets', null)) {
      return { eyebrow: 'Food', empty: true, value: 'Log a meal', sub: 'Track calories and protein', href: 'nutrition.html' };
    }
    var cal = 0, pro = 0;
    logs.forEach(function (l) { cal += l.calories || 0; pro += l.protein || 0; });
    var calLeft = Math.max(0, Math.round(calT - cal)), proLeft = Math.max(0, Math.round(proT - pro));
    return {
      eyebrow: 'Food', href: 'nutrition.html',
      value: calLeft + ' kcal left',
      sub: proLeft + 'g protein left · ' + Math.round(cal) + '/' + calT + ' kcal eaten',
    };
  }

  function cFocus() {
    var mins = 0;
    (jget('focus:logs:v1', []) || []).forEach(function (l) { if (l.date === (function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(new Date())) mins += (l.sec || 0) / 60; });
    mins = Math.round(mins);
    if (!mins) {
      return { eyebrow: 'Deep work', empty: true, value: 'Start a focus session', sub: 'Tracked time feeds your Life Score', href: 'tasks.html' };
    }
    return { eyebrow: 'Deep work', value: mins + ' min', sub: 'focused today', href: 'tasks.html' };
  }

  function cOrders() {
    var m = jget('mail:summary:v1', null);
    if (!m || (!m.orders_active && !m.delivery_issues)) return null;
    return {
      eyebrow: 'Orders', optional: true, href: 'mail.html',
      accent: m.delivery_issues ? 'var(--warn)' : undefined,
      value: (m.orders_active || 0) + ' active',
      sub: m.delivery_issues ? m.delivery_issues + ' delivery issue' + (m.delivery_issues === 1 ? '' : 's') : 'tracked from your inbox',
    };
  }

  function cEmail() {
    var m = jget('mail:summary:v1', null);
    if (!m || !m.needs_reply) return null;
    return {
      eyebrow: 'Email', optional: true, href: 'mail.html',
      value: m.needs_reply + ' need a reply',
      sub: m.bills ? m.bills + ' bill' + (m.bills === 1 ? '' : 's') + ' in inbox' : 'real people waiting on you',
    };
  }

  function cMoney() {
    if (!window.LifeOS || !LifeOS.context) return null;
    var f = LifeOS.context('finance') || {};
    var sr = f.savings_rate_pct, last = f.savings_rate_last_month_actual_pct;
    if (sr == null) return null;
    if (sr < 10) {
      return { eyebrow: 'Money', optional: true, accent: 'var(--warn)', href: 'finance.html',
        value: 'Savings rate ' + sr + '%', sub: 'below your 10% target' };
    }
    if (last != null && sr < last - 5) {
      return { eyebrow: 'Money', optional: true, accent: 'var(--warn)', href: 'finance.html',
        value: 'Savings down to ' + sr + '%', sub: 'was ' + last + '% last month' };
    }
    return null;
  }

  function cOpportunity() {
    var s = jget('radar:summary:v1', null);
    if (!s || !s.shown || !s.shown.length) return null;
    var o = s.shown[0];
    return {
      eyebrow: 'Opportunity', optional: true, href: 'radar.html',
      value: o.title || o.label || o.headline || 'See the radar',
      sub: (s.total_found || s.shown.length) + ' on the radar',
    };
  }

  function cMissing() {
    if (!window.LifeOS || !LifeOS.quality) return null;
    var q; try { q = LifeOS.quality(); } catch (e) { return null; }
    if (!q || q.score >= 70 || !q.stale || !q.stale.length) return null;
    var w = q.stale[0];
    return {
      eyebrow: 'Missing data', optional: true, accent: 'var(--text-tertiary)', href: 'log.html',
      value: 'Log ' + w.label, sub: 'Data quality ' + q.score + '% · ' + (w.daysAgo != null ? w.label + ' is ' + w.daysAgo + 'd old' : w.label + ' never logged'),
    };
  }

  var BUILDERS = [cLifeScore, cCoach, cReadiness, cDayPlan, cSupplements, cFood, cFocus, cOrders, cEmail, cMoney, cOpportunity, cMissing];

  // ── render the stack ──────────────────────────────────────────────
  function cardEl(c) {
    var el = document.createElement(c.href ? 'a' : 'div');
    el.className = 'card tcard';
    if (c.href) el.href = c.href;
    else { el.setAttribute('role', 'button'); el.tabIndex = 0; }
    if (c.accent) el.style.setProperty('--accent', c.accent);
    if (c.loading) el.classList.add('is-loading');
    if (c.empty) el.classList.add('tcard-empty');

    var main = document.createElement('div'); main.className = 'tcard-main';
    main.innerHTML = '<div class="t-caption tcard-eyebrow">' + esc(c.eyebrow) + '</div>'
      + '<div class="tcard-value">' + esc(c.loading ? '' : c.value || '') + '</div>'
      + (c.sub ? '<div class="tcard-sub">' + esc(c.sub) + '</div>' : '');
    el.appendChild(main);

    if (c.aside != null) {
      var aside = document.createElement('div');
      var box = document.createElement('div'); box.className = 'tcard-aside';
      box.textContent = c.aside; if (c.asideColor) box.style.color = c.asideColor;
      aside.appendChild(box);
      if (c.grade) { var g = document.createElement('div'); g.className = 'tcard-grade'; g.textContent = c.grade; aside.appendChild(g); }
      el.appendChild(aside);
    }
    if (c.href || c.onTap) { var chev = document.createElement('span'); chev.className = 'ds-row-chevron'; el.appendChild(chev); }
    if (c.onTap) { el.addEventListener('click', c.onTap); el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.onTap(); } }); }
    return el;
  }

  function render() {
    var stack = document.getElementById('todayStack');
    var frag = document.createDocumentFragment();
    var shown = 0;
    BUILDERS.forEach(function (fn) {
      var c; try { c = fn(); } catch (e) { c = null; }
      if (!c) return;
      frag.appendChild(cardEl(c));
      shown++;
    });
    stack.innerHTML = '';
    stack.appendChild(frag);
    // first-run: nothing but the always-on cards have data -> a gentle nudge
    if (!shown) {
      stack.innerHTML = '<div class="ds-empty"><span class="ds-empty-icon">☀️</span>'
        + '<strong>Log one thing to bring Today to life</strong>'
        + 'Your day fills in as you track it. Tap + to start.</div>';
    }
  }

  // initial skeleton paint, then real render once LifeOS is ready
  render();
  if (window.LifeOS && LifeOS.score) render();
  else window.addEventListener('lifeos:ready', render, { once: true });
  window.addEventListener('lifeos:logged', render);
  window.addEventListener('goals-changed', render);
  window.addEventListener('storage', render);
  window.LifeOS_renderToday = render;

  // ── Life Score breakdown sheet ────────────────────────────────────
  function openScoreSheet() {
    if (!window.DS || !window.LifeOS) return;
    var s = LifeOS.score(), q = LifeOS.quality();
    var html = '<div class="t-large-title" style="font-size:28px;margin-bottom:4px">' + s.total + '<span style="font-size:16px;color:var(--text-tertiary);font-weight:400"> / 100 · ' + gradeFor(s.total) + '</span></div>';
    html += '<div class="ls-bars" style="display:flex;flex-direction:column;gap:8px;margin:16px 0">';
    s.parts.forEach(function (p) {
      var pct = Math.round(p.pts / p.max * 100);
      html += '<div class="ls-bar-row"><span class="ls-bar-label">' + esc(p.label) + '</span>'
        + '<div class="ls-bar-track"><div class="ls-bar-fill" style="width:' + pct + '%"></div></div>'
        + '<span class="ls-bar-detail">' + esc(p.detail) + '</span></div>';
    });
    html += '</div>';
    var worst = q.worst ? (q.worst.label + (q.worst.daysAgo != null ? ' stale ' + q.worst.daysAgo + 'd' : ' never logged')) : 'all fresh';
    html += '<div class="t-footnote">Data quality ' + q.score + '% · ' + esc(worst) + '</div>';
    DS.sheet(html, { title: 'Life Score' });
  }

  // ── Today goals sheet (the one place Today lets you log) ───────────
  var goalsContent = null;
  function openTodaySheet() {
    if (!window.DS) { location.href = 'calendar.html'; return; }
    var key = 'goals:' + activeDate();
    var box = document.createElement('div');
    function draw() {
      var gs = jget(key, []) || [];
      box.innerHTML = '';
      var grp = document.createElement('div'); grp.className = 'ds-group';
      if (!gs.length) {
        var e = document.createElement('div'); e.className = 'ds-empty';
        e.innerHTML = '<strong>No goals yet</strong>Add your first goal for today.';
        grp = e;
      } else {
        gs.forEach(function (g, i) {
          var row = document.createElement('div'); row.className = 'sheet-goal' + (g.done ? ' done' : '');
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!g.done;
          cb.addEventListener('change', function () { var a = jget(key, []); a[i].done = cb.checked; localStorage.setItem(key, JSON.stringify(a)); fire(); draw(); });
          var t = document.createElement('span'); t.className = 'sheet-goal-text'; t.textContent = g.text;
          var del = document.createElement('button'); del.className = 'sheet-goal-del'; del.textContent = '×'; del.setAttribute('aria-label', 'Delete');
          del.addEventListener('click', function () {
            var removed = jget(key, [])[i];
            var a = jget(key, []); a.splice(i, 1); localStorage.setItem(key, JSON.stringify(a)); fire(); draw();
            DS.toast('Deleted "' + (removed ? removed.text : 'goal') + '"', { action: 'Undo', onAction: function () { var b = jget(key, []); b.splice(i, 0, removed); localStorage.setItem(key, JSON.stringify(b)); fire(); draw(); } });
          });
          row.appendChild(cb); row.appendChild(t); row.appendChild(del); grp.appendChild(row);
        });
      }
      box.appendChild(grp);
      var add = document.createElement('div'); add.className = 'sheet-add';
      var inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Add a goal for today…';
      var btn = document.createElement('button'); btn.className = 'btn-filled'; btn.textContent = 'Add';
      function addGoal() { var v = inp.value.trim(); if (!v) return; var a = jget(key, []); a.push({ text: v, done: false }); localStorage.setItem(key, JSON.stringify(a)); inp.value = ''; fire(); draw(); }
      btn.addEventListener('click', addGoal);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') addGoal(); });
      add.appendChild(inp); add.appendChild(btn); box.appendChild(add);
    }
    function fire() { window.dispatchEvent(new CustomEvent('goals-changed')); }
    draw();
    DS.sheet(box, { title: 'Today’s goals' });
  }

  // ── rollover + streak (kept: feeds the Life Score) ────────────────
  (function rolloverAndStreak() {
    var active = activeDate();
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('goals:') === 0) keys.push(k); }
    keys.sort();
    // roll unfinished past goals into today
    var todayGoals = jget('goals:' + active, []) || [];
    var seen = {}; todayGoals.forEach(function (g) { seen[g.text] = 1; });
    var changed = false;
    keys.forEach(function (key) {
      var date = key.slice(6);
      if (date >= active) return;
      (jget(key, []) || []).forEach(function (g) { if (!g.done && !seen[g.text]) { todayGoals.push({ text: g.text, done: false }); seen[g.text] = 1; changed = true; } });
      localStorage.removeItem(key);
    });
    if (changed) localStorage.setItem('goals:' + active, JSON.stringify(todayGoals));
    // streak
    var st = jget('goal_streak_v1', { count: 0, lastProcessedDate: null });
    keys.forEach(function (key) {
      var date = key.slice(6);
      if (date >= active) return;
      if (st.lastProcessedDate && date <= st.lastProcessedDate) return;
      var gs = jget(key, []) || [];
      if (gs.length) st.count = gs.every(function (g) { return g.done; }) ? st.count + 1 : 0;
      st.lastProcessedDate = date;
    });
    localStorage.setItem('goal_streak_v1', JSON.stringify(st));
  })();

  // cloud sync: re-render when goals/streak merge in from another device
  if (window.LifeOSSync) {
    LifeOSSync.register('dashboard', ['goal_streak_v1'], {
      prefixes: ['goals:'],
      onApply: function () { try { render(); } catch (e) {} try { window.dispatchEvent(new CustomEvent('goals-changed')); } catch (e) {} },
    });
  }
})();
</script>

<script>
// ===== PROACTIVE COACH — deterministic daily-insight scan =====
// Kept from the previous Today: ranks real triggers (sleep debt, train load,
// delayed orders, savings drop, overdue retest, etc.) with the actual numbers,
// no AI call. Today's Coach card reads window.__coachScan(). Self-suppresses
// anything shown in the last 3 days.
(function proactiveCoach() {
  'use strict';
  function jget(k, fb) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
  function localKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function daysAgoKey(n) { var d = new Date(); d.setDate(d.getDate() - n); return localKey(d); }
  function daysSince(dateStr) {
    if (!dateStr) return null;
    var d = new Date(String(dateStr).slice(0, 10).replace(/\//g, '-') + 'T12:00:00');
    return isNaN(d) ? null : Math.floor((Date.now() - d.getTime()) / 86400000);
  }
  var LOG_KEY = 'coach:insight_log:v1';

  function tSleepDebt() {
    var rd = LifeOS.readiness();
    if (!rd || rd.sleep_debt_hrs == null || rd.sleep_debt_hrs < 5) return null;
    return { id: 'sleep_debt', rank: 8, title: 'Sleep debt is at ' + rd.sleep_debt_hrs + 'h this week', action: 'In bed 30 min earlier tonight', link: 'health.html' };
  }
  function tTrainLoad() {
    var rd = LifeOS.readiness();
    if (!rd || rd.score >= 50) return null;
    var done = jget('po_coach_workout_done', {}) || {};
    var recent = 0; for (var i = 0; i < 3; i++) if (done[daysAgoKey(i)]) recent++;
    if (recent < 2) return null;
    return { id: 'train_load', rank: 7, title: 'Readiness ' + rd.score + ' after ' + recent + ' sessions in 3 days', action: 'Make today easy or rest', link: 'gym.html' };
  }
  function tOrderDelayed() {
    var m = jget('mail:summary:v1', null);
    if (!m || !(m.delivery_issues > 0)) return null;
    return { id: 'order_delayed', rank: 7, title: m.delivery_issues + ' deliver' + (m.delivery_issues === 1 ? 'y has' : 'ies have') + ' problems', action: 'Check the affected orders', link: 'mail.html' };
  }
  function tSavingsDrop() {
    var f = LifeOS.context('finance'); var r = f && f.savings_rate_last_month_actual_pct;
    if (r == null || r >= 10) return null;
    return { id: 'savings_drop', rank: 6, title: 'Savings rate fell to ' + r + '% last month', action: 'Open the money review', link: 'finance.html' };
  }
  function tRetestOverdue() {
    var logs = jget('blood:logs', []) || [];
    if (!logs.length) return null;
    var last = logs.map(function (e) { return e.date; }).sort().pop();
    var d = daysSince(last);
    if (d == null || d < 180) return null;
    return { id: 'retest_overdue', rank: 6, title: 'Bloodwork is ' + d + ' days old', action: 'Book a retest this week', link: 'health.html' };
  }
  function tWeightFast() {
    var logs = (jget('po_coach_weights', []) || []).filter(function (e) { return e && e.dateKey && e.weight > 0; }).sort(function (a, b) { return String(a.dateKey).localeCompare(String(b.dateKey)); }).slice(-10);
    if (logs.length < 4) return null;
    var recent = logs.slice(-3).reduce(function (s, e) { return s + e.weight; }, 0) / 3;
    var older = logs.slice(0, 3).reduce(function (s, e) { return s + e.weight; }, 0) / 3;
    var diff = +(recent - older).toFixed(1);
    if (Math.abs(diff) < 1) return null;
    return { id: 'weight_fast', rank: 6, title: 'Weight moved ' + (diff > 0 ? '+' : '') + diff + ' kg this week', action: 'Check nutrition vs target', link: 'nutrition.html' };
  }
  function tInboxReply() {
    var m = jget('mail:summary:v1', null);
    if (!m || !(m.needs_reply >= 5)) return null;
    return { id: 'inbox_reply', rank: 4, title: m.needs_reply + ' emails are waiting on you', action: 'Batch-reply in Mail', link: 'mail.html' };
  }
  function tDataQuality() {
    var q = LifeOS.quality();
    if (!q || q.score >= 50 || !q.worst) return null;
    return { id: 'dq_low', rank: 3, title: 'Data quality is ' + q.score + '% — advice is degrading', action: 'Add suggested check-ins', link: 'reminders.html' };
  }

  function scan() {
    if (!window.LifeOS || !LifeOS.readiness) return null;
    var fns = [tSleepDebt, tTrainLoad, tOrderDelayed, tSavingsDrop, tRetestOverdue, tWeightFast, tInboxReply, tDataQuality];
    var hits = [];
    fns.forEach(function (fn) { try { var r = fn(); if (r) hits.push(r); } catch (e) {} });
    var log = jget(LOG_KEY, []) || [];
    var cutoff = daysAgoKey(2);
    var recentIds = log.filter(function (e) { return e.date >= cutoff; }).map(function (e) { return e.id; });
    hits = hits.filter(function (h) { return recentIds.indexOf(h.id) < 0; });
    return hits.sort(function (a, b) { return b.rank - a.rank; })[0] || null;
  }
  window.__coachScan = scan;
})();
</script>

<script>
// ===== FIRST-RUN ONBOARDING (backlog 7) =====
// Shows once, only for a genuinely fresh install (no logged data). Never seeds
// any store — each step routes the user into a real logging flow.
(function onboarding() {
  'use strict';
  var DONE = 'onboarding:done:v1';
  function jhas(k) { try { var v = localStorage.getItem(k); return v && v !== '[]' && v !== '{}'; } catch (e) { return false; } }
  function hasData() { return ['nt:logs', 'po_coach_weights', 'sleep:logs', 'ing:tx', 'supps:stack', 'tasks:v1'].some(jhas); }
  function start() {
    if (localStorage.getItem(DONE) === '1') return;
    if (hasData()) { try { localStorage.setItem(DONE, '1'); } catch (e) {} return; }
    var steps = [
      { ico: '⚖️', title: 'Log your weight', sub: 'One number to start your trend', act: function () { if (window.LifeOSCmd) { window.LifeOSCmd.open(); window.LifeOSCmd.prefill('weight '); } } },
      { ico: '🍽', title: 'Log a meal', sub: 'Snap or type what you ate', act: function () { location.href = '/nutrition.html'; } },
      { ico: '🌅', title: 'Turn on the morning briefing', sub: 'Readiness, food, money — each morning', act: function () { location.href = '/reminders.html'; } },
    ];
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(5,5,6,0.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px';
    var card = '<div style="width:100%;max-width:420px;background:#141416;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,0.6)">'
      + '<div style="font-size:20px;font-weight:800;color:#FAFAFA;margin-bottom:4px">Welcome to Life OS</div>'
      + '<div style="font-size:13px;color:#B8B6B0;line-height:1.5;margin-bottom:16px">Your whole life in one app. Start with one of these — everything else builds from your data.</div>'
      + steps.map(function (s, i) {
          return '<button data-i="' + i + '" class="ob-step" style="width:100%;display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:8px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#FAFAFA;font-family:inherit;cursor:pointer;text-align:left">'
            + '<span style="font-size:22px">' + s.ico + '</span>'
            + '<span style="flex:1"><span style="display:block;font-size:14px;font-weight:700">' + s.title + '</span>'
            + '<span style="display:block;font-size:12px;color:#76746E">' + s.sub + '</span></span>'
            + '<span style="color:#76746E;font-size:18px">›</span></button>';
        }).join('')
      + '<button id="obSkip" style="width:100%;margin-top:6px;padding:11px;border-radius:12px;border:none;background:transparent;color:#76746E;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">Skip for now</button>'
      + '</div>';
    ov.innerHTML = card;
    document.body.appendChild(ov);
    function finish() { try { localStorage.setItem(DONE, '1'); } catch (e) {} ov.remove(); }
    ov.querySelectorAll('.ob-step').forEach(function (b) { b.addEventListener('click', function () { var s = steps[+b.dataset.i]; finish(); if (s) s.act(); }); });
    ov.querySelector('#obSkip').addEventListener('click', finish);
    ov.addEventListener('click', function (e) { if (e.target === ov) finish(); });
  }
  window.__onboardingStart = start;
  if (window.LifeOS) setTimeout(start, 800);
  else window.addEventListener('lifeos:ready', function () { setTimeout(start, 800); }, { once: true });
})();
</script>
