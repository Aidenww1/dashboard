<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>More - Life OS</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body[data-page="more"] .content{max-width:1420px;padding-top:0}
  body[data-page="more"] .page-head{align-items:center;margin-bottom:4px}
  body[data-page="more"] .page-head-r{min-width:min(58vw,820px)}
  body[data-page="more"] .search{flex:1;max-width:620px;height:44px}
  .mr-tabs{display:flex;align-items:center;gap:4px;min-height:46px;margin:10px 0 14px;padding:5px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .mr-tabs button{flex:1 1 0;min-width:96px;height:36px;border:0;border-radius:6px;background:transparent;color:var(--text-2);font:inherit;font-size:13px;cursor:pointer}
  .mr-tabs button:hover{color:var(--text);background:var(--surface-hover)}
  .mr-tabs button[aria-selected="true"]{color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-border)}
  .mr-view{gap:12px;align-content:start}
  .mr-view[hidden]{display:none}
  .mr-view .card{padding:16px;gap:10px}
  .mr-kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .mr-kpi{min-height:108px;padding:15px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .mr-kpi .label{color:var(--text-3);font-size:11px;text-transform:uppercase}
  .mr-kpi .value{margin-top:10px;font-size:25px;font-weight:700}
  .mr-kpi .sub{margin-top:4px;color:var(--text-3);font-size:12px}
  .mr-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:7px 4px;color:inherit;text-decoration:none;border-bottom:1px solid var(--border)}
  .mr-row:last-child{border-bottom:0}
  .mr-row:hover{background:rgba(255,255,255,.025)}
  .mr-icon{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--border);border-radius:8px;color:var(--accent);background:var(--accent-soft)}
  .mr-icon svg{width:17px;height:17px}
  .mr-copy{flex:1;min-width:0}
  .mr-copy strong{display:block;font-size:13.5px}
  .mr-copy span{display:block;margin-top:2px;color:var(--text-3);font-size:12px}
  .mr-end{flex:0 0 auto;color:var(--text-3);font-size:12px;text-align:right}
  .mr-status{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px}
  .mr-status.off{color:var(--text-3)}
  .mr-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .mr-form-row{display:grid;grid-template-columns:minmax(0,1fr) 130px;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--border)}
  .mr-form-row:last-child{border-bottom:0}
  .mr-form-row label{font-size:13px}
  .mr-form-row small{display:block;margin-top:2px;color:var(--text-3)}
  .mr-form-row .input{width:100%;height:38px}
  .mr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mr-switch{width:42px;height:24px;justify-self:end;border:1px solid var(--border);border-radius:12px;background:var(--surface-raised);cursor:pointer;position:relative}
  .mr-switch:after{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:var(--text-3);transition:.15s}
  .mr-switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
  .mr-switch[aria-checked="true"]:after{left:20px;background:white}
  .mr-note{padding:12px;border:1px solid var(--border);border-radius:7px;color:var(--text-2);font-size:12px;line-height:1.5;background:var(--surface-raised)}
  .mr-empty{grid-column:1/-1;min-height:220px;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text-3)}
  .mr-empty strong{display:block;margin-bottom:6px;color:var(--text)}
  .mr-danger{border-color:rgba(248,113,113,.28)!important}
  .mr-danger .card-title{color:var(--red)}
  @media(max-width:900px){
    body[data-page="more"] .page-head-r{min-width:0}
    .mr-tabs{flex-wrap:wrap;gap:4px}
    .mr-tabs button{flex:1 1 30%;min-width:90px}
    .mr-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:620px){
    .mr-tabs button{min-width:0;font-size:12px}
    .mr-kpis{gap:8px}
    .mr-kpi{min-height:98px;padding:13px}
    .mr-kpi .value{font-size:21px}
    .mr-form-row{grid-template-columns:minmax(0,1fr) 108px}
    .mr-row{align-items:flex-start}
    .mr-end{max-width:92px}
  }
</style>
</head>
<body data-page="more">
<div class="app">
  <main class="main">
    <div class="content">
      <header class="page-head">
        <div class="page-head-l"><h1 class="t-page">More</h1><div class="page-date" id="mrDate"></div></div>
        <div class="page-head-r">
          <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><input id="mrSearch" type="search" placeholder="Search this section..." aria-label="Search this section"></label>
          <a class="btn btn-primary" href="log.html">+ Add</a>
        </div>
      </header>
      <nav class="mr-tabs" id="mrTabs" role="tablist" aria-label="More sections"></nav>
      <div id="mrViews"></div>
    </div>
  </main>
</div>
<script src="../data-registry.js"></script>
<script src="../auth.js"></script>
<script src="compatibility-store.js"></script>
<script src="../canonical-events.js"></script>
<script src="../event-repository.js"></script>
<script src="../canonical-sync.js"></script>
<script src="../projection-engine.js"></script>
<script src="../bloodwork-model-registry.js"></script>
<script src="../bloodwork-outlook.js"></script>
<script src="../projection-definitions.js"></script>
<script src="ui.js"></script>
<script src="shell.js"></script>
<script src="canonical-runtime.js"></script>
<script>
(function(){
  'use strict';
  var tabs=[['settings','Settings'],['integrations','Integrations'],['notifications','Notifications'],['data','Data'],['life','Life'],['about','About']];
  var settingsKey='settings:v1';
  var root=document.getElementById('mrViews');
  var tabsRoot=document.getElementById('mrTabs');
  var search=document.getElementById('mrSearch');
  var systemState=null;
  var systemLoading=false;

  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function read(key,fallback){try{var raw=localStorage.getItem(key);return raw==null?fallback:JSON.parse(raw);}catch(e){return fallback;}}
  function write(key,value){window.LifeOSCompatibilityStore.set(key,value);}
  function has(key){var value=localStorage.getItem(key);return value!=null&&value!==''&&value!=='[]'&&value!=='{}';}
  function active(){var id=location.hash.slice(1);return tabs.some(function(t){return t[0]===id;})?id:'settings';}
  function icon(name){
    var paths={settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',link:'<path d="M9.5 14.5l5-5"/><path d="M7 17H5a4 4 0 010-8h3M17 7h2a4 4 0 010 8h-3"/>',bell:'<path d="M6 10a6 6 0 0112 0c0 4 2 5 2 5H4s2-1 2-5"/><path d="M10 19h4"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',heart:'<path d="M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 017-3 4 4 0 019 3z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/>',bank:'<path d="M3 10l9-6 9 6M5 10v9M10 10v9M14 10v9M19 10v9M3 20h18"/>',watch:'<circle cx="12" cy="12" r="5"/><path d="M9 3h6l1 4M9 21h6l1-4"/>',download:'<path d="M12 4v11M8 11l4 4 4-4M4 20h16"/>',tool:'<path d="M14 6a4 4 0 01-5 5L4 16l4 4 5-5a4 4 0 005-5z"/>',shield:'<path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z"/>',task:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',book:'<path d="M4 5a3 3 0 013-2h5v17H7a3 3 0 00-3 1zM20 5a3 3 0 00-3-2h-5v17h5a3 3 0 013 1z"/>',users:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20a6 6 0 0112 0M15 15a5 5 0 016 5"/>',review:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/>'};
    return '<span class="mr-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||paths.info)+'</svg></span>';
  }
  function card(title,body,cls){return '<section class="card '+(cls||'col-6')+'"><div class="card-title">'+esc(title)+'</div>'+body+'</section>';}
  function row(ic,title,sub,end,href){var tag=href?'a':'div';return '<'+tag+' class="mr-row" '+(href?'href="'+esc(href)+'"':'')+' data-search="'+esc((title+' '+sub).toLowerCase())+'">'+icon(ic)+'<span class="mr-copy"><strong>'+esc(title)+'</strong><span>'+esc(sub)+'</span></span><span class="mr-end">'+(end||'')+'</span></'+tag+'>';}
  function status(on,label){return '<span class="mr-status '+(on?'':'off')+'"><i class="mr-dot"></i>'+esc(label)+'</span>';}
  function kpi(label,value,sub){return '<div class="mr-kpi"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div><div class="sub">'+esc(sub)+'</div></div>';}
  function formRow(label,sub,control){return '<div class="mr-form-row"><label>'+esc(label)+'<small>'+esc(sub)+'</small></label>'+control+'</div>';}
  function input(id,value,type,step){return '<input class="input" id="'+id+'" type="'+(type||'number')+'" '+(step?'step="'+step+'"':'')+' value="'+esc(value||'')+'">';}
  function switcher(id,on){return '<button class="mr-switch" id="'+id+'" role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="Toggle"></button>';}

  function settingsView(){
    var s=read(settingsKey,{});var nt=read('nt:tdee',{});
    return card('Daily targets',formRow('Calories','Daily nutrition target',input('setCalories',s.goalCalories||nt.calories||''))+formRow('Protein','Grams per day',input('setProtein',s.goalProtein||nt.protein||''))+formRow('Sleep','Hours per night',input('setSleep',s.goalSleep||'','number','0.5'))+formRow('Water','Bottles per day',input('setWater',s.goalWater||''))+'<div class="mr-actions"><button class="btn btn-primary" data-save-targets>Save targets</button><span class="mr-status" id="targetStatus"></span></div>','col-6')+
      card('Coach context',formRow('Context window','Days included in Coach context',input('setContext',s.aiContextDays||14))+formRow('Include finance','Allow Coach to read finance summaries',switcher('setFinance',s.aiIncludeFinance===true))+formRow('Include bloodwork','Allow Coach to read lab summaries',switcher('setBlood',s.aiIncludeBloodwork!==false))+'<div class="mr-actions"><button class="btn btn-primary" data-save-context>Save context</button><span class="mr-status" id="contextStatus"></span></div>','col-6')+
      card('Preferences',row('settings','Water settings','Units, bottle size, profile and target','','log.html#water')+row('bank','Money preferences','Currency and financial targets','','money.html#overview')+row('shield','Privacy controls','Review local storage and connected services','','privacy.html'),'col-12');
  }
  function integrationsView(){
    var recorded=systemState&&systemState.connections||{};
    var remote=systemState&&systemState.cross_device_sync||{};
    var items=[
      ['calendar','Google Calendar','Schedule and day-plan events',recorded.calendar||has('gcal:token')||has('gcal:events')||has('calendar:events'),'../calendar.html'],
      ['mail','Mail','Inbox, bills, orders and reply summaries',recorded.mail||has('mail:summary:v1')||has('gmail:connected'),'../mail.html'],
      ['bank','Bank import','Accounts and transaction imports',recorded.finance||has('ing:tx')||has('fin:accounts:v1'),'../finance.html#accounts'],
      ['watch','Health data','Wearable, sleep and recovery metrics',recorded.health||has('health:metrics:v1')||has('aw:today')||has('activity:today'),'../health.html'],
      ['bell','Browser notifications','Local and phone push reminders',typeof Notification!=='undefined'&&Notification.permission==='granted','../reminders.html']
    ];
    var connected=items.filter(function(item){return item[3];}).length;
    var syncLabel=remote.state||'Checking';
    var syncActions='<div class="mr-actions">'+(!remote.authenticated?'<button class="btn btn-primary" data-sync-auth>Sign in</button>':'')+'<button class="btn '+(remote.enabled?'btn-secondary':'btn-primary')+'" data-sync-toggle>'+(remote.enabled?'Disable sync':'Enable cross-device sync')+'</button>'+(remote.enabled?'<button class="btn btn-secondary" data-sync-now>Sync now</button>':'')+'</div>';
    return '<div class="mr-kpis">'+kpi('Configured',connected,'of '+items.length+' recorded')+kpi('Mail',items[1][3]?'Configured':'Not connected','Live reachability is checked in Mail')+kpi('Calendar',items[0][3]?'Configured':'Not connected','Live reachability is checked in Calendar')+kpi('Cross-device sync',syncLabel,remote.pending?remote.pending+' event(s) pending':'Owner-scoped canonical ledger')+'</div>'+card('Connections',items.map(function(item){return row(item[0],item[1],item[2],status(item[3],item[3]?'Configured':'Not connected'),item[4]);}).join('')+'<div class="mr-note">A configured connection means Life OS has recorded credentials or imported facts. It does not prove the provider is reachable right now.</div>','col-8')+card('Cross-device continuity','<div class="mr-note">Canonical sync is off until you sign in and explicitly enable it. Remote rows are scoped to that owner; conflicts are retained instead of silently overwriting either device.</div>'+syncActions,'col-4');
  }
  function notificationsView(){
    var reminders=read('reminders:v1',{});var builtin=reminders.builtin||{};var custom=Array.isArray(reminders.custom)?reminders.custom:[];var activeBuiltins=Object.keys(builtin).filter(function(key){return builtin[key]&&builtin[key].enabled;}).length;var brief=localStorage.getItem('briefing:enabled:v1')==='1';var permission=typeof Notification==='undefined'?'Unavailable':Notification.permission;
    return '<div class="mr-kpis">'+kpi('Permission',permission,'Browser notification status')+kpi('Daily reminders',activeBuiltins,'Enabled schedules')+kpi('Custom reminders',custom.length,'Saved reminders')+kpi('Morning briefing',brief?'On':'Off',localStorage.getItem('briefing:waketime:v1')||'07:00')+'</div>'+card('Notification settings',row('bell','Morning briefing','One readiness, food, training, orders and money summary',status(brief,brief?'Enabled':'Disabled'),'../reminders.html')+row('calendar','Daily reminders','Water, training, sleep, medicines and habits',status(activeBuiltins>0,activeBuiltins+' active'),'../reminders.html')+row('review','Custom reminders','Your own times and weekday schedules',custom.length+' saved','../reminders.html'),'col-8')+card('Delivery status','<div class="mr-note">Notifications require browser permission. Local schedules work while the app is open or installed; phone push also requires the server connection shown on the Reminders page.</div><div class="mr-actions"><a class="btn btn-primary" href="../reminders.html">Manage notifications</a></div>','col-4');
  }
  function dataStats(){var chars=0;for(var i=0;i<localStorage.length;i++){chars+=(localStorage.getItem(localStorage.key(i))||'').length;}return{keys:localStorage.length,kb:Math.max(0,Math.round(chars/1024))};}
  function dataView(){var stat=dataStats();var eventCount=systemState?systemState.canonical_events:0;var pending=systemState?systemState.pending_sync:0;var backup=systemState&&systemState.backup;return '<div class="mr-kpis">'+kpi('Canonical events',eventCount,'IndexedDB source records')+kpi('Device cache',stat.kb+' KB',stat.keys+' compatibility keys')+kpi('Sync queue',pending,pending?'Waiting for acknowledgement':'Nothing pending')+kpi('Last backup',backup&&backup.created_at?String(backup.created_at).slice(0,10):'Not recorded','Verified metadata only')+'</div>'+card('Data tools',row('download','Export and restore','Download JSON, CSV, or a full ZIP backup','','../export.html')+row('tool','Fix invalid data','Scan gym and body logs for impossible values','','fix.html')+row('shield','Privacy and security','Review device storage, sync, and AI context','','privacy.html'),'col-8')+card('Complete device snapshot','<div class="mr-note">Export or restore canonical events, pending sync records, and compatibility storage. Authentication tokens are never included.</div><div class="mr-actions"><button class="btn btn-primary" data-export>Export JSON</button><label class="btn btn-secondary" style="cursor:pointer">Restore JSON<input type="file" accept="application/json,.json" data-restore-file hidden></label></div>','col-4')+card('Danger zone','<div class="mr-note">Clearing this device removes its canonical database and compatibility storage. Synced records may return after sign-in; this does not delete remote data.</div><div class="mr-actions"><button class="btn btn-danger" data-clear>Clear this device</button></div>','col-12 mr-danger');}
  function lifeView(){return card('Plan and focus',row('task','Tasks','Manage tasks and to-dos','','tasks.html')+row('calendar','Calendar','Schedule, goals and day plan','','../calendar.html')+row('review','Weekly review','Reflect on logged outcomes and create plans','','../review.html'),'col-4')+card('Health records',row('watch','Health details','Sleep, HRV, heart rate and recovery','','../health.html')+row('heart','Body and labs','Measurements, recovery, photos and lab history','','log.html#body')+row('shield','Data quality','Review missing, stale, and conflicting records','','fix.html'),'col-4')+card('Library and experiences',row('book','Library','Books, articles and learning resources','','library.html')+row('info','Travel','Trips, packing and experiences','','travel.html')+row('download','Exports','Your generated data files and backups','','../export.html'),'col-4');}
  function aboutView(){var stat=dataStats();var device=systemState&&systemState.device_id||'Checking';var pending=systemState?systemState.pending_sync:0;return '<div class="mr-kpis">'+kpi('Product','Life OS','Personal operating system')+kpi('Build','Checking...','Service worker cache')+kpi('Device ID',device,'Canonical device identity')+kpi('Sync',pending?pending+' pending':'Device current','Cross-device needs authenticated sync')+'</div>'+card('About Life OS','<div class="mr-note">Life OS combines health, training, nutrition, money, planning, and personal records. The device cache works offline; cross-device continuity depends on the configured sync service. Empty modules remain explicit instead of inventing answers.</div>'+row('shield','Privacy','How device data, sync, backup and AI context work','','privacy.html')+row('info','API usage','See model requests and cached responses','','usage.html'),'col-8')+card('System',row('database','Device storage',stat.kb+' KB across '+stat.keys+' compatibility keys',status(true,'Available'),'')+row('link','Service worker','Offline shell and cached assets','<span id="buildStatus">Checking</span>',''),'col-4');}
  var views={settings:settingsView,integrations:integrationsView,notifications:notificationsView,data:dataView,life:lifeView,about:aboutView};
  function paintTabs(id){tabsRoot.innerHTML=tabs.map(function(tab){return '<button id="tab-'+tab[0]+'" type="button" role="tab" data-tab="'+tab[0]+'" aria-selected="'+(tab[0]===id)+'" tabindex="'+(tab[0]===id?'0':'-1')+'">'+tab[1]+'</button>';}).join('');}
  function render(){var id=active();paintTabs(id);try{root.innerHTML='<section class="grid mr-view" role="tabpanel" aria-labelledby="tab-'+id+'">'+views[id]()+'</section>';}catch(e){root.innerHTML='<div class="mr-empty"><div><strong>This section could not load</strong><span>Your data was not changed.</span><div class="mr-actions"><button class="btn" data-retry>Retry</button></div></div></div>';}search.value='';if(id==='about')loadBuild();}
  function go(id){if(location.hash==='#'+id)render();else location.hash=id;}
  function loadBuild(){fetch('../sw.js').then(function(response){return response.text();}).then(function(text){var match=text.match(/dashboard-v(\d+)/);var status=document.getElementById('buildStatus');if(status)status.textContent=match?'Build '+match[1]:'Current';var cards=root.querySelectorAll('.mr-kpi .value');if(cards[1])cards[1].textContent=match?'Build '+match[1]:'Current';}).catch(function(){var status=document.getElementById('buildStatus');if(status)status.textContent='Unavailable';});}
  function flash(id,message){var el=document.getElementById(id);if(el){el.textContent=message;setTimeout(function(){el.textContent='';},2500);}}
  function saveTargets(){var s=read(settingsKey,{});s.goalCalories=parseInt(document.getElementById('setCalories').value)||null;s.goalProtein=parseInt(document.getElementById('setProtein').value)||null;s.goalSleep=parseFloat(document.getElementById('setSleep').value)||null;s.goalWater=parseInt(document.getElementById('setWater').value)||null;write(settingsKey,s);var nt=read('nt:tdee',{});if(s.goalCalories)nt.calories=s.goalCalories;if(s.goalProtein)nt.protein=s.goalProtein;write('nt:tdee',nt);flash('targetStatus','Saved');}
  function saveContext(){var s=read(settingsKey,{});s.aiContextDays=parseInt(document.getElementById('setContext').value)||14;s.aiIncludeFinance=document.getElementById('setFinance').getAttribute('aria-checked')==='true';s.aiIncludeBloodwork=document.getElementById('setBlood').getAttribute('aria-checked')==='true';write(settingsKey,s);flash('contextStatus','Saved');}
  function downloadJson(out){var link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));link.download='lifeos-export-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(function(){URL.revokeObjectURL(link.href);},0);}
  function exportJson(){if(window.CanonicalRuntime&&CanonicalRuntime.exportSnapshot){CanonicalRuntime.exportSnapshot().then(downloadJson,function(){if(window.UI)UI.toast('The complete export could not be created.');});return;}var out={schema_version:1,exported_at:new Date().toISOString(),canonical_events:[],pending_outbox:[],local_storage:{}};for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);try{out.local_storage[key]=JSON.parse(localStorage.getItem(key));}catch(e){out.local_storage[key]=localStorage.getItem(key);}}downloadJson(out);}
  function loadSystemStatus(){if(!window.CanonicalRuntime||!CanonicalRuntime.systemStatus||systemLoading)return;systemLoading=true;CanonicalRuntime.systemStatus().then(function(state){systemState=state;systemLoading=false;render();},function(){systemLoading=false;});}
  function authSheet(){var close=UI.sheet({title:'Sign in for cross-device sync',body:'<div class="field"><span class="label">Email</span><input class="input" id="syncEmail" type="email" autocomplete="username"></div><div class="field" style="margin-top:var(--s3)"><span class="label">Password</span><input class="input" id="syncPassword" type="password" autocomplete="current-password"></div><div class="mr-note" id="syncAuthError" role="alert" style="margin-top:var(--s3)">Your session is used only for owner-scoped synchronization.</div>',primaryLabel:'Sign in',onSubmit:function(sheet){var err=sheet.querySelector('#syncAuthError');window.LifeOSAuth.login(sheet.querySelector('#syncEmail').value,sheet.querySelector('#syncPassword').value).then(function(result){if(result.error){err.textContent=result.error.message||'Sign-in failed';return;}close();UI.toast('Signed in');setTimeout(function(){location.reload();},200);});return false;}});}
  function toggleSync(){if(!window.CanonicalRuntime||!CanonicalRuntime.setSyncEnabled)return;var enabled=!!(systemState&&systemState.cross_device_sync&&systemState.cross_device_sync.enabled);CanonicalRuntime.setSyncEnabled(!enabled).then(function(result){UI.toast(result.status==='current'?'Cross-device sync is current':String(result.status||'Sync setting saved').replace(/-/g,' '));loadSystemStatus();},function(error){UI.toast(error.message||'Could not change sync setting',{type:'error'});});}
  function syncNow(){if(!window.CanonicalRuntime||!CanonicalRuntime.syncNow)return;CanonicalRuntime.syncNow().then(function(result){UI.toast(String(result.status||'Sync finished').replace(/-/g,' '));loadSystemStatus();},function(error){UI.toast(error.message||'Sync failed',{type:'error'});});}
  function restoreFile(file){if(!file||file.size>10*1024*1024){UI.toast('Choose a Life OS JSON snapshot under 10 MB',{type:'error'});return;}file.text().then(function(text){var snapshot=JSON.parse(text);UI.confirm({title:'Restore this device snapshot?',body:'The current canonical device state will be replaced after validation. A rollback snapshot is kept in memory if the restore fails.',confirmLabel:'Restore snapshot',onConfirm:function(){CanonicalRuntime.restoreSnapshot(snapshot).then(function(result){UI.toast(result.restored_events+' canonical events restored');loadSystemStatus();},function(error){UI.toast(error.message||'Restore failed',{type:'error'});});}});}).catch(function(){UI.toast('The selected JSON file is invalid',{type:'error'});});}
  function clearDevice(){var clear=window.CanonicalRuntime&&CanonicalRuntime.clearDeviceData?CanonicalRuntime.clearDeviceData():Promise.resolve().then(function(){window.LifeOSCompatibilityStore.clear();});clear.then(function(){location.href='today.html';},function(){if(window.UI)UI.toast('Device data could not be cleared.');});}
  tabsRoot.addEventListener('click',function(e){var button=e.target.closest('[data-tab]');if(button)go(button.dataset.tab);});
  tabsRoot.addEventListener('keydown',function(e){var buttons=[].slice.call(tabsRoot.querySelectorAll('[data-tab]'));var index=buttons.indexOf(document.activeElement);if(index<0)return;var next=e.key==='ArrowRight'?index+1:e.key==='ArrowLeft'?index-1:-1;if(next<0||next>=buttons.length)return;e.preventDefault();buttons[next].focus();go(buttons[next].dataset.tab);});
  root.addEventListener('click',function(e){var sw=e.target.closest('.mr-switch');if(sw){sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')!=='true');return;}if(e.target.closest('[data-save-targets]'))saveTargets();if(e.target.closest('[data-save-context]'))saveContext();if(e.target.closest('[data-export]'))exportJson();if(e.target.closest('[data-sync-auth]'))authSheet();if(e.target.closest('[data-sync-toggle]'))toggleSync();if(e.target.closest('[data-sync-now]'))syncNow();if(e.target.closest('[data-retry]'))render();if(e.target.closest('[data-clear]'))UI.confirm({title:'Clear ALL device data?',body:'Canonical events and compatibility storage on this device will be removed. Remote data is not deleted and may return after sync.',confirmLabel:'Clear this device',danger:true,onConfirm:clearDevice});});
  root.addEventListener('change',function(e){if(e.target.matches('[data-restore-file]'))restoreFile(e.target.files&&e.target.files[0]);});
  search.addEventListener('input',function(){var query=search.value.trim().toLowerCase();var rows=root.querySelectorAll('[data-search]');var visible=0;rows.forEach(function(item){var show=!query||item.getAttribute('data-search').indexOf(query)!==-1;item.style.display=show?'':'none';if(show)visible++;});var old=root.querySelector('[data-search-empty]');if(old)old.remove();if(query&&!visible){var empty=document.createElement('div');empty.className='mr-empty';empty.setAttribute('data-search-empty','');empty.innerHTML='<div><strong>No matches in this section</strong><span>Try another word or choose a different tab.</span></div>';root.querySelector('.mr-view').appendChild(empty);}});
  window.addEventListener('hashchange',render);
  document.getElementById('mrDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  render();
  loadSystemStatus();
})();
</script>
</body>
</html>
