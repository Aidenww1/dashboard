        frWire(panel, close, 'barcode', null);
        function lookup(code) {
          err('');
          var btn = panel.querySelector('#bc-go');
          btn.disabled = true; btn.textContent = 'Looking up...';
          fetch('https://world.openfoodfacts.org/api/v0/product/' + encodeURIComponent(code) + '.json')
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.status !== 1 || !data.product) { err('Product not found in database.'); return; }
              var pr = data.product, n = pr.nutriments || {};
              var name = (pr.product_name || pr.product_name_en || 'Unknown product').trim();
              var brand = (pr.brands || '').split(',')[0].trim() || null;
              var serving = parseFloat(pr.serving_quantity) || 0;
              if (!serving && pr.serving_size) { var mm = String(pr.serving_size).match(/(\d+(?:\.\d+)?)/); if (mm) serving = parseFloat(mm[1]); }
              if (!serving) serving = 100;
              var ratio = serving / 100;
              function gN(k) {
                var s = n[k + '_serving'];
                if (s != null && s !== '') return Number(s) || 0;
                return (Number(n[k + '_100g']) || 0) * ratio;
              }
              panel._frBrand = brand;
              frFill(panel, {
                name: brand && brand !== name ? name + ' (' + brand + ')' : name,
                servingSize: serving, calories: gN('energy-kcal'), protein: gN('proteins'),
                carbs: gN('carbohydrates'), fat: gN('fat'), fiber: gN('fiber'),
              });
            })
            .catch(function () { err('Lookup failed. Check connection.'); })
            .then(function () { btn.disabled = false; btn.textContent = 'Look up'; });
        }
        panel.querySelector('#bc-go').addEventListener('click', function () {
          var c = panel.querySelector('#bc-code').value.trim();
          if (!c) { err('Enter a barcode number.'); return; }
          lookup(c);
        });
        panel.querySelector('#bc-code').addEventListener('keydown', function (e) { if (e.key === 'Enter') panel.querySelector('#bc-go').click(); });
        ['bc-cam', 'bc-gal'].forEach(function (id) {
          panel.querySelector('#' + id).addEventListener('change', function () {
            var f = this.files && this.files[0]; if (!f) return;

              else err('Could not read the barcode from that photo - type the number above.');
            });
          });
        });
      }
    });
  }

    /* ---------- Inventory (canonical stack:items + stack:low) ---------- */
    function inventoryView() {
      var h = '<section class="card" style="padding:0">' + subtabsBar('') + '</section>';

      }
      var todayMs = new Date(today() + 'T12:00:00').getTime();
      function flagged(it) {
        if (lowIds.some(function (id) { return String(id) === String(it.id); })) return true;
        return it.stock != null && it.reorderAt != null && Number(it.stock) <= Number(it.reorderAt);
      }
      var lowCount = items.filter(flagged).length;
      var tracked = items.filter(function (it) { return it.stock != null; }).length;
      var expiring = items.filter(function (it) { var ms = it.expiry ? new Date(it.expiry + 'T12:00:00').getTime() : NaN; return !isNaN(ms) && ms >= todayMs && ms - todayMs <= 30 * 86400000; }).length;
      h += '<div class="lg-statgrid c4">'
        + kpiCard(I.box, 'Stock items', String(items.length), tracked + ' with amounts tracked')
        + kpiCard(I.warn, 'Low stock', String(lowCount), lowCount ? '<span style="color:var(--amber)">Needs attention</span>' : '<span style="color:var(--green)">All clear</span>')

        + '</div>';
      var rows = items.slice().sort(function (a, b) { return Number(flagged(b)) - Number(flagged(a)); }).map(function (it) {

          + '<span style="display:flex;align-items:center;gap:5px"><span class="badge ' + (isLow ? 'amber' : (it.stock == null ? 'violet' : 'green')) + '">' + (isLow ? 'Low' : (it.stock == null ? 'Untracked' : 'Good')) + '</span><button class="lg-ic-btn" data-stock-edit="' + esc(it.id) + '" aria-label="Edit inventory for ' + esc(it.name || 'item') + '">' + I.pencil + '</button></span></div>';

    /* ---------- Labs ---------- */
    function labsView() {
      var latest = bloods[bloods.length - 1] || null;
      var outlook = phaseEProjection['labs.outlook'] || {};
      var outlookEvaluation = phaseEProjection['labs.outlook_evaluation'] || {};
      var modelStatus = phaseEProjection['labs.model_status'] || {};
      var addBtnBar = '<div class="lg-sub-actions"><button class="btn btn-primary btn-sm" data-lab>+ Enter lab values</button></div>';
      if (!latest) {
        return '<section class="card" style="padding:0">' + subtabsBar(addBtnBar) + '</section>'
          + '<section class="card"><div class="empty">' + bloodIcon.replace(/width="1.7"/, 'width="1.6" class="empty-ic"') + '<span class="empty-title">No bloodwork logged yet</span><span>Enter your latest panel to track markers, ranges and trends over time.</span><button class="btn btn-primary btn-sm" data-lab style="margin-top:var(--s3)">Enter lab values</button></div></section>';
      }
      function mdef(key) { return LAB_MARKERS.filter(function (m) { return m.key === key; })[0] || null; }
      function panelStats(entry) {
        var total = 0, out = 0;
        Object.keys(entry.markers || {}).forEach(function (k) {
          var m = mdef(k); if (!m) return;
          total++;
          if (markerStatus(m, entry.markers[k]) !== 'ok') out++;
        });
        return { total: total, out: out };
      }
      var stats = panelStats(latest);
      var age = Math.round((Date.now() - new Date(latest.date + 'T12:00:00').getTime()) / 86400000);
      var retest = new Date(new Date(latest.date + 'T12:00:00').getTime() + 90 * 86400000);
      var retestIn = Math.round((retest.getTime() - Date.now()) / 86400000);
      var h = '<section class="card" style="padding:0">' + subtabsBar(addBtnBar) + '</section>';
      h += '<div class="lg-statgrid c4">'
        + kpiCard(calIcon, 'Latest panel date', esc(dateLabel(latest.date)), age + ' day' + (age === 1 ? '' : 's') + ' ago')
        + kpiCard(checkCircle, 'Markers in range', (stats.total - stats.out) + ' / ' + stats.total, stats.total ? '<span style="color:var(--green)">' + Math.round((stats.total - stats.out) / stats.total * 100) + '%</span>' : '')
        + kpiCard(triIcon, 'Watch items', stats.out + '', stats.out ? '<span style="color:var(--amber)">Needs monitoring</span>' : '<span style="color:var(--green)">All clear</span>')
        + kpiCard(calIcon, 'Next retest (~90d)', esc(retest.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })), retestIn >= 0 ? 'In ' + retestIn + ' days' : '<span style="color:var(--amber)">Overdue by ' + Math.abs(retestIn) + ' days</span>')
        + '</div>';
      function finding(name, val, status) {
        var c = status === 'High' || status === 'Low' ? '#ff8a8a' : 'var(--green)';
        return '<div class="lg-kv-row"><span class="k" style="color:' + c + '">' + name + '</span><span class="num">' + val + ' <span style="color:' + c + '">' + status + '</span></span></div>';
      }
      // key findings: out-of-range first, then in-range, top 5
      var keys = Object.keys(latest.markers || {}).filter(mdef);
      keys.sort(function (a, b) {
        var sa = markerStatus(mdef(a), latest.markers[a]) === 'ok' ? 1 : 0;
        var sb = markerStatus(mdef(b), latest.markers[b]) === 'ok' ? 1 : 0;

      var weeks = [];

    /* ---------- Composition estimate (gym.html math, ported verbatim) ---------- */
    function compositionCard() {
      var head = '<div class="lg-card-row"><div class="lg-card-title">Composition estimate</div><span class="t-cap" id="comp-win"></span></div>';
      if (wts.length < 2) return head + '<div class="lg-card-sub" style="margin-top:8px">Log body weight on two or more days (Body tab) and this estimates how much of the change is muscle vs fat, using your strength trend.</div>';
      var WINDOW = 30;
      function parseKey(dk) { var pp = dk.split('-').map(Number); return new Date(pp[0], pp[1] - 1, pp[2]); }
      var sorted = wts.slice().sort(function (a, b) { return String(a.dateKey).localeCompare(String(b.dateKey)); });
      var endEntry = sorted[sorted.length - 1];
      var now = parseKey(endEntry.dateKey);
      var startDate = new Date(now); startDate.setDate(startDate.getDate() - WINDOW);
      var startEntry = null;
      for (var i = 0; i < sorted.length; i++) { if (parseKey(sorted[i].dateKey) >= startDate) { startEntry = sorted[i]; break; } }
      if (!startEntry || startEntry === endEntry) return head + '<div class="lg-card-sub" style="margin-top:8px">Need two weigh-ins inside the last ' + WINDOW + ' days.</div>';
      var weightDelta = parseFloat(endEntry.weight) - parseFloat(startEntry.weight);
      var actualDays = Math.max(1, Math.round((parseKey(endEntry.dateKey) - parseKey(startEntry.dateKey)) / 86400000));
      var weeks = actualDays / 7;
      function est1RM(w2, r2) { return r2 < 2 ? w2 : w2 * (1 + r2 / 30); }
      var strengthRatios = [], workoutDaysSet = {};
      exs.forEach(function (ex) {
        var arr = (logs[ex.id] || []).slice();
        if (arr.length < 2 || ex.bw) {
          arr.forEach(function (l) { if (new Date(l.date) >= startDate) workoutDaysSet[String(l.date).slice(0, 10)] = 1; });
          return;
        }
        var inWin = arr.filter(function (l) { return new Date(l.date) >= startDate; });
        var before = arr.filter(function (l) { return new Date(l.date) < startDate; });
        inWin.forEach(function (l) { workoutDaysSet[String(l.date).slice(0, 10)] = 1; });
        if (!inWin.length || !before.length) return;
        function avg(a2) { return a2.reduce(function (s2, l) { return s2 + est1RM(Number(l.weight) || 0, Number(l.reps) || 0); }, 0) / a2.length; }
        var a = avg(before), bb = avg(inWin);
        if (a > 0) strengthRatios.push(bb / a);
      });
      var strengthDelta = strengthRatios.length ? (strengthRatios.reduce(function (s2, r2) { return s2 + r2; }, 0) / strengthRatios.length) - 1 : 0;
      var sessionsPerWeek = (Object.keys(workoutDaysSet).length / actualDays) * 7;
      var frequencyFactor = Math.max(0.4, Math.min(1.2, sessionsPerWeek / 4));
      /* yearsTraining=1 - same seed value gym.html CONFIG ships with */
      var maxMusclePerWeek = 0.45 * (units === 'lb' ? 2.20462 : 1);
      var strengthBoost = Math.max(0.5, Math.min(1.5, 1 + strengthDelta * 4));
      var estMuscle = maxMusclePerWeek * weeks * strengthBoost * frequencyFactor;
      var estFat, cls, headline;
      if (weightDelta > 0) {
        estMuscle = Math.min(estMuscle, weightDelta);
        estFat = Math.max(0, weightDelta - estMuscle);
        var musclePct0 = estMuscle / weightDelta;
        if (musclePct0 >= 0.6 && strengthDelta > 0) { cls = 'var(--green)'; headline = '+' + weightDelta.toFixed(1) + ' ' + units + ' - mostly muscle, strength up.'; }
        else if (musclePct0 >= 0.35) { cls = 'var(--amber)'; headline = '+' + weightDelta.toFixed(1) + ' ' + units + ' - mixed. Tighten kcal or push lifts harder.'; }
        else { cls = '#ff5a5a'; headline = '+' + weightDelta.toFixed(1) + ' ' + units + ' - mostly fat. Strength flat. Cut kcal.'; }
      } else {
        var wDown = Math.abs(weightDelta);
        if (strengthDelta >= 0) {
          estMuscle = Math.min(maxMusclePerWeek * weeks * 0.3, 0.5);
          estFat = wDown + estMuscle;
          cls = 'var(--green)'; headline = '-' + wDown.toFixed(1) + ' ' + units + ' - strength holding, fat dropping.';
        } else {
          var lossPct = Math.min(0.4, Math.abs(strengthDelta) * 2);
          estMuscle = -wDown * lossPct;
          estFat = -(wDown + estMuscle);
          cls = 'var(--amber)'; headline = '-' + wDown.toFixed(1) + ' ' + units + ' - strength slipping. You may be losing muscle.';
        }
      }
      var totalAbs = Math.abs(estMuscle) + Math.abs(estFat) || 1;
      var mPct = Math.abs(estMuscle) / totalAbs * 100, fPct = Math.abs(estFat) / totalAbs * 100;
      var sd = strengthDelta * 100;
      var foot = '~' + (estMuscle >= 0 ? '+' : '') + estMuscle.toFixed(1) + ' ' + units + ' muscle &middot; ~' + (estFat >= 0 ? '+' : '') + estFat.toFixed(1) + ' ' + units + ' fat &middot; strength ' + (sd >= 0 ? '+' : '') + sd.toFixed(1) + '% &middot; ' + sessionsPerWeek.toFixed(1) + ' sessions/wk' + (strengthRatios.length ? '' : ' (no lift data)');
      return '<div class="lg-card-row"><div class="lg-card-title">Composition estimate</div><span class="t-cap">last ' + actualDays + 'd</span></div>'
        + '<div style="font-weight:600;margin-top:6px;color:' + cls + '">' + esc(headline) + '</div>'
        + '<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;background:rgba(255,255,255,.06)">'
        + '<div style="width:' + mPct.toFixed(1) + '%;background:var(--green)"></div>'
        + '<div style="width:' + fPct.toFixed(1) + '%;background:#ff9f43"></div></div>'
        + '<div class="inline" style="gap:14px;margin-top:6px;font-size:11px;color:var(--text-3)"><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px"></i>Muscle</span><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff9f43;margin-right:4px"></i>Fat</span></div>'
        + '<div class="lg-card-sub" style="margin-top:8px">' + foot + '</div>'
        + '<div class="lg-card-sub" style="margin-top:4px">Estimated from weight change &times; strength trend &times; training frequency.</div>';
    }

    /* ---------- Body goals (gym.html renderGoals port) ---------- */
    function goalsCard() {

            }).join('')

      }

      if (!anyGoal) return h2 + '<div class="lg-card-sub" style="margin-top:8px">Set weight, body-fat and measurement targets. The lagging muscle gets flagged and its exercises get prioritised in your session.</div>';

      var tiles = MUSCLE_KEYS.filter(function (k) { return goals['m_' + k]; }).map(function (k) {
        var target = goals['m_' + k];

        return '<div style="border:1px solid ' + (isLag ? 'rgba(255,159,67,.4)' : 'var(--border)') + ';border-radius:8px;padding:10px">'
          + '<div class="lg-lab-head"' + (isLag ? ' style="color:#ff9f43"' : '') + '>' + MUSCLE_LABELS[k] + (isLag ? ' &#9733;' : '') + '</div>'
          + '<div style="font-size:16px;font-weight:600;margin-top:2px">' + (curr != null ? curr : '&mdash;') + ' <small class="t-cap">/ ' + target + ' cm</small></div>'
          + (pg !== null ? pbar(pg, isLag ? '#ff9f43' : 'var(--accent)') : '')

          + '</div>';

      var monthVol = monthDays.reduce(function (a, dk) { return a + volFor(dk); }, 0);

            + '<div class="t-cap">' + it.sets.length + ' sets &middot; ' + fmtVol(it.vol) + ' ' + units + '</div>';

    var tviews = { overview: overviewView, cardio: cardioView, progress: progressView, history: historyView };

    p.querySelectorAll('[data-del-ex]').forEach(function (b) {

      var cHit = 0, cNear = 0, cBelow = 0, cNone = 0;
      for (var di = 0; di < 90; di++) {

        var rows = [];
        if (w) rows.push(entryRow({ id: 'w', title: 'Weight', value: w.weight + ' kg' }));
        if (sl) rows.push(entryRow({ id: 's', title: 'Sleep', value: fmtDur(sl.duration) }));
        if (rows.length) {
          html += '<div class="card"><div class="lg-list-head">Today</div><div class="stack" style="gap:0" data-entries>' + rows.join('') + '</div></div>';
        } else {
          html += '<div class="card">' + emptyState(ICONS.body, 'Nothing logged today', 'Log weight or last night\'s sleep.', 'Log body') + '</div>';
        }
        html += '<div class="card"><div class="lg-list-head">More</div><div class="stack" style="gap:0">'
          + linkRow('Measurements & progress photos', '../body.html')
          + linkRow('Health metrics (HRV, RHR, steps)', '../health.html')
          + linkRow('Bloodwork & meds', '../health.html#labs')
          + linkRow('Wearable', 'watch.html')
          + '</div></div>';
        p.innerHTML = html;
        wireAdd(p, function () {
          choiceSheet('Log body', [
            { label: 'Weight', onTap: function () { weightSheet(); } },
            { label: 'Sleep', onTap: function () { sleepSheet(); } },
          ]);
        });
        wireEntries(p, 'body');
      },
      add: function (prefill) {
        if (prefill && /^[\d.]+$/.test(prefill)) weightSheet({ weight: parseFloat(prefill) });
        else measurementSheet();
      },
      del: function (id) {
        var t = today();
        if (id === 'w') {
          var arr = lsget('po_coach_weights', []), i = arr.findIndex(function (e) { return e.dateKey === t; });
          if (i < 0) return null; var it = arr[i]; arr.splice(i, 1); lsset('po_coach_weights', arr); fire();
          return function () { var a = lsget('po_coach_weights', []); a.push(it); a.sort(function (x, y) { return String(x.dateKey).localeCompare(String(y.dateKey)); }); lsset('po_coach_weights', a); fire(); };
        }
        var sarr = lsget('sleep:logs', []), si = sarr.findIndex(function (e) { return e.date === t; });
        if (si < 0) return null; var sit = sarr[si]; sarr.splice(si, 1); lsset('sleep:logs', sarr); fire();
        return function () { var a = lsget('sleep:logs', []); a.push(sit); lsset('sleep:logs', a); fire(); };
      },
      edit: function (id) {
        var t = today();
        if (id === 'w') weightSheet((lsget('po_coach_weights', []) || []).filter(function (e) { return e.dateKey === t; })[0]);
        else sleepSheet((lsget('sleep:logs', []) || []).filter(function (e) { return e.date === t; })[0]);
      },
    },

    training: {
      label: 'Training',
      render: function (p) { renderTrainingPanel(p); },
      add: function () { trainView = 'session'; paint('training'); },
    },

    skin: {
      label: 'Skin',
      render: function (p) { renderSkinPanel(p); },
      add: function () { skinSheet(); },
      del: function (id) {
        var arr = lsget('skin:logs', []), i = arr.findIndex(function (l) { return String(l.id != null ? l.id : l.date) === String(id); });
        var projected = phaseGValue('skin.progress'), projectedRow = projected && (projected.checkins || []).find(function (row) { return String(row.id) === String(id); });
        if (i < 0 && !projectedRow) return null;
        var it = i >= 0 ? arr[i] : Object.assign({ id: projectedRow.id, date: projectedRow.date, canonical_event_id: projectedRow.canonical_event_id }, projectedRow.values || {});
        if (i >= 0) arr.splice(i, 1); lsset('skin:logs', arr); fire();
        var api = canonicalPhaseG();
        if (it.canonical_event_id && api && api.deleteCanonical) api.deleteCanonical(it.canonical_event_id, 'user-deleted-skin-checkin').then(function () { phaseGState = null; refreshPhaseGProjection(true); }).catch(function (error) { phaseEError(error, 'Skin check-in could not be deleted'); });
        return function () {
          var restore = api && api.restoreSkinCheckin ? api.restoreSkinCheckin(it) : Promise.resolve({});
          restore.then(function (result) { var a = lsget('skin:logs', []), next = Object.assign({}, it, { id: result.event && result.event.payload && result.event.payload.checkin_id || it.id, canonical_event_id: result.canonical_event_id || null }); a.push(next); lsset('skin:logs', a); fire(); phaseGState = null; refreshPhaseGProjection(true); }).catch(function (error) { phaseEError(error, 'Skin check-in could not be restored'); });
        };
      },
      edit: function (id) {
        var l = (lsget('skin:logs', []) || []).find(function (x) { return String(x.id != null ? x.id : x.date) === String(id); });
        if (!l) { var projected = phaseGValue('skin.progress'), row = projected && (projected.checkins || []).find(function (item) { return String(item.id) === String(id); }); if (row) l = Object.assign({ id: row.id, date: row.date, canonical_event_id: row.canonical_event_id, water: row.values && row.values.water_l, sleep: row.values && row.values.sleep_hours }, row.values || {}); }
        if (l) skinSheet(l);
      },
    },

    water: {
      label: 'Water',
      render: function (p) { renderWaterPanel(p); },
      add: function (prefill) {
        if (prefill && /^-?\d+$/.test(prefill)) {
          var t = today(), w = lsget('po_water_v1', {}) || {}, n = parseInt(prefill, 10), amount = Math.max(0, (n < 50 ? n * 250 : n));
          var api = window.LifeOS && window.LifeOS.canonical;
          var saved = api && api.logHydration ? api.logHydration({ amount_ml: amount, original_amount: amount, original_unit: 'ml', date: t, occurred_at: new Date().toISOString(), beverage_type: 'water', source: 'manual' }) : Promise.resolve();
          saved.then(function () {
            w.logs = (w.logs && typeof w.logs === 'object' && !Array.isArray(w.logs)) ? w.logs : {};
            var unit = w.unit === 'glass' ? Number(w.glassMl) || 250 : w.unit === 'oz' ? 30 : w.unit === 'ml' ? 1 : Number(w.bottleMl) || 500;
            w.logs[t] = (Number(w.logs[t]) || 0) + amount / unit;
            lsset('po_water_v1', w); waterPhaseFState = null; fire(); paint('water');
          }).catch(function () { UI.toast('Water entry could not be saved'); });
        }
      },
    },

    supps: {
      label: 'Supplements',
      render: function (p) { renderSuppsPanel(p); },
      add: function () {
        var q = (document.getElementById('qlog').value || '').trim();
        if (!q) { suppItemSheet({}); return; }
        var r = L.log({ type: 'supplement', name: q }); UI.toast(r.message || 'Done');
        if (r.ok) { document.getElementById('qlog').value = ''; paint('supps'); }
      },
    },

    mind: {
      label: 'Mind',
      render: function (p) {
        var t = today();
        var m = (lsget('mind:mood:v1', []) || []).filter(function (e) { return e.date === t; })[0];
        var html = '';
        html += addBtn('Log mood');
        if (m) {
          html += '<div class="card"><div class="lg-list-head">Today</div><div class="stack" style="gap:0" data-entries>'
            + entryRow({ id: 'm', title: 'Mood', value: m.mood + '/5', sub: m.note || '' }) + '</div></div>';
        } else {
          html += '<div class="card">' + emptyState(ICONS.mind, 'No mood logged', 'How are you feeling today?', 'Log mood') + '</div>';
        }
        html += '<div class="card"><div class="lg-list-head">More</div><div class="stack" style="gap:0">'
          + linkRow('Journal, gratitude, meditate', 'mood.html') + '</div></div>';
        p.innerHTML = html;
        wireAdd(p, function () { moodSheet(); });
        wireEntries(p, 'mind');
      },
      add: function (prefill) { moodSheet({ note: prefill || '' }); },
      del: function () {
        var t = today(), arr = lsget('mind:mood:v1', []), i = arr.findIndex(function (e) { return e.date === t; });
        if (i < 0) return null; var it = arr[i]; arr.splice(i, 1); lsset('mind:mood:v1', arr); fire();
        return function () { var a = lsget('mind:mood:v1', []); a.push(it); lsset('mind:mood:v1', a); fire(); };
      },
      edit: function () { moodSheet((lsget('mind:mood:v1', []) || []).filter(function (e) { return e.date === today(); })[0]); },
    },

    habits: {
      label: 'Habits',
      render: function (p) {
        var defs = lsget('habits:v1', []) || [], t = today(), logs = lsget('habits:logs:v1', {}) || {}, doneToday = logs[t] || [];
        if (!defs.length) {
          p.innerHTML = '<div class="card">' + emptyState(ICONS.habits, 'No habits yet', 'Create habits to build streaks.', 'Manage habits') + '</div>';
          wireAdd(p, function () { location.href = '../habits.html'; });
          return;
        }
        var rows = defs.map(function (h) {
          var id = h.id != null ? h.id : (h.name || h.title);
          var on = doneToday.some(function (x) { return String(x) === String(id); });
          return '<div class="lg-switch-row" data-h="' + esc(id) + '"><div class="row-main"><div class="row-title">' + esc(h.name || h.title || 'Habit') + '</div></div>'
            + '<div class="toggle" role="switch" aria-checked="' + on + '" tabindex="0"></div></div>';
        }).join('');
        var done = doneToday.length;
        var html = '<div class="card"><div class="card-head"><span class="card-title">Today</span><span class="badge violet">' + done + ' / ' + defs.length + '</span></div>'
          + '<div class="stack" style="gap:0">' + rows + '</div>'
          + '<div class="lg-foot"><a href="../habits.html">Manage habits &amp; streaks</a></div></div>';
        p.innerHTML = html;
        p.querySelectorAll('[data-h]').forEach(function (row) {
          var sw = row.querySelector('.toggle');
          function flip() {
            var id = row.getAttribute('data-h');
            var lg = lsget('habits:logs:v1', {}) || {}, arr = (lg[t] || []).filter(function (x) { return String(x) !== String(id); });
            var nowOn = sw.getAttribute('aria-checked') !== 'true';
            if (nowOn) arr.push(id);
            lg[t] = arr; lsset('habits:logs:v1', lg); fire();
            sw.setAttribute('aria-checked', nowOn ? 'true' : 'false');
            paint('habits');
          }
          sw.addEventListener('click', flip);
          sw.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
        });
      },
      add: function () { location.href = '../habits.html'; },
    },
  };

  /* ============================================================
     Wiring helpers shared by panels.
     ============================================================ */
  function wireAdd(p, fn) {
    p.querySelectorAll('[data-add]').forEach(function (b) { b.addEventListener('click', fn); });
    var eb = p.querySelector('.lg-empty-add'); if (eb) eb.addEventListener('click', fn);
  }
  function wireEntries(p, segId) {
    var groups = p.querySelectorAll('[data-entries]'); if (!groups.length) return;
    groups.forEach(function (g) {
      g.addEventListener('click', function (e) {
        var mealActions = e.target.closest('[data-meal-actions]');
        var editBtn = e.target.closest('[data-edit]');
        var delBtn = e.target.closest('[data-del]');
        var seg = C[segId];
        if (mealActions) { mealActionsSheet(mealActions.getAttribute('data-meal-actions')); return; }
        if (editBtn) { var eid = editBtn.getAttribute('data-edit'); if (seg.edit) seg.edit(eid); return; }
        if (delBtn) {
          var id = delBtn.getAttribute('data-del');
          UI.confirm({
            title: 'Delete this entry?',
            body: 'The entry will be removed. You can undo immediately after deletion.',
            confirmLabel: 'Delete entry',
            danger: true,
            onConfirm: function () {
              Promise.resolve(seg.del ? seg.del(id) : null).then(function (undo) {
                paint(segId);
                UI.toast('Deleted', undo ? { action: 'Undo', onAction: function () { Promise.resolve(undo()).then(function () { paint(segId); }); }, duration: 5000 } : {});
              }).catch(function (error) { UI.toast(error && error.message || 'Could not delete entry', { type: 'error' }); });
            },
          });
        }
      });
    });
  }

  /* ============================================================
     Segment control + panel rendering.
     ============================================================ */
  var ORDER = ['food', 'body', 'training', 'skin', 'water', 'supps'];
  var seg = document.getElementById('seg');
  var panels = document.getElementById('panels');
  var hashSeg = String(location.hash || '').replace(/^#/, '');
  var active = ORDER.indexOf(hashSeg) >= 0 ? hashSeg : ORDER[0];

  function panelOf(id) { return panels.querySelector('[data-panel="' + id + '"]'); }
  function paint(id) {
    var p = panelOf(id); if (!p) return;
    // localStorage reads are synchronous -> render directly, no skeleton flash.
    try { C[id].render(p); }
    catch (e) {
      p.innerHTML = '<div class="card">' + sectionErr(e && e.message) + '</div>';
      var r = p.querySelector('.lg-retry'); if (r) r.addEventListener('click', function () { paint(id); });
    }
  }

  ORDER.forEach(function (id, i) {
    var b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', id === active ? 'true' : 'false');
    b.setAttribute('tabindex', id === active ? '0' : '-1');
    b.dataset.value = id;
    b.innerHTML = (TAB_ICONS[id] || '') + '<span>' + esc(C[id].label) + '</span>';
    b.id = 'seg-' + id;
    seg.appendChild(b);
    var pn = document.createElement('section');
    pn.className = 'lg-panel'; pn.setAttribute('role', 'tabpanel');
    pn.dataset.panel = id; pn.setAttribute('aria-labelledby', 'seg-' + id);
    if (id !== active) pn.hidden = true;
    panels.appendChild(pn);
  });

  function select(val) {
    active = val;
    seg.querySelectorAll('[role="tab"]').forEach(function (t) {
      var on = t.dataset.value === val;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.setAttribute('tabindex', on ? '0' : '-1');
    });
    panels.querySelectorAll('.lg-panel').forEach(function (p) { p.hidden = p.dataset.panel !== val; });
    if (location.hash.replace(/^#/, '') !== val) {
      try { history.replaceState(null, '', '#' + val); } catch (_) {}
    }
    paint(val);
  }
  // click + arrow-key nav on the shared segmented control
  seg.querySelectorAll('[role="tab"]').forEach(function (tab, idx) {
    var tabs = seg.querySelectorAll('[role="tab"]');
    tab.addEventListener('click', function () { select(tab.dataset.value); });
    tab.addEventListener('keydown', function (e) {
      var next = null;
      if (e.key === 'ArrowRight') next = tabs[(idx + 1) % tabs.length];
      if (e.key === 'ArrowLeft') next = tabs[(idx - 1 + tabs.length) % tabs.length];
      if (e.key === 'Home') next = tabs[0];
      if (e.key === 'End') next = tabs[tabs.length - 1];
      if (!next) return;
      e.preventDefault();
      select(next.dataset.value);
      next.focus();
    });
  });

  /* quick-log field: route into the active segment's add() */
  var qlog = document.getElementById('qlog');
  var initialQuery = '';
  try { initialQuery = new URLSearchParams(location.search).get('q') || ''; } catch (_) {}
  if (initialQuery) qlog.value = initialQuery;
  var dateEl = document.getElementById('date');
  if (dateEl) {
    try {
      dateEl.textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());
    } catch (_) {
      dateEl.textContent = today();
    }
  }
  qlog.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var val = qlog.value.trim();
    if (!val) { if (C[active] && C[active].add) C[active].add(''); return; }
    if (C[active] && C[active].add) { C[active].add(val); qlog.value = ''; }
  });

  /* keep the visible segment fresh when operator/other tabs write */
  window.addEventListener('lifeos:logged', function (e) {
    if (e && e.detail && e.detail.src === 'log') return; // own writes already repaint
    paint(active);
  });

  function startWithQuery() {
    select(active);
    refreshFoodProjection(true);
    refreshPhaseEProjection(true);
    refreshPhaseGProjection(true);
    var canonical = canonicalFood();
    if (canonical && canonical.subscribeNutrition) {
      canonical.subscribeNutrition(function (update) {
        var daily = (update.projections || []).find(function (projection) { return projection.id === 'nutrition.daily'; });
        if (daily) { foodProjection = daily.value; foodProjectionError = null; if (active === 'food') paint('food'); }
      }, ntKey());
    }
    if (canonical && canonical.subscribePhaseE) {
      canonical.subscribePhaseE(function () { refreshPhaseEProjection(true); }, today());
    }
    if (canonical && canonical.subscribePhaseG) {
      canonical.subscribePhaseG(function () { refreshPhaseGProjection(true); }, today());
    }
    if (initialQuery && C[active] && C[active].add) {
      setTimeout(function () { C[active].add(initialQuery); }, 0);
    }
  }
  if (window.LifeOS) startWithQuery();
  else window.addEventListener('lifeos:ready', startWithQuery, { once: true });
  window.addEventListener('hashchange', function () {
    var next = String(location.hash || '').replace(/^#/, '');
    if (ORDER.indexOf(next) >= 0 && next !== active) select(next);
  });
  window.addEventListener('storage', function (event) {
    if (!event || /^nt:/.test(event.key || '')) refreshFoodProjection(active === 'food');
    if (!event || /^(sleep:|po_coach_|gym:|health:body|body:|blood:|wearable:|health:metrics)/.test(event.key || '')) refreshPhaseEProjection(active === 'body' || active === 'training');
    if (!event || /^(skin:|stack:|supps:|blood:)/.test(event.key || '')) refreshPhaseGProjection(active === 'skin' || active === 'supps');
  });
})();
</script>
</body>
</html>
