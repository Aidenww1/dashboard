<script>
/* ============================================================
   Phase 3 — Log: the universal capture surface.
   Each segment writes the SAME localStorage stores the module pages
   and Today read (via LifeOS.log + direct store edits), so the
   operator, Today and the module pages never disagree.
   Quick capture + today's entries with edit/delete live here; deep
   editing (food DB, workout sets, skin routine) stays in the module
   page, linked from each segment.
   Visual language: shared component classes only (.card/.row/.btn/
   .toggle/.field/.input/.segmented/.sheet/.empty/.section-error).

(function () {
  'use strict';

  function ntKey() { var d = new Date(); if (d.getHours() < 6) d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fmtDur(min) { return Math.floor(min / 60) + 'h ' + (min % 60) + 'm'; }
  function byDateDesc(a, b) { return String(b.date).localeCompare(String(a.date)); }

  /* ============================================================
     Shared sheet (production): uses shared .sheet/.backdrop classes +
     tokens, with page-local open/close + focus management. Mirrors the
     behavior of ui.js overlay(): Escape closes, backdrop closes, focus
     traps and restores to a SAFE target (active segment tab, never a
     node inside a panel that gets re-rendered after save).
     ============================================================ */
  var FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';
  function openSheet(opts) {
    opts = opts || {};

      + '<div class="t-h2" style="margin-bottom:var(--s4)">' + esc(opts.title || '') + '</div>'
      + (opts.body || '');
    var backdrop = document.createElement('div');
    backdrop.className = 'backdrop';
    document.body.appendChild(backdrop);
    document.body.appendChild(panel);
    var closed = false;
    function close() {
      if (closed) return; closed = true;
      panel.classList.remove('open'); backdrop.classList.remove('open');
      document.removeEventListener('keydown', onKey);
      setTimeout(function () { panel.remove(); backdrop.remove(); }, 240);
      if (safeFocus && safeFocus.focus) { try { safeFocus.focus({ preventScroll: true }); } catch (_) {} }
      if (typeof opts.onClose === 'function') { try { opts.onClose(); } catch (_) {} }
    }

      if (e.key !== 'Tab') return;

      if (!f.length) return;

    document.addEventListener('keydown', onKey);
    requestAnimationFrame(function () {
      backdrop.classList.add('open'); panel.classList.add('open');
      var f = panel.querySelector(FOCUSABLE); if (f) { try { f.focus(); } catch (_) {} }
    });
    if (typeof opts.onMount === 'function') { try { opts.onMount(panel, close); } catch (e) {} }
    return close;
  }

  /* choice sheet (used by Body: pick Weight vs Sleep) */
  function choiceSheet(title, options) {
    var body = '<div class="lg-choice">' + options.map(function (o, i) {
      return '<button class="btn btn-secondary btn-block" data-i="' + i + '" style="min-height:48px">' + esc(o.label) + '</button>';
    }).join('') + '</div>';
    openSheet({ title: title, body: body, onMount: function (panel, close) {
      options.forEach(function (o, i) {
        var b = panel.querySelector('[data-i="' + i + '"]');
        if (b) b.addEventListener('click', function () { close(); if (o.onTap) o.onTap(); });
      });
    } });
  }

  /* ============================================================
     Markup helpers (shared classes only).
     ============================================================ */
  function summaryCard(rowsHtml) {
    return '<div class="card"><div class="stack" style="gap:var(--s2)">' + rowsHtml + '</div></div>';
  }
  function metricLine(label, value) {
    return '<div class="between"><span class="t-cap">' + esc(label) + '</span><span class="num" style="font-weight:600">' + esc(value) + '</span></div>';

        + '<button class="lg-ic-btn" data-del="' + esc(e.id) + '" aria-label="Delete entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6"/></svg></button>';

  function linkRow(label, href, sub) {

  }

      + (btnLabel ? '<button class="btn btn-secondary btn-sm lg-empty-add" style="margin-top:var(--s3)">' + esc(btnLabel) + '</button>' : '') + '</div>';
  }
  function sectionErr(msg) {
    return '<div class="section-error"><svg class="se-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>Couldn\'t load this segment.</span><button class="btn btn-secondary btn-sm lg-retry">Retry</button></div>';
  }
  function addBtn(label) { return '<button class="btn btn-primary btn-block lg-add" data-add>+ ' + esc(label) + '</button>'; }

  /* ============================================================
     Sheets (forms). Match legacy field sets + validation.
     ============================================================ */
  function mealSheet(pre) {
    pre = pre || {};
    var v = function (x) { return x != null && x !== '' ? x : ''; };
    var body = '<div class="field"><span class="label">Meal</span><input class="input" id="m-name" type="text" placeholder="e.g. Chicken bowl" value="' + esc(pre.name || '') + '"></div>'
      + '<div class="field" style="margin-top:var(--s3)"><span class="label">Calories</span><input class="input num" id="m-cal" type="number" inputmode="numeric" placeholder="0" value="' + v(pre.calories) + '"></div>'
      + '<div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:var(--s3);margin-top:var(--s3)">'
      + '<div class="field"><span class="label">Protein (g)</span><input class="input num" id="m-pro" type="number" inputmode="numeric" placeholder="0" value="' + v(pre.protein) + '"></div>'
      + '<div class="field"><span class="label">Carbs (g)</span><input class="input num" id="m-carb" type="number" inputmode="numeric" placeholder="0" value="' + v(pre.carbs) + '"></div>'
      + '<div class="field"><span class="label">Fat (g)</span><input class="input num" id="m-fat" type="number" inputmode="numeric" placeholder="0" value="' + v(pre.fat) + '"></div>'
      + '</div>'
      + '<button class="btn btn-primary btn-block lg-add" id="m-save" style="margin-top:var(--s4)">' + (pre.id ? 'Save changes' : 'Log meal') + '</button>';
    openSheet({

      onMount: function (panel, close) {
        panel.querySelector('#m-save').addEventListener('click', function () {

  /* ============================================================

    return (x.servingSize || 100) + 'g &middot; ' + Math.round(x.calories || 0) + ' kcal &middot; ' + n1(x.protein) + 'P &middot; ' + n1(x.carbs) + 'C &middot; ' + n1(x.fat) + 'F';

  /* ---- image -> base64 (max 512px, jpeg) ---- */
  function resizeImg(file, maxPx) {
    return new Promise(function (resolve) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var s = Math.min(1, maxPx / Math.max(img.width, img.height));
        var w = Math.round(img.width * s), h = Math.round(img.height * s);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function (blob) {
          var r = new FileReader();
          r.onloadend = function () { resolve({ b64: String(r.result).split(',')[1], mime: blob.type }); };
          r.readAsDataURL(blob);
        }, 'image/jpeg', 0.82);
      };
      img.src = url;
    });
  }

  /* ---- AI result cache (same key as nutrition.html; 7-day TTL) ---- */
  var PHOTO_CACHE_KEY = 'nt:photoCache:v1';
  function photoHash(body) {
    var src = (body.image || '') + '|' + (body.description || '') + '|' + (body.weight || '') + '|' + (body.restaurant ? 'r' : '');
    var h = 5381;
    for (var i = 0; i < src.length; i++) h = ((h << 5) + h + src.charCodeAt(i)) >>> 0;
    return 'p' + h.toString(36) + '_' + src.length;
  }
  function photoCacheGet(key) {
    var c = lsget(PHOTO_CACHE_KEY, {}) || {};
    var e = c[key];
    return (e && e.exp > Date.now()) ? e.items : null;
  }
  function photoCacheSet(key, items) {
    var c = lsget(PHOTO_CACHE_KEY, {}) || {}, now = Date.now();
    Object.keys(c).forEach(function (k) { if (c[k].exp < now) delete c[k]; });
    c[key] = { exp: now + 7 * 86400000, items: items };
    lsset(PHOTO_CACHE_KEY, c);
  }

  function analyzeFood(panel, req, err, close, isRest) {
    var btn = panel.querySelector('#ph-go');
    err(''); btn.disabled = true; btn.textContent = 'Analyzing…';
    function done() { btn.disabled = false; btn.textContent = 'Identify'; }
    function show(items) {
      if (items.length === 1) { panel.querySelector('#ph-multi').hidden = true; frFill(panel, items[0]); }
      else showMultiResult(panel, items, close, isRest);
    }
    var key = photoHash(req), cached = photoCacheGet(key);
    if (cached) { done(); show(cached); return; }
    fetch('/api/nutrition-ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req) })
      .then(function (res) { return res.json().then(function (data) { return { status: res.status, ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (r.status === 429) { err('Rate limited — wait ' + Math.round(r.data.retryAfter || 60) + 's and try again.'); return; }
        if (!r.ok) { err(r.data.error || 'AI error'); return; }
        var items = r.data.items || [r.data];
        photoCacheSet(key, items);
        show(items);
      })
      .catch(function () { err('Network error. Try again.'); })
      .then(done);
  }

  function decodeBarcode(file) {
    if (!('BarcodeDetector' in window)) return Promise.resolve(null);
    return new Promise(function (resolve) {
      try {
        var det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39'] });
        var img = new Image(), url = URL.createObjectURL(file);
        img.onload = function () {
          URL.revokeObjectURL(url);
          det.detect(img).then(function (r) { resolve(r.length ? r[0].rawValue : null); }, function () { resolve(null); });
        };
        img.onerror = function () { resolve(null); };
        img.src = url;
      } catch (e) { resolve(null); }
    });
  }
  function barcodeSheet() {
    var body = '<div class="inline" style="gap:var(--s2)">'
      + '<label class="btn btn-secondary" style="flex:1;cursor:pointer">Scan photo<input type="file" accept="image/*" capture="environment" id="bc-cam" style="display:none"></label>'
      + '<label class="btn btn-secondary" style="flex:1;cursor:pointer">Gallery<input type="file" accept="image/*" id="bc-gal" style="display:none"></label>'
      + '</div>'
      + '<div class="grid" style="grid-template-columns:1fr auto;gap:var(--s3);margin-top:var(--s3);align-items:end">'
      + '<div class="field"><span class="label">Barcode number</span><input class="input num" id="bc-code" type="text" inputmode="numeric" placeholder="e.g. 8712345678901"></div>'
      + '<button class="btn btn-primary" id="bc-go" style="min-width:110px">Look up</button>'
      + '</div>'
      + '<div id="bc-err" style="display:none;color:var(--amber);font-size:13px;margin-top:var(--s2)"></div>'
      + foodResultHTML();
    openSheet({
      title: 'Barcode scanner', body: body,
      onMount: function (panel, close) {
        function err(m) { var el = panel.querySelector('#bc-err'); el.textContent = m || ''; el.style.display = m ? 'block' : 'none'; }
        frWire(panel, close, 'barcode', null);
        function lookup(code) {
          err('');
          var btn = panel.querySelector('#bc-go');
          btn.disabled = true; btn.textContent = 'Looking up…';
          fetch('https://world.openfoodfacts.org/api/v0/product/' + encodeURIComponent(code) + '.json')
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.status !== 1 || !data.product) { err('Product not found in database.'); return; }
              var pr = data.product, n = pr.nutriments || {};
              var name = (pr.product_name || pr.product_name_en || 'Unknown product').trim();
              var brand = (pr.brands || '').split(',')[0].trim() || null;
              var serving = parseFloat(pr.serving_quantity) || 0;
              if (!serving && pr.serving_size) { var mm = String(pr.serving_size).match(/(\d+(?:\.\d+)?)/); if (mm) serving = parseFloat(mm[1]); }
              if (!serving) serving = 100;
              var ratio = serving / 100;
              function gN(k) {
                var s = n[k + '_serving'];
                if (s != null && s !== '') return Number(s) || 0;
                return (Number(n[k + '_100g']) || 0) * ratio;
              }
              panel._frBrand = brand;
              frFill(panel, {
                name: brand && brand !== name ? name + ' (' + brand + ')' : name,
                servingSize: serving, calories: gN('energy-kcal'), protein: gN('proteins'),
                carbs: gN('carbohydrates'), fat: gN('fat'), fiber: gN('fiber'),
              });
            })
            .catch(function () { err('Lookup failed. Check connection.'); })
            .then(function () { btn.disabled = false; btn.textContent = 'Look up'; });
        }
        panel.querySelector('#bc-go').addEventListener('click', function () {
          var c = panel.querySelector('#bc-code').value.trim();
          if (!c) { err('Enter a barcode number.'); return; }
          lookup(c);
        });
        panel.querySelector('#bc-code').addEventListener('keydown', function (e) { if (e.key === 'Enter') panel.querySelector('#bc-go').click(); });
        ['bc-cam', 'bc-gal'].forEach(function (id) {
          panel.querySelector('#' + id).addEventListener('change', function () {
            var f = this.files && this.files[0]; if (!f) return;
            decodeBarcode(f).then(function (code) {
              if (code) { panel.querySelector('#bc-code').value = code; lookup(code); }
              else err('Could not read the barcode from that photo — type the number above.');
            });
          });
        });
      }
    });
  }

  var bodySub = 'overview';

      var checklist = ['Avoid alcohol 48 hrs prior', 'No intense training 24 hrs prior', 'Fast 10&ndash;12 hours', 'Hydrate (water only)', 'Avoid supplements 24 hrs prior'];

      var selId = trainExSel && exById[trainExSel] ? trainExSel : topExIds[0];
      if (selId) {
        var series = exSeries(selId);
        var latest = series[series.length - 1], prev = series[series.length - 2];
        var tabs = topExIds.map(function (id) {
          return '<button role="tab" data-ex="' + esc(id) + '"' + (id === selId ? ' aria-selected="true"' : '') + '>' + esc((exById[id] || {}).name || 'Exercise') + '</button>';
        }).join('');
        h += '<section class="card lg-span-4"><div class="lg-card-row"><div class="lg-card-title">Exercise performance</div><a class="lg-card-link" href="../gym.html">Open Gym &rarr;</a></div>'
          + '<div class="segmented" style="align-self:flex-start;margin-top:4px">' + tabs + '</div>'
          + '<div class="between" style="margin-top:8px"><div><div class="t-cap">Est. 1RM</div><div class="lg-body-val" style="font-size:20px">' + (latest ? latest.v : '—') + ' <small>' + units + '</small>'
          + (latest && prev && latest.v !== prev.v ? '<span class="lg-trend" style="color:' + (latest.v > prev.v ? 'var(--green)' : 'var(--amber)') + '">' + (latest.v > prev.v ? '+' : '') + Math.round((latest.v - prev.v) * 10) / 10 + '</span>' : '')
          + '</div></div><div style="text-align:right"><div class="t-cap">Logged days</div><div class="lg-body-val" style="font-size:20px">' + series.length + '</div></div></div>'
          + bodyChart(series.slice(-12).map(function (x) { return x.v; })) + '</section>';
      }

      var progRows = topExIds.map(function (id) {
        var s = exSeries(id);
        if (s.length < 2) return '';
        var a = s[s.length - 1].v, b = s[s.length - 2].v;
        var icon = a > b ? upIcon : a < b ? downIcon : flatIcon;
        var msg = a > b ? 'Progressing — add load when ready' : a < b ? 'Down last session — check recovery' : 'Holding steady';
        var col = a > b ? 'var(--green)' : a < b ? 'var(--amber)' : 'var(--text-3)';
        return '<div class="lg-trow lg-prog"><span>' + esc((exById[id] || {}).name || '') + '</span><span class="lg-card-sub" style="color:' + col + ';text-align:right">' + msg + '</span><span class="lg-updot">' + icon + '</span></div>';
      }).join('');
      h += '<section class="card lg-span-4"><div class="lg-card-row"><div class="lg-card-title">Progression</div><span class="t-cap">est. 1RM direction</span></div>'
        + (progRows || '<div class="lg-card-sub" style="margin-top:8px">Log an exercise on two different days to see direction.</div>')
        + '<div class="lg-card-sub" style="margin-top:8px">Computed from your last two logged days per lift.</div></section>';
      h += '</div>';

      var mus = {};
      for (var i = 0; i < 7; i++) {
        (byDay[dsAgo(i)] || []).forEach(function (x) {
          var m = x.ex.muscle || 'Other';
          mus[m] = (mus[m] || 0) + setVol(x.set);
        });
      }
      var musKeys = Object.keys(mus).sort(function (a, b) { return mus[b] - mus[a]; });
      var musMax = musKeys.length ? mus[musKeys[0]] : 1;
      var musRows = musKeys.map(function (m) {
        return '<div class="lg-factor-row"><span class="fr-label">' + esc(m) + '</span><div class="bar"><i style="width:' + Math.round(mus[m] / musMax * 100) + '%;background:var(--accent)"></i></div><span class="fr-state num">' + fmtVol(mus[m]) + '</span></div>';
      }).join('');

      var prRows = prsList.slice(0, 3).map(function (pr) {
        return '<div class="lg-trow" style="grid-template-columns:24px 1fr auto"><span style="color:#ffd43b;display:inline-flex">' + trophyIcon + '</span>'
          + '<span>' + esc(pr.name || 'PR') + '<span class="lg-card-sub" style="display:block">' + esc(pr.date) + ' &middot; ' + pr.weight + units + ' &times; ' + pr.reps + '</span></span>'
          + '<span class="num">' + pr.e1rm + ' ' + units + '</span></div>';
      }).join('');

      var recCardio = card7.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); }).slice(0, 3).map(function (c) {
        return '<div class="lg-trow" style="grid-template-columns:22px 1fr auto"><span style="color:var(--accent);display:inline-flex">' + runIcon + '</span>'
          + '<span>' + esc(String(c.type || 'cardio').charAt(0).toUpperCase() + String(c.type || 'cardio').slice(1)) + '</span>'
          + '<span class="t-cap">' + (c.duration ? c.duration + ' min' : '') + (c.distance ? ' &middot; ' + c.distance + ' km' : '') + '</span></div>';
      }).join('');

      h += '<div class="lg-body-grid">';
      h += '<section class="card lg-span-3"><div class="lg-card-title">Muscle volume</div><div class="lg-card-sub">Last 7 days</div>'
        + (musRows || '<div class="lg-card-sub" style="margin-top:8px">No sets logged this week.</div>') + '</section>';
      h += '<section class="card lg-span-3"><div class="lg-card-row"><div class="lg-card-title">Cardio snapshot</div><button class="lg-card-link" data-goto-cardio style="background:none;border:0;cursor:pointer">View &rarr;</button></div>'
        + '<div style="display:flex;align-items:center;gap:12px;margin-top:6px"><div><div class="t-cap">This week</div><div class="lg-body-val" style="font-size:24px">' + cardMin7 + ' <small>min</small></div></div></div>'
        + (recCardio || '<div class="lg-card-sub" style="margin-top:8px">No cardio this week.</div>') + '</section>';
      h += '<section class="card lg-span-3"><div class="lg-card-row"><div class="lg-card-title">PRs</div><a class="lg-card-link" href="../gym.html">All &rarr;</a></div>'
        + (prRows || '<div class="lg-card-sub" style="margin-top:8px">PRs are detected automatically from your logged sets.</div>') + '</section>';
      h += '<section class="card lg-span-3"><div class="lg-card-title">Coach signals</div>' + coachRows() + '</section>';
      h += '</div>';
      return h;
    }

    /* ---------- Cardio ---------- */
    function cardioView() {
      var h = '<section class="card" style="padding:0">' + subtabsBar('') + '</section>';
      var dist7 = card7.reduce(function (a, c) { return a + (Number(c.distance) || 0); }, 0);
      var hrs = card7.filter(function (c) { return Number(c.hr) > 0; });
      var avgHr = hrs.length ? Math.round(hrs.reduce(function (a, c) { return a + Number(c.hr); }, 0) / hrs.length) : null;
      h += '<div class="lg-statgrid c4">'
        + kpiCard(cardioIcon, 'Minutes (7d)', cardMin7 + ' <small>min</small>', card7.length + ' session' + (card7.length === 1 ? '' : 's'))
        + kpiCard(runIcon, 'Distance (7d)', (Math.round(dist7 * 10) / 10) + ' <small>km</small>', 'across logged sessions')
        + kpiCard(heartIcon, 'Avg HR (7d)', avgHr != null ? avgHr + ' <small>bpm</small>' : '&mdash;', avgHr != null ? 'from ' + hrs.length + ' session' + (hrs.length === 1 ? '' : 's') : 'log HR to see this')
        + kpiCard(calIcon, 'Total logged', String(cardio.length), cardio.length ? 'since ' + esc(cardio.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); })[0].date) : 'no sessions yet')
        + '</div>';

      h += '<div class="lg-body-grid">';
      h += '<section class="card lg-span-4"><div class="lg-card-title">Log cardio session</div>'
        + '<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">'
        + '<div class="field"><span class="label">Type</span><select class="select" id="cd-type"><option value="run">Run</option><option value="bike">Cycle</option><option value="row">Row</option><option value="swim">Swim</option><option value="walk">Walk</option><option value="hiit">HIIT</option><option value="other">Other</option></select></div>'
        + '<div class="field"><span class="label">Duration (min)</span><input class="input num" id="cd-dur" type="number" inputmode="numeric" placeholder="30"></div>'
        + '<div class="field"><span class="label">Distance (km)</span><input class="input num" id="cd-dist" type="number" inputmode="decimal" placeholder="5.2"></div>'
        + '<div class="field"><span class="label">Avg HR (bpm)</span><input class="input num" id="cd-hr" type="number" inputmode="numeric" placeholder="145"></div>'
        + '</div>'
        + '<div class="field" style="margin-top:10px"><span class="label">Notes</span><input class="input" id="cd-notes" placeholder="Easy effort..."></div>'
        + '<button class="btn btn-primary btn-block" id="cd-save" style="margin-top:12px">Log cardio session</button>'
        + '<div class="lg-card-sub" style="text-align:center;margin-top:8px">Saves to the same store the Gym module uses.</div></section>';

      var wkBars = [];
      for (var w = 7; w >= 0; w--) {
        var lo = dsAgo(w * 7 + 6), hi = dsAgo(w * 7);
        wkBars.push(cardio.filter(function (c) { return c.date >= lo && c.date <= hi; })
          .reduce(function (a, c) { return a + (Number(c.duration) || 0); }, 0));
      }
      h += '<section class="card lg-span-4"><div class="lg-card-row"><div class="lg-card-title">Weekly minutes</div><span class="t-cap">8 weeks</span></div>'
        + (wkBars.some(function (v) { return v > 0; }) ? barChart(wkBars, 0) : '<div class="lg-card-sub" style="margin-top:8px">No cardio logged yet.</div>')
        + '</section>';

      var byType = {};
      cardio.filter(function (c) { return c.date >= dsAgo(29); }).forEach(function (c) {
        var k = c.type || 'other';
        byType[k] = byType[k] || { n: 0, min: 0 };
        byType[k].n++; byType[k].min += Number(c.duration) || 0;
      });
      var typeRows = Object.keys(byType).sort(function (a, b) { return byType[b].min - byType[a].min; }).map(function (k) {
        return '<div class="lg-kv-row"><span class="k">' + esc(k.charAt(0).toUpperCase() + k.slice(1)) + '</span><span class="num">' + byType[k].n + '&times; &middot; ' + byType[k].min + ' min</span></div>';
      }).join('');
      h += '<section class="card lg-span-4"><div class="lg-card-row"><div class="lg-card-title">By modality</div><span class="t-cap">30 days</span></div>'
        + (typeRows || '<div class="lg-card-sub" style="margin-top:8px">Nothing in the last 30 days.</div>') + '</section>';
      h += '</div>';

      var recent = cardio.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); }).slice(0, 8);
      h += '<section class="card"><div class="lg-card-row"><div class="lg-card-title">Recent sessions</div><a class="lg-card-link" href="../gym.html#cardio">Open in Gym &rarr;</a></div>'
        + (recent.length ? recent.map(function (c) {
            var bits = [c.duration ? c.duration + ' min' : null, c.distance ? c.distance + ' km' : null, c.hr ? c.hr + ' bpm' : null].filter(Boolean).join(' &middot; ');
            return '<div class="lg-trow" style="grid-template-columns:22px 1fr auto auto;gap:10px"><span style="color:var(--accent);display:inline-flex">' + runIcon + '</span>'
              + '<span>' + esc(String(c.type || 'cardio').charAt(0).toUpperCase() + String(c.type || 'cardio').slice(1)) + (c.notes ? '<span class="lg-card-sub" style="display:block">' + esc(c.notes) + '</span>' : '') + '</span>'
              + '<span class="t-cap">' + bits + '</span>'
              + '<span class="t-cap" style="text-align:right">' + esc(c.date) + ' <button class="lg-ic-btn" data-del-cardio="' + esc(String(c.id)) + '" aria-label="Delete session">&times;</button></span></div>';
          }).join('') : '<div class="lg-card-sub" style="margin-top:8px">No cardio logged yet — use the form above.</div>')
        + '</section>';
      return h;
    }

    /* ---------- Progress ---------- */
    function progressView() {
      var h = '<section class="card" style="padding:0">' + subtabsBar('') + '</section>';
      if (!hasStrength) {
        h += emptyCard('No strength data yet', 'Log sets in the Gym module and progress charts build themselves from your history.', '../gym.html', 'Open Gym');
        return h;
      }
      var cut28 = dsAgo(28);
      var liftDeltas = topExIds.map(function (id) {
        var s = exSeries(id);
        if (!s.length) return null;
        var latest = s[s.length - 1].v;
        var old = (s.filter(function (x) { return x.d <= cut28; }).pop() || s[0]).v;
        return { id: id, latest: latest, old: old, pct: old ? Math.round((latest - old) / old * 100) : 0 };
      }).filter(Boolean);
      var avgPct = liftDeltas.length ? Math.round(liftDeltas.reduce(function (a, x) { return a + x.pct; }, 0) / liftDeltas.length) : 0;
      var cardioWeeks = 0;
      for (var w = 0; w < 8; w++) {
        var lo = dsAgo(w * 7 + 6), hi = dsAgo(w * 7);
        if (cardio.some(function (c) { return c.date >= lo && c.date <= hi; })) cardioWeeks++;
      }
      h += '<div class="lg-statgrid c4">'
        + kpiCard(dumbIcon, 'Weekly volume', fmtVol(vol7) + ' <small>' + units + '</small>', deltaHtml(vol7, volPrev) || '&nbsp;')
        + kpiCard(boltIcon, 'Strength trend', (avgPct > 0 ? '+' : '') + avgPct + '%', 'top lifts est. 1RM vs 4 weeks ago')
        + kpiCard(cardioIcon, 'Cardio consistency', Math.round(cardioWeeks / 8 * 100) + '%', cardioWeeks + ' of 8 weeks')
        + '<section class="card"><div class="kpi-top"><span class="lg-body-ic">' + heartIcon + '</span>Readiness</div>'
        + '<div style="display:flex;align-items:center;gap:12px;margin-top:6px"><div style="flex:1"><div style="color:' + (rd.score >= 70 ? 'var(--green)' : 'var(--amber)') + ';font-weight:600">' + esc(rd.label || '—') + '</div></div>'
        + (rd.score != null ? ring(rd.score, '') : '') + '</div></section>'
        + '</div>';

      h += '<div class="lg-body-grid">';
      h += '<section class="card lg-span-6"><div class="lg-card-row"><div class="lg-card-title">Weekly volume</div><span class="t-cap">8 weeks &middot; ' + units + '</span></div>'
        + bodyChart(volSeries) + '<div class="lg-card-sub">Volume = load &times; reps across all logged sets.</div></section>';
      var klRows = liftDeltas.map(function (x) {
        var col = x.pct > 0 ? 'var(--green)' : x.pct < 0 ? 'var(--amber)' : 'var(--text-3)';
        return '<div class="lg-trow" style="grid-template-columns:1fr auto 64px"><span>' + esc((exById[x.id] || {}).name || '') + '</span>'
          + '<span class="num">' + x.latest + ' ' + units + '</span>'
          + '<span class="lg-card-sub" style="color:' + col + ';text-align:right">' + (x.pct > 0 ? '+' : '') + x.pct + '%</span></div>';
      }).join('');
      h += '<section class="card lg-span-3"><div class="lg-card-row"><div class="lg-card-title">Key lifts</div><span class="t-cap">vs 4w ago</span></div>' + klRows + '</section>';
      var msRows = prsList.slice(0, 6).map(function (pr) {
        return '<div class="lg-trow" style="grid-template-columns:24px 1fr auto"><span style="color:#ffd43b;display:inline-flex">' + trophyIcon + '</span>'
          + '<span>' + esc(pr.name || 'PR') + '<span class="lg-card-sub" style="display:block">' + pr.weight + units + ' &times; ' + pr.reps + '</span></span>'
          + '<span class="t-cap">' + esc(pr.date) + '</span></div>';
      }).join('');
      h += '<section class="card lg-span-3"><div class="lg-card-title">PR timeline</div>'
        + (msRows || '<div class="lg-card-sub" style="margin-top:8px">No PRs detected yet.</div>') + '</section>';
      h += '</div>';
      h += '<section class="card"><div class="lg-card-title">Coach signals</div>' + coachRows() + '</section>';
      return h;
    }

    /* ---------- History ---------- */
    function historyView() {
      var h = '<section class="card" style="padding:0">' + subtabsBar('') + '</section>';
      if (!hasAny) {
        h += emptyCard('No history yet', 'Your logged sessions appear here once you train.', '../gym.html', 'Open Gym');
        return h;
      }
      var ym = t.slice(0, 7);
      var monthDays = Object.keys(byDay).filter(function (dk) { return dk.slice(0, 7) === ym; });
      var monthVol = monthDays.reduce(function (a, dk) { return a + volFor(dk); }, 0);
      var monthCardio = cardio.filter(function (c) { return String(c.date).slice(0, 7) === ym; });
      var monthKm = monthCardio.reduce(function (a, c) { return a + (Number(c.distance) || 0); }, 0);
      var monthPRs = prsList.filter(function (pr) { return String(pr.date).slice(0, 7) === ym; });
      h += '<div class="lg-statgrid c4">'
        + kpiCard(calIcon, 'Sessions this month', String(monthDays.length), 'strength days with sets')
        + kpiCard(dumbIcon, 'Volume this month', fmtVol(monthVol) + ' <small>' + units + '</small>', 'load &times; reps')
        + kpiCard(cardioIcon, 'Cardio this month', String(monthCardio.length), (Math.round(monthKm * 10) / 10) + ' km total')
        + kpiCard(trophyIcon, 'PRs this month', String(monthPRs.length), monthPRs.length ? esc(monthPRs.slice(0, 2).map(function (x) { return x.name; }).join(', ')) : 'none yet')
        + '</div>';

      var days = Object.keys(byDay).sort().reverse().slice(0, 8);
      var histRows = days.map(function (dk) {
        var sets = byDay[dk];
        var names = [];
        sets.forEach(function (x) { if (names.indexOf(x.ex.name) < 0) names.push(x.ex.name); });
        return '<div class="lg-hist-row"><div class="min-0"><div class="t-cap">' + esc(typeof dateLabel === 'function' ? dateLabel(dk) : dk) + '</div>'
          + '<div style="font-weight:600;margin:2px 0"><span>' + esc(names.slice(0, 3).join(', ')) + (names.length > 3 ? ' +' + (names.length - 3) : '') + '</span> <span class="badge violet">Strength</span></div>'
          + '<div class="t-cap">' + sets.length + ' sets &middot; ' + fmtVol(volFor(dk)) + ' ' + units + '</div></div>'
          + '<a class="lg-edit" href="../gym.html" aria-label="Open in Gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 5h5v5M19 5l-8 8M11 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></a></div>';
      }).join('');

      var clRows = cardio.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); }).slice(0, 5).map(function (c) {
        var bits = [c.duration ? c.duration + ' min' : null, c.distance ? c.distance + ' km' : null, c.hr ? c.hr + ' bpm' : null].filter(Boolean).join(' &middot; ');
        return '<div class="lg-trow" style="grid-template-columns:22px 1fr auto"><span style="color:var(--accent);display:inline-flex">' + runIcon + '</span>'
          + '<span>' + esc(String(c.type || 'cardio').charAt(0).toUpperCase() + String(c.type || 'cardio').slice(1)) + '<span class="lg-card-sub" style="display:block">' + bits + '</span></span>'
          + '<span class="t-cap">' + esc(c.date) + '</span></div>';
      }).join('');

      /* monthly calendar with strength/cardio dots from real data */
      var y = Number(t.slice(0, 4)), mo = Number(t.slice(5, 7));
      var dim = new Date(y, mo, 0).getDate();
      var firstDow = (new Date(y, mo - 1, 1).getDay() + 6) % 7; /* Mon = 0 */
      var cardioDays = {};
      monthCardio.forEach(function (c) { cardioDays[c.date] = 1; });
      var cal = '<div class="lg-cal">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) { return '<div class="t-cap">' + d + '</div>'; }).join('');
      for (var b = 0; b < firstDow; b++) cal += '<div class="d" style="border:0"></div>';
      for (var dn = 1; dn <= dim; dn++) {
        var ds = ym + '-' + String(dn).padStart(2, '0');
        var col = byDay[ds] ? 'var(--green)' : cardioDays[ds] ? '#4dabf7' : 'transparent';
        cal += '<div class="d"' + (ds === t ? ' style="border-color:var(--accent)"' : '') + '><b>' + dn + '</b><i style="background:' + col + '"></i></div>';
      }
      cal += '</div>';
      var legend = '<div class="inline" style="gap:14px;margin-top:8px;font-size:11px;color:var(--text-3)"><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px"></i>Strength</span><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#4dabf7;margin-right:4px"></i>Cardio</span></div>';

      h += '<div class="lg-body-grid">';
      h += '<section class="card lg-span-4"><div class="lg-card-title">Training history</div>'
        + (histRows || '<div class="lg-card-sub" style="margin-top:8px">No strength sessions logged.</div>')
        + '<a class="lg-card-link" href="../gym.html" style="display:inline-block;margin-top:10px">Open Gym &rarr;</a></section>';
      h += '<section class="card lg-span-4"><div class="lg-card-row"><div class="lg-card-title">Recent cardio</div><button class="lg-card-link" data-goto-cardio style="background:none;border:0;cursor:pointer">View all &rarr;</button></div>'
        + (clRows || '<div class="lg-card-sub" style="margin-top:8px">No cardio logged.</div>') + '</section>';
      h += '<section class="card lg-span-4"><div class="lg-card-row"><div class="lg-card-title">Monthly activity</div><span class="t-cap">' + esc(new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })) + '</span></div>' + cal + legend + '</section>';
      h += '</div>';
      return h;
    }

    var tviews = { overview: overviewView, cardio: cardioView, progress: progressView, history: historyView };
    var builder = tviews[trainSub] || overviewView;
    p.innerHTML = '<div class="lg-body-wrap">' + builder() + '</div>';

    p.querySelectorAll('[data-sub]').forEach(function (b) {
      b.addEventListener('click', function () { trainSub = b.getAttribute('data-sub'); renderTrainingPanel(p); });
    });
    p.querySelectorAll('[data-goto-cardio]').forEach(function (b) {
      b.addEventListener('click', function () { trainSub = 'cardio'; renderTrainingPanel(p); });
    });
    p.querySelectorAll('[data-ex]').forEach(function (b) {
      b.addEventListener('click', function () { trainExSel = b.getAttribute('data-ex'); renderTrainingPanel(p); });
    });
    var cdSave = p.querySelector('#cd-save');
    if (cdSave) cdSave.addEventListener('click', function () {
      var dur = parseInt(p.querySelector('#cd-dur').value, 10) || 0;
      if (!dur) { UI.toast('Enter a duration'); return; }
      var arr = lsget('gym:cardio:v1', []) || [];
      arr.push({
        id: String(Date.now()),
        type: p.querySelector('#cd-type').value,
        duration: dur,
        distance: parseFloat(p.querySelector('#cd-dist').value) || null,
        hr: parseInt(p.querySelector('#cd-hr').value, 10) || null,
        notes: p.querySelector('#cd-notes').value.trim(),
        date: t,
      });
      lsset('gym:cardio:v1', arr); fire();
      UI.toast('Cardio logged'); renderTrainingPanel(p);
    });
    p.querySelectorAll('[data-del-cardio]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-del-cardio');
        lsset('gym:cardio:v1', (lsget('gym:cardio:v1', []) || []).filter(function (c) { return String(c.id) !== id; })); fire();
        UI.toast('Session deleted'); renderTrainingPanel(p);

    /* ---------- History ---------- */
    function historyView() {
      var days30 = [];
      for (var i = 29; i >= 0; i--) days30.push(offset(-i));
      var vals30 = days30.map(function (d) { return mlFor(d) / 1000; });
      var logged30 = days30.filter(function (d) { return mlFor(d) > 0; });
      var avg30 = logged30.length ? logged30.reduce(function (s, d) { return s + mlFor(d); }, 0) / logged30.length / 1000 : 0;
      var hit30 = days30.filter(function (d) { return mlFor(d) >= targetMl; }).length;
      var hitPct = Math.round(hit30 / 30 * 100);
      var monthKey = t.slice(0, 7);
      var monthTotal = Object.keys(ws.logs).filter(function (d) { return d.slice(0, 7) === monthKey; })
        .reduce(function (s, d) { return s + mlFor(d); }, 0) / 1000;
      var monthDays = Object.keys(ws.logs).filter(function (d) { return d.slice(0, 7) === monthKey && Number(ws.logs[d]) > 0; }).length;

      var h = '<section class="card" style="padding:0">' + subtabsBar('<div class="lg-sub-actions"><span class="t-cap">Last 30 days</span></div>') + '</section>';
      h += '<div class="lg-statgrid c5">'
        + wKpi(dropFill, 'Average hydration', avg30.toFixed(1) + ' <small>L / logged day</small>', logged30.length + ' of 30 days logged', spark(vals30.slice(-7), BLU))
        + '<section class="card lg-kpi"><div class="kpi-top">' + targetIcon + 'Target hit rate</div><div class="between" style="margin-top:4px"><div><div class="kpi-val">' + hitPct + '%</div><div class="kpi-sub">' + hit30 + ' of 30 days</div></div>' + wring(hitPct, '', BLU) + '</div></section>'
        + wKpi(dropIcon, 'Current streak', streak + ' <small>' + (streak === 1 ? 'day' : 'days') + '</small>', bestStreak ? 'Best: ' + bestStreak + ' days' : '')
        + wKpi(trophyIcon, 'Longest streak', bestStreak + ' <small>' + (bestStreak === 1 ? 'day' : 'days') + '</small>', 'Last 12 months')
        + wKpi(waveIcon, 'Total this month', monthTotal.toFixed(1) + ' <small>L</small>', monthDays ? 'Daily avg: ' + (monthTotal / monthDays).toFixed(2) + ' L' : 'No logs yet')
        + '</div>';

      h += '<div class="lg-body-grid">';
      if (!loggedAny) {
        h += '<section class="card lg-span-12"><div class="lg-card-title">No history yet</div><div class="lg-card-sub">Log water from the Overview tab (or ../water.html) and your trends, streaks, and calendar fill in here.</div></section></div>';
        return h;
      }
      /* Trend */
      var avg = vals30.map(function (_v, i2, a) { var s = 0, c = 0; for (var j = Math.max(0, i2 - 6); j <= i2; j++) { s += a[j]; c++; } return s / c; });
      var trendLabels = [days30[0], days30[7], days30[15], days30[22], days30[29]].map(dateLabel);
      h += '<section class="card lg-span-8"><div class="lg-card-row"><div class="lg-card-title">Hydration trend</div><span class="t-cap">Daily · 30 days</span></div>'
        + wline(vals30, targetL, avg, trendLabels, 180)
        + '<div class="inline t-cap" style="gap:16px;margin-top:8px"><span><i style="display:inline-block;width:12px;height:2px;background:' + BLU + ';margin-right:5px;vertical-align:3px"></i>Daily hydration</span><span><i style="display:inline-block;width:12px;height:2px;background:#f0883e;margin-right:5px;vertical-align:3px"></i>7-day average</span><span><i style="display:inline-block;width:12px;height:2px;background:#5ee6a8;margin-right:5px;vertical-align:3px"></i>Goal (' + targetL.toFixed(1) + ' L)</span></div></section>';

      /* Weekly totals */
      function weekTotal(w) {
        var s = 0;
        for (var d = 0; d < 7; d++) s += mlFor(offset(-(w * 7 + d)));
        return s;
      }
      function totalRow(label, val, pctW, tail, tcolor) { return '<div style="display:grid;grid-template-columns:110px 1fr 60px 48px;gap:8px;align-items:center;min-height:30px"><span class="t-cap">' + esc(label) + '</span><div class="bar" style="height:6px"><i style="width:' + pctW + '%;background:' + BLU + '"></i></div><span class="num" style="text-align:right">' + esc(val) + '</span>' + (tail ? '<span class="t-cap" style="text-align:right;color:' + (tcolor || 'var(--green)') + '">' + esc(tail) + '</span>' : '<span></span>') + '</div>'; }
      var weekRows = '';
      for (var w = 0; w < 5; w++) {
        var tot = weekTotal(w);
        var wpct = clamp(tot / (targetMl * 7) * 100, 0, 100);
        var lbl = dateLabel(offset(-(w * 7 + 6))) + ' - ' + dateLabel(offset(-(w * 7)));
        weekRows += totalRow(lbl, (tot / 1000).toFixed(1) + ' L', Math.round(wpct), Math.round(wpct) + '%', wpct >= 80 ? 'var(--green)' : 'var(--amber)');
      }
      h += '<section class="card lg-span-4"><div class="lg-card-title">Weekly totals</div>' + weekRows
        + '<a class="btn btn-secondary btn-block btn-sm" href="../water.html" style="margin-top:8px">Open water app</a></section>';

      /* Monthly consistency calendar */
      h += '<section class="card lg-span-4"><div class="lg-card-row"><div class="lg-card-title">Monthly consistency</div><span class="t-cap">' + new Date(t + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + '</span></div>' + waterCal() + '</section>';

      /* Daily breakdown donut (last 90 days) */
      var cHit = 0, cNear = 0, cBelow = 0, cNone = 0;
      for (var di = 0; di < 90; di++) {
        var m = mlFor(offset(-di));
        if (m >= targetMl) cHit++; else if (m >= zoneLoMl) cNear++; else if (m > 0) cBelow++; else cNone++;
      }
      var segs = [];
      if (cHit) segs.push([cHit, '#5ee6a8']);
      if (cNear) segs.push([cNear, BLU]);
      if (cBelow) segs.push([cBelow, '#f0883e']);
      if (cNone) segs.push([cNone, 'rgba(255,255,255,.14)']);
      function drow(color, label, n) { return '<div class="lg-kv-row" style="min-height:26px"><span class="k"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:7px"></i>' + label + '</span><span class="num">' + n + ' (' + Math.round(n / 90 * 100) + '%)</span></div>'; }

        + '</div></div></section>';

      /* Best / worst week */
      var best = null, worst = null;
      for (var bw = 0; bw < 12; bw++) {

        + (best ? '<div class="between" style="margin-top:8px"><div><div class="lg-body-val" style="font-size:24px">' + (best.total / 1000).toFixed(1) + ' L</div><div class="t-cap">' + esc(best.label) + ' &middot; Avg ' + (best.total / 7000).toFixed(1) + ' L/day</div></div><span style="color:var(--green)">' + medalIcon + '</span></div>' : '<div class="t-cap" style="margin-top:8px">Not enough data yet</div>')
        + '<div class="lg-card-title" style="margin-top:14px">Lightest week</div>'
        + (worst ? '<div class="between" style="margin-top:8px"><div><div class="lg-body-val" style="font-size:24px">' + (worst.total / 1000).toFixed(1) + ' L</div><div class="t-cap">' + esc(worst.label) + ' &middot; Avg ' + (worst.total / 7000).toFixed(1) + ' L/day</div></div><span style="color:var(--amber)">' + medalIcon + '</span></div>' : '<div class="t-cap" style="margin-top:8px">Not enough data yet</div>')
        + '</section>';

      h += '</div>';
      return h;
    }
    function waterCal() {
      var dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      var y = Number(t.slice(0, 4)), mo = Number(t.slice(5, 7));
      var first = new Date(y, mo - 1, 1);
      var start = (first.getDay() + 6) % 7; /* Monday-first offset */
      var dim = new Date(y, mo, 0).getDate();

      for (var i = 0; i < start; i++) cells += '<div class="d" style="border:0"></div>';

      }

        + '<div class="inline t-cap" style="gap:12px;margin-top:8px;flex-wrap:wrap"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f0883e;margin-right:5px"></i>Below</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + BLU + ';margin-right:5px"></i>Near</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#5ee6a8;margin-right:5px"></i>Target hit</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.10);margin-right:5px"></i>No log</span></div>';

  /* ============================================================

  var skinSub = 'overview';
  function renderSkinPanel(p) {
    var dropIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/></svg>';

    var sparkleIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>';
    var calIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>';
    var cameraIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="14" rx="2.5"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>';
    var alertIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 9 17H3L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>';
    var layersIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5M3 17l9 5 9-5"/></svg>';
    var chev = '<span style="color:var(--text-3)">&rsaquo;</span>';

    var t = today();
    var logs = (lsget('skin:logs', []) || []).slice().sort(byDateDesc);
    var prods = lsget('skin:products', []) || [];
    var routine = lsget('skin:routine:v1', {}) || {};
    var bkouts = (lsget('skin:breakouts', []) || []).slice().sort(byDateDesc);
    var doneToday = routine[t] || [];
    var todayLog = logs.filter(function (e) { return e.date === t; })[0];

    function dsAgo(n) {
      var d = new Date(); d.setDate(d.getDate() - n);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function dueFor(time) {
      return prods.filter(function (pr) { return (pr.time === time || pr.time === 'both') && pr.freq !== 'asNeeded'; });
    }
    var amDue = dueFor('am'), pmDue = dueFor('pm');
    function doneCount(list, arr) { return list.filter(function (pr) { return arr.indexOf(String(pr.id)) >= 0; }).length; }

    /* adherence: same formula skin.html uses (checks over 7d vs products) */
    var adh7 = null;
    if (prods.length) {
      var checks = 0;
      for (var i = 0; i < 7; i++) checks += (routine[dsAgo(i)] || []).length;
      adh7 = Math.min(100, Math.round(checks / (7 * prods.length) * 100));
    }
    function checkStreak() {
      var sorted = logs.slice();
      if (!sorted.length) return 0;
      var streak = 0, cur = t;
      for (var i = 0; i < sorted.length; i++) {
        if (sorted[i].date === cur) {
          streak++;
          var d = new Date(cur + 'T12:00:00'); d.setDate(d.getDate() - 1);
          cur = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        } else if (sorted[i].date < cur) break;
      }
      return streak;
    }
    var cut30 = dsAgo(30);
    var rated30 = logs.filter(function (l) { return l.rating && l.date >= cut30; });
    var avg30 = rated30.length ? (rated30.reduce(function (s, l) { return s + Number(l.rating); }, 0) / rated30.length) : null;
    var bk30 = bkouts.filter(function (b) { return b.date >= cut30; });
    var ratingSeries = logs.slice(0, 14).reverse().map(function (l) { return Number(l.rating) || 0; }).filter(Boolean);
    var RATING_LABEL = ['', 'Very bad', 'Bad', 'Okay', 'Good', 'Excellent'];
    var photos = logs.filter(function (l) { return l.photo; });

        + '<div><div class="lg-list-head" style="padding:0 0 4px">PM Routine</div>' + (pmDue.length ? pmDue.map(stepRow).join('') : '<div class="lg-card-sub">No PM products.</div>') + '</div></div>'
        + '<div class="lg-card-sub" style="margin-top:8px">Tap a step to mark it done — shared with the Skin app.</div></section>';
    }
    function checkinCard(span) {

      return '<section class="card ' + span + '"><div class="lg-card-row"><div class="lg-card-title">Skin check-in</div><span class="t-cap">' + (todayLog ? 'Logged today' : 'Not logged yet') + '</span></div>'
        + (todayLog

            + (concerns.length ? '<div class="lg-chip-set" style="margin-top:6px">' + concerns.map(function (c) { return '<span class="lg-mini-chip">' + esc(c) + '</span>'; }).join('') + '</div>' : '<div class="lg-card-sub" style="margin-top:6px">No concerns noted.</div>')

          + '<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">'
          + '<div><img src="' + first.photo + '" alt="Skin photo ' + esc(first.date) + '" style="width:100%;border-radius:10px"><div class="t-cap" style="text-align:center;margin-top:4px">' + esc(first.date) + '</div></div>'
          + '<div><img src="' + latest.photo + '" alt="Skin photo ' + esc(latest.date) + '" style="width:100%;border-radius:10px"><div class="t-cap" style="text-align:center;margin-top:4px">' + esc(latest.date) + '</div></div>'
          + '</div></section>';
      }
      h += '<section class="card"><div class="lg-card-row"><div class="lg-card-title">Timeline</div><a class="lg-card-link" href="../skin.html">Add photo &rarr;</a></div>'
        + '<div class="lg-gallery">' + photos.slice(0, 12).map(function (l) {
          return '<div class="lg-thumb"><img src="' + l.photo + '" alt="Skin photo ' + esc(l.date) + '" style="width:100%;height:100%;object-fit:cover;border-radius:10px"><span class="th-cap">' + esc(l.date) + (l.rating ? ' &middot; ' + l.rating + '/5' : '') + '</span></div>';
        }).join('') + '</div></section>';
      var withAnalysis = photos.filter(function (l) { return l.analysis; })[0];
      if (withAnalysis && withAnalysis.analysis && withAnalysis.analysis.summary) {
        h += '<section class="card"><div class="lg-card-row"><div class="lg-card-title">Latest AI analysis</div><span class="t-cap">' + esc(withAnalysis.date) + '</span></div>'
          + '<div class="lg-card-sub" style="margin-top:6px">' + esc(withAnalysis.analysis.summary) + '</div>'
          + (withAnalysis.analysis.next_action ? '<div class="lg-note-card" style="margin-top:8px">' + sparkleIcon + '<span>' + esc(withAnalysis.analysis.next_action) + '</span></div>' : '')
          + '</section>';
      }
      return h;
    }

    var views = { overview: overviewView, routine: routineView, products: productsView, photos: photosView };
    var builder = views[skinSub] || overviewView;
    p.innerHTML = '<div class="lg-body-wrap">' + builder() + '</div>';

    p.querySelectorAll('[data-sub]').forEach(function (b) {
      b.addEventListener('click', function () { skinSub = b.getAttribute('data-sub'); renderSkinPanel(p); });
    });
    p.querySelectorAll('[data-rt]').forEach(function (b) {
      b.addEventListener('click', function () {
        var pid = b.getAttribute('data-rt');
        var rl = lsget('skin:routine:v1', {}) || {};
        var arr = rl[t] || [];
        var idx = arr.indexOf(pid);
        if (idx === -1) arr.push(pid); else arr.splice(idx, 1);
        rl[t] = arr;
        lsset('skin:routine:v1', rl); fire();
        renderSkinPanel(p);
      });
    });
    wireAdd(p, function () { skinSheet(todayLog || {}); });
    wireEntries(p, 'skin');
  }

  var C = {
    food: {
      label: 'Food',
      render: function (p) {
        renderFoodPanel(p);
        return;
        var key = ntKey();
        var logs = (lsget('nt:logs', []) || []).filter(function (l) { return String(l.dateKey || '').replace(/\//g, '-') === key; });
        var tot = logs.reduce(function (a, l) { a.c += l.calories || 0; a.pr += l.protein || 0; return a; }, { c: 0, pr: 0 });
        var tgt = lsget('nt:targets', {}) || {}, ct = tgt.calories || 2000, pt = tgt.protein || 150;
        var html = '';
        html += summaryCard(metricLine('Calories', Math.round(tot.c) + ' / ' + ct + ' kcal') + metricLine('Protein', Math.round(tot.pr) + ' / ' + pt + ' g'));
        html += addBtn('Log meal');
        // Fast non-typing capture: AI photo + barcode (open the flow in the Food module).
        html += '<div class="inline" style="gap:var(--s2)">'
          + '<a class="btn btn-secondary lg-add" href="../nutrition.html#ai" style="flex:1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><rect x="3" y="6" width="18" height="14" rx="2.5"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>AI photo</a>'
          + '<a class="btn btn-secondary lg-add" href="../nutrition.html#barcode" style="flex:1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14"/></svg>Barcode</a>'
          + '</div>';
        if (logs.length) {
          html += '<div class="card"><div class="lg-list-head">Today</div><div class="stack" style="gap:0" data-entries>'
            + logs.map(function (l) { return entryRow({ id: l.id, title: l.name, sub: Math.round(l.calories || 0) + ' kcal · ' + Math.round(l.protein || 0) + 'g P' }); }).join('')
            + '</div><div class="lg-foot"><a href="../nutrition.html">Open Food — database, barcode, AI photo, meals, trends</a></div></div>';
        } else {
          html += '<div class="card">' + emptyState(ICONS.food, 'No meals logged today', 'Log your first meal to track intake.', 'Log a meal') + '</div>';
        }
        p.innerHTML = html;
        wireAdd(p, function () { mealSheet(); });
        wireEntries(p, 'food');
      },
      add: function (prefill) { mealSheet({ name: prefill || '' }); },
      del: function (id) {
        var arr = lsget('nt:logs', []), i = arr.findIndex(function (l) { return String(l.id) === String(id); });
        if (i < 0) return null; var it = arr[i]; arr.splice(i, 1); lsset('nt:logs', arr); fire();
        return function () { var a = lsget('nt:logs', []); a.push(it); lsset('nt:logs', a); fire(); };
      },
      edit: function (id) { var l = (lsget('nt:logs', []) || []).find(function (x) { return String(x.id) === String(id); }); if (l) mealSheet(l); },
    },

    body: {
      label: 'Body',
      render: function (p) {
        renderBodyPanel(p);
        return;
        var t = today();
        var w = (lsget('po_coach_weights', []) || []).filter(function (e) { return e && e.dateKey === t && e.weight > 0; })[0];
        var sl = (lsget('sleep:logs', []) || []).filter(function (e) { return e && e.date === t; })[0];
        var html = '';
        html += addBtn('Log body');
        var rows = [];
        if (w) rows.push(entryRow({ id: 'w', title: 'Weight', value: w.weight + ' kg' }));
        if (sl) rows.push(entryRow({ id: 's', title: 'Sleep', value: fmtDur(sl.duration) }));
        if (rows.length) {
          html += '<div class="card"><div class="lg-list-head">Today</div><div class="stack" style="gap:0" data-entries>' + rows.join('') + '</div></div>';
        } else {
          html += '<div class="card">' + emptyState(ICONS.body, 'Nothing logged today', 'Log weight or last night\'s sleep.', 'Log body') + '</div>';
        }
        html += '<div class="card"><div class="lg-list-head">More</div><div class="stack" style="gap:0">'
          + linkRow('Measurements & progress photos', '../body.html')
          + linkRow('Health metrics (HRV, RHR, steps)', '../health.html')
          + linkRow('Bloodwork & meds', '../health.html#labs')
          + linkRow('Wearable', 'watch.html')
          + '</div></div>';
        p.innerHTML = html;
        wireAdd(p, function () {
          choiceSheet('Log body', [
            { label: 'Weight', onTap: function () { weightSheet(); } },
            { label: 'Sleep', onTap: function () { sleepSheet(); } },
          ]);
        });
        wireEntries(p, 'body');
      },
      add: function (prefill) {
        if (prefill && /^[\d.]+$/.test(prefill)) weightSheet({ weight: parseFloat(prefill) });
        else measurementSheet();
      },
      del: function (id) {
        var t = today();
        if (id === 'w') {
          var arr = lsget('po_coach_weights', []), i = arr.findIndex(function (e) { return e.dateKey === t; });
          if (i < 0) return null; var it = arr[i]; arr.splice(i, 1); lsset('po_coach_weights', arr); fire();
          return function () { var a = lsget('po_coach_weights', []); a.push(it); a.sort(function (x, y) { return String(x.dateKey).localeCompare(String(y.dateKey)); }); lsset('po_coach_weights', a); fire(); };
        }
        var sarr = lsget('sleep:logs', []), si = sarr.findIndex(function (e) { return e.date === t; });
        if (si < 0) return null; var sit = sarr[si]; sarr.splice(si, 1); lsset('sleep:logs', sarr); fire();
        return function () { var a = lsget('sleep:logs', []); a.push(sit); lsset('sleep:logs', a); fire(); };
      },
      edit: function (id) {
        var t = today();
        if (id === 'w') weightSheet((lsget('po_coach_weights', []) || []).filter(function (e) { return e.dateKey === t; })[0]);
        else sleepSheet((lsget('sleep:logs', []) || []).filter(function (e) { return e.date === t; })[0]);
      },
    },

    training: {
      label: 'Training',
      render: function (p) { renderTrainingPanel(p); },
      add: function () { location.href = '../gym.html'; },
    },

    skin: {
      label: 'Skin',
      render: function (p) { renderSkinPanel(p); },
      add: function () { skinSheet(); },
      del: function (id) {
        var arr = lsget('skin:logs', []), i = arr.findIndex(function (l) { return String(l.id != null ? l.id : l.date) === String(id); });
        if (i < 0) return null; var it = arr[i]; arr.splice(i, 1); lsset('skin:logs', arr); fire();
        return function () { var a = lsget('skin:logs', []); a.push(it); lsset('skin:logs', a); fire(); };
      },
      edit: function (id) { var l = (lsget('skin:logs', []) || []).find(function (x) { return String(x.id != null ? x.id : x.date) === String(id); }); if (l) skinSheet(l); },
    },

    water: {
      label: 'Water',
      render: function (p) { renderWaterPanel(p); },
      add: function (prefill) {
        if (prefill && /^-?\d+$/.test(prefill)) {
          var t = today(), w = lsget('po_water_v1', {}) || {}; w.ml = w.ml || {};
          var n = parseInt(prefill, 10); w.ml[t] = Math.max(0, (n < 50 ? n * 250 : n)); lsset('po_water_v1', w); fire(); paint('water');
        }
      },
    },

    supps: {
      label: 'Supplements',
      render: function (p) { renderSuppsPanel(p); },
      add: function () {
        var q = (document.getElementById('qlog').value || '').trim();
        if (q) { var r = L.log({ type: 'supplement', name: q }); UI.toast(r.message || 'Done'); if (r.ok) { document.getElementById('qlog').value = ''; paint('supps'); } }
      },
    },

    mind: {
      label: 'Mind',
      render: function (p) {
        var t = today();
        var m = (lsget('mind:mood:v1', []) || []).filter(function (e) { return e.date === t; })[0];
        var html = '';
        html += addBtn('Log mood');
        if (m) {
          html += '<div class="card"><div class="lg-list-head">Today</div><div class="stack" style="gap:0" data-entries>'
            + entryRow({ id: 'm', title: 'Mood', value: m.mood + '/5', sub: m.note || '' }) + '</div></div>';
        } else {
          html += '<div class="card">' + emptyState(ICONS.mind, 'No mood logged', 'How are you feeling today?', 'Log mood') + '</div>';
        }
        html += '<div class="card"><div class="lg-list-head">More</div><div class="stack" style="gap:0">'
          + linkRow('Journal, gratitude, meditate', 'mood.html') + '</div></div>';
        p.innerHTML = html;
        wireAdd(p, function () { moodSheet(); });
        wireEntries(p, 'mind');
      },
      add: function (prefill) { moodSheet({ note: prefill || '' }); },
      del: function () {
        var t = today(), arr = lsget('mind:mood:v1', []), i = arr.findIndex(function (e) { return e.date === t; });
        if (i < 0) return null; var it = arr[i]; arr.splice(i, 1); lsset('mind:mood:v1', arr); fire();
        return function () { var a = lsget('mind:mood:v1', []); a.push(it); lsset('mind:mood:v1', a); fire(); };
      },
      edit: function () { moodSheet((lsget('mind:mood:v1', []) || []).filter(function (e) { return e.date === today(); })[0]); },
    },

    habits: {
      label: 'Habits',
      render: function (p) {
        var defs = lsget('habits:v1', []) || [], t = today(), logs = lsget('habits:logs:v1', {}) || {}, doneToday = logs[t] || [];
        if (!defs.length) {
          p.innerHTML = '<div class="card">' + emptyState(ICONS.habits, 'No habits yet', 'Create habits to build streaks.', 'Manage habits') + '</div>';
          wireAdd(p, function () { location.href = '../habits.html'; });
          return;
        }
        var rows = defs.map(function (h) {
          var id = h.id != null ? h.id : (h.name || h.title);
          var on = doneToday.some(function (x) { return String(x) === String(id); });
          return '<div class="lg-switch-row" data-h="' + esc(id) + '"><div class="row-main"><div class="row-title">' + esc(h.name || h.title || 'Habit') + '</div></div>'
            + '<div class="toggle" role="switch" aria-checked="' + on + '" tabindex="0"></div></div>';
        }).join('');
        var done = doneToday.length;
        var html = '<div class="card"><div class="card-head"><span class="card-title">Today</span><span class="badge violet">' + done + ' / ' + defs.length + '</span></div>'
          + '<div class="stack" style="gap:0">' + rows + '</div>'
          + '<div class="lg-foot"><a href="../habits.html">Manage habits &amp; streaks</a></div></div>';
        p.innerHTML = html;
        p.querySelectorAll('[data-h]').forEach(function (row) {
          var sw = row.querySelector('.toggle');
          function flip() {
            var id = row.getAttribute('data-h');
            var lg = lsget('habits:logs:v1', {}) || {}, arr = (lg[t] || []).filter(function (x) { return String(x) !== String(id); });
            var nowOn = sw.getAttribute('aria-checked') !== 'true';
            if (nowOn) arr.push(id);
            lg[t] = arr; lsset('habits:logs:v1', lg); fire();
            sw.setAttribute('aria-checked', nowOn ? 'true' : 'false');
            paint('habits');
          }
          sw.addEventListener('click', flip);
          sw.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
        });
      },
      add: function () { location.href = '../habits.html'; },
    },
  };

  /* ============================================================
     Wiring helpers shared by panels.
     ============================================================ */
  function wireAdd(p, fn) {
    p.querySelectorAll('[data-add]').forEach(function (b) { b.addEventListener('click', fn); });
    var eb = p.querySelector('.lg-empty-add'); if (eb) eb.addEventListener('click', fn);
  }
  function wireEntries(p, segId) {
    var groups = p.querySelectorAll('[data-entries]'); if (!groups.length) return;
    groups.forEach(function (g) {
      g.addEventListener('click', function (e) {
        var editBtn = e.target.closest('[data-edit]');
        var delBtn = e.target.closest('[data-del]');
        var seg = C[segId];
        if (editBtn) { var eid = editBtn.getAttribute('data-edit'); if (seg.edit) seg.edit(eid); return; }
        if (delBtn) {
          var id = delBtn.getAttribute('data-del');
          var undo = seg.del ? seg.del(id) : null;
          paint(segId);
          UI.toast('Deleted', { action: 'Undo', onAction: function () { if (undo) undo(); paint(segId); }, duration: 5000 });
        }
      });
    });
  }

  /* ============================================================
     Segment control + panel rendering.
     ============================================================ */
  var ORDER = ['food', 'body', 'training', 'skin', 'water', 'supps'];
  var seg = document.getElementById('seg');
  var panels = document.getElementById('panels');
  var hashSeg = String(location.hash || '').replace(/^#/, '');
  var active = ORDER.indexOf(hashSeg) >= 0 ? hashSeg : ORDER[0];

  function panelOf(id) { return panels.querySelector('[data-panel="' + id + '"]'); }
  function paint(id) {
    var p = panelOf(id); if (!p) return;
    // localStorage reads are synchronous -> render directly, no skeleton flash.
    try { C[id].render(p); }
    catch (e) {
      p.innerHTML = '<div class="card">' + sectionErr(e && e.message) + '</div>';
      var r = p.querySelector('.lg-retry'); if (r) r.addEventListener('click', function () { paint(id); });
    }
  }

  ORDER.forEach(function (id, i) {
    var b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    b.dataset.value = id;
    b.innerHTML = (TAB_ICONS[id] || '') + '<span>' + esc(C[id].label) + '</span>';
    b.id = 'seg-' + id;
    seg.appendChild(b);
    var pn = document.createElement('section');
    pn.className = 'lg-panel'; pn.setAttribute('role', 'tabpanel');
    pn.dataset.panel = id; pn.setAttribute('aria-labelledby', 'seg-' + id);
    if (i !== 0) pn.hidden = true;
    panels.appendChild(pn);
  });

  function select(val) {
    active = val;
    seg.querySelectorAll('[role="tab"]').forEach(function (t) {
      var on = t.dataset.value === val;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    panels.querySelectorAll('.lg-panel').forEach(function (p) { p.hidden = p.dataset.panel !== val; });
    if (location.hash.replace(/^#/, '') !== val) {
      try { history.replaceState(null, '', '#' + val); } catch (_) {}
    }
    paint(val);
  }
  // click + arrow-key nav on the shared segmented control
  seg.querySelectorAll('[role="tab"]').forEach(function (tab, idx) {
    var tabs = seg.querySelectorAll('[role="tab"]');
    tab.addEventListener('click', function () { select(tab.dataset.value); });
    tab.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' && tabs[idx + 1]) tabs[idx + 1].focus();
      if (e.key === 'ArrowLeft' && tabs[idx - 1]) tabs[idx - 1].focus();
      if (e.key === 'Home') tabs[0].focus();
      if (e.key === 'End') tabs[tabs.length - 1].focus();
    });
  });

  /* quick-log field: route into the active segment's add() */
  var qlog = document.getElementById('qlog');
  var dateEl = document.getElementById('date');
  if (dateEl) {
    try {
      dateEl.textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());
    } catch (_) {
      dateEl.textContent = today();
    }
  }
  qlog.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var val = qlog.value.trim();
    if (!val) { if (C[active] && C[active].add) C[active].add(''); return; }
    if (C[active] && C[active].add) { C[active].add(val); qlog.value = ''; }
  });

  /* keep the visible segment fresh when operator/other tabs write */
  window.addEventListener('lifeos:logged', function (e) {
    if (e && e.detail && e.detail.src === 'log') return; // own writes already repaint
    paint(active);
  });

  function start() { select(active); }
  if (window.LifeOS) start();
  else window.addEventListener('lifeos:ready', start, { once: true });
})();
</script>
</body>
</html>
