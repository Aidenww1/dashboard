<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fix my data — Life OS</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body[data-page="more"] .fx-issue { border-color: rgba(242,85,90,0.3); }
  body[data-page="more"] .fx-row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-top: var(--s2); }
  body[data-page="more"] .fx-row .input { width: 130px; height: 40px; }
  body[data-page="more"] .fx-bad { color: var(--red); font-weight: 700; }
</style>
</head>
<body data-page="more">
<div class="app">
  <main class="main">
    <div class="content">
      <header class="page-head">
        <div class="page-head-l"><h1 class="t-page">Fix my data</h1><div class="page-date">Catch impossible numbers in your logs</div></div>
        <div class="page-head-r"><a class="btn btn-ghost btn-sm" href="more.html">‹ More</a></div>
      </header>
      <div class="t-2" style="margin-bottom:var(--s4);max-width:640px">Scans your gym, bodyweight, and measurement logs for impossible numbers (typos like a 350,000&nbsp;kg lift). Edit or delete each. Sleep and bloodwork use varied units and aren't scanned here.</div>
      <div class="t-2" id="status" style="min-height:18px;color:var(--green);margin-bottom:var(--s2)"></div>
      <div id="list" class="stack"></div>
    </div>
  </main>
</div>

<script src="../dates.js"></script>
<script src="../fixdata.js"></script>
<script src="../cloudsync.js"></script>
<script src="ui.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  'use strict';
  var PC_KEYS = ['po_coach_v1', 'po_coach_workout_done', 'po_coach_weights', 'po_coach_photos', 'body:logs', 'gym:cardio:v1', 'gym:templates:v1', 'gym:prs:v1'];
  function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var listEl = document.getElementById('list'), statusEl = document.getElementById('status');
  if (!window.FixData) { listEl.innerHTML = '<div class="section-error"><span>Scanner unavailable.</span></div>'; return; }

  function render() {
    var issues = window.FixData.scan(load);
    listEl.innerHTML = '';
    if (!issues.length) { listEl.innerHTML = '<div class="card"><div class="empty"><span class="empty-title">No anomalies found</span><span>Your logs look clean.</span></div></div>'; return; }
    issues.forEach(function (iss) {
      var card = document.createElement('div'); card.className = 'card fx-issue';
      card.innerHTML = '<div class="t-cap"><b style="color:var(--text-2)">' + esc(iss.label) + '</b>' + (iss.when ? ' · ' + esc(iss.when) : '') + ' · current <span class="fx-bad">' + esc(String(iss.value)) + '</span></div>'
        + '<div class="fx-row"><input class="input num" type="number" value="' + esc(iss.value) + '"><button class="btn btn-primary btn-sm" data-save>Save</button><button class="btn btn-danger btn-sm" data-del>' + (iss.kind === 'meas' ? 'Clear value' : 'Delete') + '</button></div>';
      card.querySelector('[data-save]').addEventListener('click', function () {
        var v = parseFloat(card.querySelector('input').value);
        if (!isFinite(v)) { statusEl.textContent = 'Enter a number first.'; return; }
        window.FixData.apply(load, save, iss, v); statusEl.textContent = 'Fixed ' + iss.label + '.'; render();
      });
      card.querySelector('[data-del]').addEventListener('click', function () {
        UI.confirm({ title: 'Delete this ' + iss.label + ' entry?', body: 'This cannot be undone.', onConfirm: function () {
          window.FixData.apply(load, save, iss, undefined); statusEl.textContent = 'Removed ' + iss.label + '.'; render();
        } });
      });
      listEl.appendChild(card);
    });
  }
  if (window.LifeOSSync) { try { LifeOSSync.register('po-coach', PC_KEYS, { onApply: render }); } catch (e) {} }
  render();
})();
</script>
</body>
</html>
