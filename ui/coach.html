<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach — Life OS</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body[data-page="coach"] .content { max-width: 1390px; padding-top: 4px; }
  body[data-page="coach"] .t-page { font-size: 34px; letter-spacing: -0.03em; }
  body[data-page="coach"] .page-head-r { min-width: min(46vw, 620px); }

  /* top stat strip */
  .ch-stat { min-height: 96px; gap: 6px; }
  .ch-stat .card-title { color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }
  .ch-stat-body { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .ch-big { font-size: 30px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; font-variant-numeric: tabular-nums; }
  .ch-sub { font-size: 13px; }
  .ch-spark { width: 132px; height: 42px; flex-shrink: 0; }
  .ch-spark svg { width: 100%; height: 100%; overflow: visible; }
  .ch-icbox { width: 40px; height: 40px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.035); border: 1px solid var(--border); flex-shrink: 0; }
  .ch-icbox svg { width: 20px; height: 20px; }
  .ch-chev { color: var(--text-3); font-size: 20px; line-height: 1; }
  .ch-stat-link { text-decoration: none; color: inherit; }

  /* ask panel */
  .ch-ask { grid-row: span 3; }
  .ch-hello { display: flex; gap: var(--s3); align-items: flex-start; margin-top: var(--s2); }
  .ch-hello .ch-icbox { border-color: var(--accent-border); color: var(--accent); background: var(--accent-soft); }
  .ch-chips { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: var(--s4); }
  .ch-chip { display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 0 var(--s3); text-align: left;
    border-radius: var(--r-control); background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer; }
  .ch-chip:hover { background: var(--surface-hover); color: var(--text); border-color: var(--accent-border); }
  .ch-chip svg { width: 17px; height: 17px; flex-shrink: 0; color: var(--accent); }
  .ch-ask-form { display: flex; gap: var(--s2); margin-top: auto; padding-top: var(--s4); }
  .ch-ask-form .input { height: 52px; }
  .ch-send { width: 52px; height: 52px; min-height: 52px; padding: 0; flex-shrink: 0; }
  .ch-send svg { width: 19px; height: 19px; }

  /* briefing / plans lines */
  .ch-line { display: flex; align-items: center; gap: var(--s3); padding: 7px 0; }
  .ch-line + .ch-line { border-top: 1px solid var(--border); }
  .ch-line .ch-lic { width: 20px; height: 20px; flex-shrink: 0; color: var(--text-3); }
  .ch-line .ch-lic svg { width: 100%; height: 100%; }
  .ch-line .lbl { width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 500; }
  .ch-line .val { flex: 1; min-width: 0; color: var(--text-2); font-size: 13px; }
  .ch-line .end { color: var(--text-3); font-size: 12px; flex-shrink: 0; }

  /* signal tiles */
  .ch-signals { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s2); }
  .ch-tile { border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,0.024); padding: var(--s2); display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; }
  .ch-tile:hover { background: var(--surface-hover); }
  .ch-tile svg { width: 16px; height: 16px; color: var(--text-3); margin-bottom: 2px; }
  .ch-tile .n { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

  /* recommendations */
  .ch-rec { display: grid; grid-template-columns: 20px 88px 1fr auto; gap: var(--s3); align-items: center; padding: 7px 0; font-size: 13px; }
  .ch-rec + .ch-rec { border-top: 1px solid var(--border); }
  .ch-rec svg { width: 18px; height: 18px; }
  .ch-rec .txt { color: var(--text-3); min-width: 0; }
  .ch-rec .st { font-size: 12px; font-weight: 600; }

  /* drivers */
  .ch-driver { display: grid; grid-template-columns: 20px 76px 1fr 62px 48px; gap: var(--s2); align-items: center; padding: 6px 0; }
  .ch-driver svg { width: 17px; height: 17px; color: var(--text-3); }

  /* follow-up queue */
  .ch-fu { display: grid; grid-template-columns: 20px 1fr auto auto; gap: var(--s3); align-items: center; padding: 6px 0; font-size: 13px; }
  .ch-fu + .ch-fu { border-top: 1px solid var(--border); }
  .ch-fu .idx { width: 20px; height: 20px; border-radius: 5px; background: var(--surface-raised); color: var(--text-3); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
  .ch-fu .tag, .ch-fu .when { color: var(--text-3); font-size: 12px; }
  .ch-fu .when { width: 74px; text-align: right; }

  /* footer bar */
  .ch-foot { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--s4); color: var(--text-3); font-size: 13px; }
  .ch-foot .inline svg { width: 16px; height: 16px; }

.ch-tabs{display:flex;align-items:center;gap:4px;margin:0 0 14px;padding:5px;border:1px solid var(--border);background:var(--surface);border-radius:8px;min-height:46px}
.ch-tabs button{flex:1 1 0;min-width:100px;height:36px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.ch-tabs button:hover{color:var(--text);background:var(--surface-2)}
.ch-tabs button[aria-selected="true"]{color:var(--text);background:rgba(124,58,237,.24);box-shadow:inset 0 0 0 1px rgba(168,85,247,.24)}
.ch-view-title{grid-column:1/-1;display:flex;align-items:end;justify-content:space-between;gap:16px;margin:2px 2px -2px}
.ch-view-title h2{margin:0;font-size:18px;letter-spacing:0}
.ch-view-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
#coach>.card{grid-column:span 4}
#coach>.card.ch-wide{grid-column:span 8}
#coach>.card.ch-full{grid-column:1/-1}
.ch-kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ch-kpi{min-height:116px;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.ch-kpi-label{color:var(--muted);font-size:11px;text-transform:uppercase}
.ch-kpi-value{margin-top:12px;font-size:26px;font-weight:700}
.ch-kpi-sub{margin-top:5px;color:var(--muted);font-size:12px}
.ch-list{display:grid;gap:0}
.ch-row{display:grid;grid-template-columns:minmax(120px,.75fr) minmax(0,1.8fr) auto;align-items:center;gap:14px;min-height:48px;padding:9px 0;border-bottom:1px solid var(--border)}
.ch-row:last-child{border-bottom:0}
.ch-row strong{font-size:13px}
.ch-row span,.ch-row small{color:var(--muted);font-size:12px}
.ch-row .ch-action{color:var(--accent);white-space:nowrap}
.ch-empty{display:grid;place-items:center;min-height:190px;padding:28px;text-align:center;color:var(--muted)}
.ch-empty strong{display:block;margin-bottom:7px;color:var(--text);font-size:15px}
.ch-empty .btn{margin-top:15px}
.ch-meter{height:7px;margin-top:10px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ch-meter span{display:block;height:100%;border-radius:inherit;background:var(--green)}
.ch-driver-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ch-driver-card{padding:13px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.ch-driver-card header{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
.ch-driver-card strong{color:var(--text);font-size:16px}
.ch-ask-panel{min-height:420px}
.ch-prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0}
.ch-prompt{min-height:42px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);text-align:left;cursor:pointer}
.ch-prompt:hover{border-color:var(--accent);color:var(--accent)}
.ch-answer{min-height:92px;margin:14px 0;padding:15px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--muted);line-height:1.55}
.ch-ask-form{display:grid;grid-template-columns:1fr auto;gap:8px}
.ch-ask-form input{min-width:0}
.ch-status{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px}
.ch-status.off{color:var(--muted)}
.ch-review-card{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.ch-review-card:last-child{border-bottom:0}
.ch-error{grid-column:1/-1;padding:28px;border:1px solid var(--red);border-radius:8px;background:var(--surface);text-align:center}
@media (max-width:900px){
  .ch-tabs{flex-wrap:wrap;gap:4px}
  .ch-tabs button{flex:1 1 30%;min-width:92px}
  .ch-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  #coach>.card,#coach>.card.ch-wide,#coach>.card.ch-full{grid-column:1/-1}
}
@media (max-width:620px){
  .ch-tabs button{flex:1 1 30%;min-width:0;font-size:12px}
  .ch-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ch-kpi{min-height:102px;padding:13px}
  .ch-kpi-value{font-size:22px}
  .ch-driver-grid,.ch-prompts{grid-template-columns:1fr}
  .ch-row{grid-template-columns:1fr auto;gap:5px 10px}
  .ch-row span{grid-column:1/-1}
  .ch-review-card{grid-template-columns:1fr auto}
  .ch-review-card span{grid-column:1/-1}
  .ch-ask-form{grid-template-columns:1fr}
}
  @media (max-width: 1180px) {
    .ch-signals { grid-template-columns: repeat(3, 1fr); }
    .ch-ask { grid-row: auto; }
  }
  @media (max-width: 900px) {
    body[data-page="coach"] .content { padding-top: 22px; }
    .ch-chips { grid-template-columns: 1fr; }
    .ch-signals { grid-template-columns: repeat(2, 1fr); }
    .ch-rec { grid-template-columns: 20px 1fr auto; }
    .ch-rec .txt { display: none; }
    .ch-driver { grid-template-columns: 20px 68px 1fr 56px; }
    .ch-driver .lvl { display: none; }
  }
</style>
</head>
<body data-page="coach">
<div class="app">
  <main class="main">
    <div class="content">
      <header class="page-head">
        <div class="page-head-l"><h1 class="t-page">Coach</h1><div class="page-date" id="date"></div></div>
        <div class="page-head-r">
          <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Ask coach anything about your data..." aria-label="Ask coach"></label>
          <button class="btn btn-primary" id="ask-top"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9l-4.4 3.5 1 5.8L12 15.6 7.9 18.3l1-5.8L4.5 9l5.6-1.4z"/></svg>Ask coach</button>
        </div>
      </header>
      <nav class="ch-tabs" id="coach-tabs" role="tablist" aria-label="Coach views"></nav>
<div class="grid" id="coach" role="tabpanel" aria-live="polite"></div>
    </div>
  </main>
</div>

<!-- engine + AI cache + operator (one AI engine, button-triggered) -->
<script src="../dates.js"></script>
<script src="../lifeos-core.js"></script>
<script src="../bus.js"></script>
<script src="../claude.js"></script>
<script src="../command.js"></script>
<script src="../data-registry.js"></script>
<script src="../auth.js"></script>
<script src="compatibility-store.js"></script>
<script src="../canonical-events.js"></script>
<script src="../event-repository.js"></script>
<script src="../canonical-sync.js"></script>
<script src="../projection-engine.js"></script>
<script src="../bloodwork-model-registry.js"></script>
<script src="../bloodwork-outlook.js"></script>
<script src="../projection-definitions.js"></script>
<script src="data.js?v=phase-e"></script>
<script src="ui.js"></script>
<script src="shell.js"></script>
<script src="canonical-runtime.js"></script>
<script>
(function () {
  'use strict';

  var L = window.LifeOS || {};
  var root = document.getElementById('coach');
  var tabsRoot = document.getElementById('coach-tabs');
  var answer = '';
  var asking = false;
  var coachPhase = {};
  var coachUnsubscribe = null;
  var views = [
    ['briefing', 'Briefing'],
    ['readiness', 'Readiness'],
    ['ask', 'Ask'],
    ['inbox', 'Inbox'],
    ['opportunities', 'Opportunities'],
    ['reviews', 'Reviews']
  ];

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
    });
  }

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (error) {
      return fallback;
    }
  }

  function arr(value) { return Array.isArray(value) ? value : []; }
  function obj(value) { return value && typeof value === 'object' && !Array.isArray(value) ? value : {}; }
  function phaseValue(id) { return obj(coachPhase[id] && coachPhase[id].value); }
  function currentView() {
    var hash = location.hash.replace('#', '').toLowerCase();
    return views.some(function (item) { return item[0] === hash; }) ? hash : 'briefing';
  }

  function card(title, body, cls, action) {
    return '<section class="card ' + (cls || '') + '"><div class="card-head"><h2>' + esc(title) + '</h2>' + (action || '') + '</div>' + body + '</section>';
  }

  function title(name, detail, action) {
    return '<div class="ch-view-title"><div><h2>' + esc(name) + '</h2><p>' + esc(detail) + '</p></div>' + (action || '') + '</div>';
  }

  function kpi(label, value, sub) {
    return '<div class="ch-kpi"><div class="ch-kpi-label">' + esc(label) + '</div><div class="ch-kpi-value">' + esc(value) + '</div><div class="ch-kpi-sub">' + esc(sub || '') + '</div></div>';
  }

  function empty(heading, detail, href, label) {
    return '<div class="ch-empty"><div><strong>' + esc(heading) + '</strong><div>' + esc(detail) + '</div>' + (href ? '<a class="btn btn-secondary btn-sm" href="' + esc(href) + '">' + esc(label) + '</a>' : '') + '</div></div>';
  }

  function textOf(line) {
    if (typeof line === 'string') return line;
    line = obj(line);
    var value = line.text || line.detail || line.message || line.value || '';
    if (value && typeof value === 'object') {
      value = value.subject || value.label || value.title || value.message || value.detail || '';
    }
    return value;
  }

  function labelOf(line) {
    line = obj(line);
    return line.area || line.title || line.label || line.type || 'Briefing';
  }

  function safeReadiness() {
    var canonical = phaseValue('readiness.daily');
    if (Object.keys(canonical).length) return canonical;
    try { return obj(typeof L.readiness === 'function' ? L.readiness() : {}); }
    catch (error) { return {}; }
  }

  function safeBriefing() {
    var canonical = phaseValue('coach.briefing');
    if (Object.keys(canonical).length) return canonical;
    try { return obj(typeof L.briefing === 'function' ? L.briefing() : {}); }
    catch (error) { return {}; }
  }

  function safeAttention() {
    var canonical = phaseValue('coach.followups');
    if (Array.isArray(canonical.items)) return canonical.items;
    try {
      return arr(L.data && typeof L.data.attention === 'function' ? L.data.attention() : []);
    } catch (error) { return []; }
  }
  function safeInbox() {
    var canonical = phaseValue('communications.inbox');
    return Object.keys(canonical).length ? canonical : obj(read('mail:summary:v1', {}));
  }
  function safeOpportunities() {
    var canonical = phaseValue('coach.opportunities');
    return Object.keys(canonical).length ? canonical : obj(read('radar:summary:v1', {}));
  }
  function safeReviews() {
    var canonical = phaseValue('coach.reviews');
    if (Object.keys(canonical).length) return canonical;
    var ritual = obj(read('review:ritual:v1', {}));
    return { weeks: Object.keys(ritual).sort().reverse().map(function (date) { return { date: date, answers: ritual[date] }; }), plans: arr(read('coach:plans:v1', [])) };
  }

  function briefingView() {
    var readiness = safeReadiness();
    var briefing = safeBriefing();
    var lines = arr(briefing.lines);
    var attention = safeAttention();
    var mail = safeInbox();
    var radar = safeOpportunities();
    var plans = arr(safeReviews().plans);
    var score = Number(readiness.score);
    var briefingRows = lines.length ? lines.map(function (line) {
      return '<div class="ch-row"><strong>' + esc(labelOf(line)) + '</strong><span>' + esc(textOf(line)) + '</span><small>Today</small></div>';
    }).join('') : empty('No briefing yet', 'Log health, training, nutrition, or schedule data to build today\'s briefing.');
    var attentionRows = attention.slice(0, 6).map(function (item) {
      item = obj(item);
      return '<div class="ch-row"><strong>' + esc(item.title || item.label || item.area || 'Attention') + '</strong><span>' + esc(item.detail || item.sub || item.text || item.message || 'Review this signal.') + '</span><small>' + esc(item.status || item.level || '') + '</small></div>';
    }).join('');
    var planRows = plans.slice(0, 5).map(function (plan) {
      plan = obj(plan);
      return '<div class="ch-row"><strong>' + esc(plan.title || plan.name || 'Coach plan') + '</strong><span>' + esc(plan.detail || plan.description || plan.status || '') + '</span><small>' + esc(plan.due || plan.date || '') + '</small></div>';
    }).join('');

    return title('Today\'s briefing', 'A deterministic summary of the data already in Life OS.') +
      '<div class="ch-kpis">' +
        kpi('Readiness', isFinite(score) ? Math.round(score) + '/100' : 'Not enough data', readiness.label || readiness.status || '') +
        kpi('Health attention', attention.length, attention.length ? 'Items to review' : 'Nothing flagged') +
        kpi('Inbox', mail.total_inbox == null ? 'Not connected' : mail.total_inbox, mail.total_inbox == null ? 'Connect Mail to summarize it' : arr(mail.needs_reply).length + ' need a reply') +
        kpi('Opportunities', radar.total_found == null ? 'Not scanned' : radar.total_found, radar.total_found == null ? 'Run Radar to populate this' : arr(radar.shown).length + ' shown') +
      '</div>' +
      card('Briefing', '<div class="ch-list">' + briefingRows + '</div>', 'ch-wide', '<button class="btn small" data-view="ask">Ask about this</button>') +
      card('Signals and inbox', attentionRows ? '<div class="ch-list">' + attentionRows + '</div>' : empty('No active signals', 'Nothing currently needs attention.'), '', '<button class="btn small" data-view="inbox">Open Inbox</button>') +
      card('Recent plans', planRows ? '<div class="ch-list">' + planRows + '</div>' : empty('No coach plans', 'Plans created by Coach will appear here.'), 'ch-wide') +
      card('Follow-up queue', attentionRows ? '<div class="ch-list">' + attentionRows + '</div>' : empty('Queue clear', 'There are no follow-ups waiting.'), '', '<button class="btn small" data-view="reviews">Reviews</button>');
  }

  function readinessView() {
    var readiness = safeReadiness();
    var briefing = safeBriefing();
    var attention = safeAttention();
    var parts = obj(readiness.parts || readiness.drivers || readiness.factors);
    var entries = Object.keys(parts).map(function (key) { return [key, parts[key]]; });
    var score = Number(readiness.score);
    var driverHtml = entries.length ? '<div class="ch-driver-grid">' + entries.map(function (entry) {
      var raw = obj(entry[1]);
      var value = typeof entry[1] === 'number' ? entry[1] : Number(raw.score == null ? raw.value : raw.score);
      var pct = isFinite(value) ? Math.max(0, Math.min(100, value <= 1 ? value * 100 : value)) : 0;
      var display = isFinite(value) ? Math.round(value <= 1 ? value * 100 : value) : 'No data';
      return '<div class="ch-driver-card"><header><span>' + esc(entry[0]) + '</span><strong>' + esc(display) + '</strong></header><div class="ch-meter"><span style="width:' + pct + '%"></span></div></div>';
    }).join('') + '</div>' : empty('Not enough readiness data', 'Log sleep, recovery, nutrition, hydration, and training to reveal the drivers.');
    var relevant = arr(briefing.lines).filter(function (line) {
      var haystack = (labelOf(line) + ' ' + textOf(line)).toLowerCase();
      return /sleep|recover|train|hydr|stress|body/.test(haystack);
    });
    var guidance = relevant.map(function (line) {
      return '<div class="ch-row"><strong>' + esc(labelOf(line)) + '</strong><span>' + esc(textOf(line)) + '</span><small>Current</small></div>';
    }).join('');
    return title('Readiness', 'Understand the inputs behind today\'s score.') +
      '<div class="ch-kpis">' +
        kpi('Score', isFinite(score) ? Math.round(score) : 'No score', readiness.label || readiness.status || '') +
        kpi('Drivers available', entries.length, entries.length ? 'Calculated from logged data' : 'More data needed') +
        kpi('Attention items', attention.length, attention.length ? 'Review before acting' : 'No warnings') +
        kpi('Data mode', 'Local', 'No AI call is required') +
      '</div>' +
      card('Readiness drivers', driverHtml, 'ch-wide') +
      card('Guidance', guidance ? '<div class="ch-list">' + guidance + '</div>' : empty('No guidance yet', 'Today\'s briefing has no recovery-specific guidance.'), '') +
      card('How this works', '<div class="ch-empty"><div><strong>Calculated from your logged data</strong><div>The score changes only when its source data changes. Missing inputs remain missing.</div><a class="btn" href="log.html#body">Open Body log</a></div></div>', 'ch-full');
  }

  function askView() {
    var readiness = safeReadiness();
    var mail = safeInbox();
    var radar = safeOpportunities();
    return title('Ask Coach', 'Coach runs only after you submit a question.') +
      card('Ask anything about your data', '<div class="ch-ask-panel"><p class="muted">Use one prompt or write your own. Nothing is sent until you press Ask.</p><div class="ch-prompts">' +
        ['What should I focus on today?','How is my recovery?','What needs attention?','How should I adjust training?'].map(function (prompt) { return '<button class="ch-prompt" data-prompt="' + esc(prompt) + '">' + esc(prompt) + '</button>'; }).join('') +
        '</div><div class="ch-answer" id="coach-answer">' + (answer ? esc(answer) : 'Your answer will appear here.') + '</div><form class="ch-ask-form" id="coach-ask-form"><input id="coach-question" type="text" autocomplete="off" placeholder="Ask Coach..." aria-label="Ask Coach"><button class="btn primary" type="submit" ' + (asking ? 'disabled' : '') + '>' + (asking ? 'Asking...' : 'Ask') + '</button></form></div>', 'ch-wide') +
      card('Available context', '<div class="ch-list">' +
        '<div class="ch-row"><strong>Readiness</strong><span>' + esc(readiness.score == null ? 'Not enough data' : Math.round(Number(readiness.score)) + '/100') + '</span><small class="ch-status' + (readiness.score == null ? ' off' : '') + '">' + (readiness.score == null ? 'Missing' : 'Available') + '</small></div>' +
        '<div class="ch-row"><strong>Inbox</strong><span>' + esc(mail.total_inbox == null ? 'Mail not connected' : mail.total_inbox + ' messages summarized') + '</span><small class="ch-status' + (mail.total_inbox == null ? ' off' : '') + '">' + (mail.total_inbox == null ? 'Missing' : 'Available') + '</small></div>' +
        '<div class="ch-row"><strong>Opportunities</strong><span>' + esc(radar.total_found == null ? 'Radar not scanned' : radar.total_found + ' found') + '</span><small class="ch-status' + (radar.total_found == null ? ' off' : '') + '">' + (radar.total_found == null ? 'Missing' : 'Available') + '</small></div>' +
      '</div>', '');
  }

  function inboxView() {
    var mail = safeInbox();
    var connected = mail.connected === true || mail.total_inbox != null;
    if (!connected) {
      return title('Inbox', 'Important messages without pretending Mail is connected.') + card('Mail connection', empty('Inbox not connected', 'Connect and open Mail to create a real inbox summary.', '../mail.html', 'Open Mail'), 'ch-full');
    }
    var needsReply = arr(mail.needs_reply);
    var bills = arr(mail.bills);
    var opportunities = arr(mail.opportunities);
    function mailRows(items, type) {
      return items.map(function (item) {
        item = typeof item === 'string' ? {subject:item} : obj(item);
        return '<div class="ch-row"><strong>' + esc(item.from || type) + '</strong><span>' + esc(item.subject || item.label || '') + '</span><small>' + esc(type) + '</small></div>';
      }).join('');
    }
    return title('Inbox', 'A summary from the connected Mail workflow.', '<a class="btn small" href="../mail.html">Open Mail</a>') +
      '<div class="ch-kpis">' + kpi('Total inbox', mail.total_inbox, 'Last stored summary') + kpi('Needs reply', needsReply.length, 'Actionable') + kpi('Active orders', mail.orders_active || 0, 'Tracked deliveries') + kpi('Promotions', mail.newsletters_promo || 0, 'Newsletters and promos') + '</div>' +
      card('Needs reply', needsReply.length ? '<div class="ch-list">' + mailRows(needsReply, 'Reply') + '</div>' : empty('No replies waiting', 'The stored summary has no messages marked for reply.'), 'ch-wide') +
      card('Bills and receipts', bills.length ? '<div class="ch-list">' + mailRows(bills, 'Bill') + '</div>' : empty('No bills found', 'No bills are present in the stored summary.'), '') +
      card('Mail opportunities', opportunities.length ? '<div class="ch-list">' + mailRows(opportunities, 'Opportunity') + '</div>' : empty('No mail opportunities', 'No opportunities are present in the stored summary.'), 'ch-full');
  }

  function opportunitiesView() {
    var radar = safeOpportunities();
    var shown = arr(radar.shown);
    if (radar.available === false || radar.total_found == null) {
      return title('Opportunities', 'Results appear only after a real Radar scan.') + card('Radar status', empty('No scan available', 'Run Radar to discover and rank opportunities.', '../radar.html', 'Open Radar'), 'ch-full');
    }
    var categories = {};
    shown.forEach(function (item) { item = obj(item); categories[item.cat || 'Other'] = true; });
    var rows = shown.map(function (item) {
      item = obj(item);
      return '<div class="ch-row"><strong>' + esc(item.cat || 'Opportunity') + '</strong><span>' + esc(item.title || item.label || '') + '</span><small class="ch-action">' + esc(item.action || 'Review') + '</small></div>';
    }).join('');
    return title('Opportunities', 'Stored results from the latest Radar scan.', '<a class="btn small" href="../radar.html">Open Radar</a>') +
      '<div class="ch-kpis">' + kpi('Found', radar.total_found, 'Latest scan') + kpi('Shown', shown.length, 'Stored shortlist') + kpi('Categories', Object.keys(categories).length, 'Across the shortlist') + kpi('Generated', radar.generated_at ? new Date(radar.generated_at).toLocaleDateString() : 'Unknown', 'Summary timestamp') + '</div>' +
      card('Opportunity shortlist', rows ? '<div class="ch-list">' + rows + '</div>' : empty('Shortlist empty', 'The scan found items but did not store a shortlist.'), 'ch-full');
  }

  function countAnswers(review) {
    var total = 0;
    Object.keys(obj(review)).forEach(function (key) {
      var value = review[key];
      if (typeof value === 'string' && value.trim()) total += 1;
      else if (typeof value === 'number' || typeof value === 'boolean') total += 1;
      else if (value && typeof value === 'object') total += countAnswers(value);
    });
    return total;
  }

  function reviewsView() {
    var projected = safeReviews();
    var weeks = arr(projected.weeks);
    var keys = weeks.map(function (week) { return week.date; });
    var plans = arr(projected.plans);
    var latest = weeks.length ? obj(weeks[0].answers) : {};
    var latestAnswers = countAnswers(latest);
    var reviews = weeks.map(function (week) {
      var review = obj(week.answers);
      return '<div class="ch-review-card"><strong>Week of ' + esc(week.date) + '</strong><span>' + esc(countAnswers(review) + ' answers saved') + '</span><a class="ch-action" href="../review.html">Open review</a></div>';
    }).join('');
    var planRows = plans.map(function (plan) {
      plan = obj(plan);
      return '<div class="ch-row"><strong>' + esc(plan.title || plan.name || 'Coach plan') + '</strong><span>' + esc(plan.detail || plan.description || '') + '</span><small>' + esc(plan.status || plan.due || '') + '</small></div>';
    }).join('');
    return title('Reviews', 'Weekly reflections and the plans they produce.', '<a class="btn btn-secondary btn-sm" href="../review.html">Open weekly review</a>') +
      '<div class="ch-kpis">' + kpi('Weekly reviews', keys.length, keys.length ? 'Saved locally' : 'None completed') + kpi('Latest week', keys[0] || 'No review', keys.length ? 'Most recent entry' : 'Start your first review') + kpi('Latest answers', latestAnswers, latestAnswers ? 'Questions answered' : 'No answers saved') + kpi('Coach plans', plans.length, plans.length ? 'Created plans' : 'No plans yet') + '</div>' +
      card('Review history', reviews ? '<div class="ch-list">' + reviews + '</div>' : empty('No weekly reviews', 'Complete the weekly ritual to create a review history.', '../review.html', 'Start review'), 'ch-wide') +
      card('Plans from Coach', planRows ? '<div class="ch-list">' + planRows + '</div>' : empty('No plans yet', 'Plans created from Coach will be listed here.'), '');
  }

  var renderers = {briefing:briefingView, readiness:readinessView, ask:askView, inbox:inboxView, opportunities:opportunitiesView, reviews:reviewsView};

  function paintTabs(active) {
    tabsRoot.innerHTML = views.map(function (item) {
      return '<button type="button" role="tab" data-view="' + item[0] + '" aria-selected="' + (active === item[0]) + '" tabindex="' + (active === item[0] ? '0' : '-1') + '">' + item[1] + '</button>';
    }).join('');
  }

  function render() {
    var active = currentView();
    paintTabs(active);
    try {
      root.innerHTML = renderers[active]();
    } catch (error) {
      root.innerHTML = '<div class="ch-error"><h2>This Coach view could not load</h2><p class="muted">Your data was not changed.</p><button class="btn" id="coach-retry">Retry</button></div>';
    }
    if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
  }

  function go(view) {
    if (!renderers[view]) return;
    if (location.hash === '#' + view) render();
    else location.hash = view;
  }

  async function askCoach(question) {
    question = String(question || '').trim();
    if (!question || asking) return;
    go('ask');
    asking = true;
    answer = 'Coach is reviewing your logged data...';
    render();
    try {
      if (!window.LifeOSCmd || typeof window.LifeOSCmd.ask !== 'function') throw new Error('Coach engine is unavailable.');
      var response = await window.LifeOSCmd.ask(question);
      answer = typeof response === 'string' ? response : (response && (response.answer || response.text || response.message)) || 'Coach returned no answer.';
    } catch (error) {
      answer = error && error.message ? error.message : 'Coach could not answer right now.';
    } finally {
      asking = false;
      render();
    }
  }

  document.addEventListener('click', function (event) {
    var viewButton = event.target.closest('[data-view]');
    if (viewButton) { go(viewButton.getAttribute('data-view')); return; }
    var prompt = event.target.closest('[data-prompt]');
    if (prompt) {
      go('ask');
      requestAnimationFrame(function () {
        var input = document.getElementById('coach-question');
        if (input) { input.value = prompt.getAttribute('data-prompt'); input.focus(); }
      });
      return;
    }
    if (event.target.closest('#coach-retry')) render();
  });

  tabsRoot.addEventListener('keydown', function (event) {
    var tabs = [].slice.call(tabsRoot.querySelectorAll('[role="tab"]'));
    var index = tabs.indexOf(document.activeElement);
    if (index < 0) return;
    var next = null;
    if (event.key === 'ArrowRight') next = tabs[(index + 1) % tabs.length];
    if (event.key === 'ArrowLeft') next = tabs[(index - 1 + tabs.length) % tabs.length];
    if (event.key === 'Home') next = tabs[0];
    if (event.key === 'End') next = tabs[tabs.length - 1];
    if (!next) return;
    event.preventDefault();
    next.focus();
    go(next.getAttribute('data-view'));
  });
  document.addEventListener('submit', function (event) {
    if (event.target.id !== 'coach-ask-form') return;
    event.preventDefault();
    var input = document.getElementById('coach-question');
    askCoach(input && input.value);
  });

  var topAsk = document.getElementById('ask-top');
  var topQuestion = document.getElementById('q');
  if (topAsk) topAsk.addEventListener('click', function () { askCoach(topQuestion && topQuestion.value); });
  if (topQuestion) topQuestion.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { event.preventDefault(); askCoach(topQuestion.value); }
  });
  window.addEventListener('hashchange', render);

  function loadCanonicalCoach() {
    var api = window.LifeOS && window.LifeOS.canonical;
    if (!api || typeof api.phaseH !== 'function') return;
    api.phaseH().then(function (state) { coachPhase = state || {}; render(); }).catch(function () {});
    if (!coachUnsubscribe && typeof api.subscribePhaseH === 'function') {
      coachUnsubscribe = api.subscribePhaseH(function () {
        api.phaseH().then(function (state) { coachPhase = state || {}; render(); }).catch(function () {});
      });
    }
  }
  window.addEventListener('lifeos:canonical-ready', loadCanonicalCoach);

  var date = document.getElementById('date');
  if (date) date.textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
  render();
  loadCanonicalCoach();
})();
</script>
</body>
</html>
